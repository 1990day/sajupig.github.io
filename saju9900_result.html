<body>
<main class="container">
<header><a class="brand" href="index.html">사주돼지</a><h1>나를 꿰뚫는 정밀사주</h1><p class="header-sub">성격 · 속마음 · 일 · 돈 · 연애 · 관계를 자세히 살펴보는 리포트</p><div class="test-badge" id="test-badge" hidden>TEST MODE · 실제 명식 계산</div></header>
<details class="test-panel" id="test-panel" hidden>
<summary>테스트 입력 변경하기</summary>
<p>기본값은 1990.10.07 진시 여성입니다. 다른 입력도 바로 비교할 수 있으며 실제 고객 입력에는 저장하지 않습니다.</p>
<form id="test-form">
<div class="test-grid">
<label>풀이할 이름<input id="test-name" type="text" maxlength="50" required></label>
<label>성별<select id="test-gender"><option value="F">여성</option><option value="M">남성</option></select></label>
<label>달력<select id="test-calendar"><option value="solar">양력</option><option value="lunar">음력</option></select></label>
<label>출생 연도<input id="test-year" type="number" min="1900" max="2100" required></label>
<label>월<input id="test-month" type="number" min="1" max="12" required></label>
<label>일<input id="test-day" type="number" min="1" max="31" required></label>
<label>시 (0~23)<input id="test-hour" type="number" min="0" max="23"></label>
<label>분<input id="test-minute" type="number" min="0" max="59"></label>
<label>일주 변경 기준<select id="test-dayBoundary"><option value="midnight">자정 (0시)</option><option value="lateZi">자시 시작 (23시)</option></select></label>
<label>출생지 UTC 시차<input id="test-utcOffset" type="number" min="-12" max="14"></label>
<label>일·시주 시간 보정(분)<input id="test-timeOffsetMinutes" type="number" min="-120" max="120"></label>
</div>
<div class="test-options"><label><input id="test-unknown" type="checkbox">출생시간 모름</label><label><input id="test-leap" type="checkbox">음력 윤달</label></div>
<div class="test-actions"><button type="button" class="primary" id="test-submit">다시 계산하기</button><button type="button" id="test-reset">기본값으로</button></div>
<div id="test-error" class="error" role="alert" hidden></div>
<div class="test-calculated" id="test-calculated" aria-live="polite"></div>
</form>
<p>UTC 시차 기본값 +9, 일·시주 보정 기본값 0분입니다. 진태양시·역사적 표준시·한국 음력과 중국 음력의 날짜 차이를 자동 판정하지 않습니다.</p>
</details>
<div class="loading" id="result-loading" role="status"><div class="spinner"></div><p>명식을 계산하고 풀이를 준비하고 있습니다.</p></div>
<div id="result-error" class="error" role="alert" hidden></div>
<div id="dynamic-fortune-content" hidden></div>
<footer><a class="home-btn" href="index.html">사주돼지 홈으로</a><div class="footer-brand">SAJUPIG.CO.KR</div></footer>
</main>
<script>
'use strict';
// 실서비스: 고객 입력을 사용하며 URL로 테스트 모드를 활성화하지 않습니다.
const urlParams9900 = new URLSearchParams(window.location.search);
const TEST_MODE = false;
const TEST_INPUT = Object.freeze({name:'테스트회원',calendar:'solar',gender:'F',year:1990,month:10,day:7,hour:8,minute:0,timeLabel:'진시',timeKnown:true,isLeapMonth:false,dayBoundary:'midnight',utcOffset:9,timeOffsetMinutes:0});
const TIME_BRANCH_TO_HOUR = {'자시':0,'축시':2,'인시':4,'묘시':6,'진시':8,'사시':10,'오시':12,'미시':14,'신시':16,'유시':18,'술시':20,'해시':22};
const ELEMENTS = ['木','火','土','金','水'];
const ELEMENT_KO = {'木':'목','火':'화','土':'토','金':'금','水':'수'};
const POSITION_KO = {year:'년주',month:'월주',day:'일주',time:'시주'};
const GROUP_OF = {'비견':'peer','겁재':'peer','식신':'output','상관':'output','정재':'wealth','편재':'wealth','정관':'officer','편관':'officer','정인':'resource','편인':'resource'};
const TEN_ORDER = Object.keys(GROUP_OF);
let testOverride = null;
let renderTicket = 0;
const escapeHtml = value => String(value ?? '');
function integer(value,label,min,max) {
  if (value === null || value === undefined || String(value).trim() === '' || !/^-?\d+$/.test(String(value).trim())) throw new Error(`${label}을 정확히 입력해 주세요.`);
  const num = Number(value);
  if (!Number.isSafeInteger(num) || num < min || num > max) throw new Error(`${label}은 ${min}~${max} 범위로 입력해 주세요.`);
  return num;
}
function readStoredInput() {
  const get = key => sessionStorage.getItem(key);
  const timeLabel = (get('saju_time') || '').trim();
  const unknown = ['모름','시간 모름','시간미상','시간 미입력','미상','unknown','none'].includes(timeLabel.toLowerCase());
  const rawHour = get('saju_hour');
  const hasHour = rawHour !== null && rawHour.trim() !== '';
  const branchHour = TIME_BRANCH_TO_HOUR[timeLabel];
  const timeKnown = !unknown && get('saju_time_known')!=='false' && (hasHour || branchHour !== undefined);
  const storedCalendar=get('saju_calendar') || 'solar';
  const rawGender = String(get('saju_gender') || 'F').trim().toLowerCase();
  const normGender = ['m','male','남','남자','남성','1'].includes(rawGender) ? 'M' : 'F';
  return {name:get('saju_name') || '회원',calendar:storedCalendar==='lunar-leap'?'lunar':storedCalendar,gender:normGender,year:get('saju_year'),month:get('saju_month'),day:get('saju_day'),
    hour:timeKnown ? (hasHour ? rawHour : branchHour) : 12,minute:timeKnown ? (get('saju_minute') || 0) : 0,timeKnown,timeLabel,
    isLeapMonth:storedCalendar==='lunar-leap' || ['1','true','yes','y','윤달','leap'].includes((get('saju_is_leap') || get('saju_isLeap') || get('saju_leap_month') || '').toLowerCase()),
    dayBoundary:get('saju_day_boundary') || 'midnight',utcOffset:get('saju_utc_offset') ?? 9,timeOffsetMinutes:get('saju_time_offset') ?? 0};
}
function validateInput(raw) {
  // 고객 이름은 입력 페이지에서 saju_name으로 전달합니다. 알 수 없는 회원 객체를 추측하지 않습니다.
  const name=String(raw.name || (TEST_MODE ? TEST_INPUT.name : '회원')).trim();
  if (name.length>50 || /[\u0000-\u001f\u007f]/.test(name)) throw new Error('이름을 확인해 주세요.');
  if (!['solar','lunar'].includes(raw.calendar)) throw new Error('양력 또는 음력을 선택해 주세요.');
  if (!['F','M'].includes(raw.gender)) throw new Error('성별을 선택해 주세요.');
  if (!['midnight','lateZi'].includes(raw.dayBoundary)) throw new Error('일주 변경 기준을 확인해 주세요.');
  const input = {...raw,name,year:integer(raw.year,'출생 연도',1900,2100),month:integer(raw.month,'출생 월',1,12),day:integer(raw.day,'출생 일',1,31),
    timeKnown:raw.timeKnown !== false,isLeapMonth:Boolean(raw.isLeapMonth),utcOffset:integer(raw.utcOffset ?? 9,'출생지 표준시',-12,14),timeOffsetMinutes:integer(raw.timeOffsetMinutes ?? 0,'시간 보정',-120,120)};
  if (input.calendar === 'solar') {
    if (input.isLeapMonth) throw new Error('윤달은 음력 날짜를 선택했을 때만 적용할 수 있습니다.');
    const date = new Date(Date.UTC(input.year,input.month-1,input.day));
    if (date.getUTCFullYear() !== input.year || date.getUTCMonth()+1 !== input.month || date.getUTCDate() !== input.day) throw new Error('존재하지 않는 양력 날짜입니다.');
  }
  input.hour = input.timeKnown ? integer(raw.hour,'출생 시',0,23) : 12;
  input.minute = input.timeKnown ? integer(raw.minute ?? 0,'출생 분',0,59) : 0;
  input.timeLabel = input.timeKnown ? (raw.timeLabel || `${input.hour}시 ${String(input.minute).padStart(2,'0')}분`) : '시간 모름';
  return input;
}
function getInputData() {
  if(!TEST_MODE) return validateInput(readStoredInput());
  if(testOverride) return validateInput(testOverride);
  if(sessionStorage.getItem('saju_result_test')==='true' && sessionStorage.getItem('saju_product')==='saju9900') return validateInput(readStoredInput());
  return validateInput({...TEST_INPUT});
}
function shiftSolar(solar,minutes) {
  const date = new Date(Date.UTC(solar.getYear(),solar.getMonth()-1,solar.getDay(),solar.getHour(),solar.getMinute()+minutes,solar.getSecond()));
  return Solar.fromYmdHms(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),date.getUTCHours(),date.getUTCMinutes(),date.getUTCSeconds());
}
function getPillars(input) {
  if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') throw new Error('계산 파일을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.');
  let solar;
  if (input.calendar === 'lunar') {
    const month = input.isLeapMonth ? -input.month : input.month;
    const lunar = Lunar.fromYmdHms(input.year,month,input.day,input.hour,input.minute,0);
    solar = lunar.getSolar();
    const checked = solar.getLunar();
    if (checked.getYear() !== input.year || checked.getMonth() !== month || checked.getDay() !== input.day) throw new Error('존재하지 않는 음력 날짜 또는 윤달입니다.');
  } else solar = Solar.fromYmdHms(input.year,input.month,input.day,input.hour,input.minute,0);
  // 라이브러리 절기 표는 UTC+8. 년·월주는 같은 순간의 UTC+8 시각으로 판정합니다.
  // 일·시주는 출생지의 시각을 사용하며, 선택한 시간 보정은 일·시주에만 적용합니다.
  const termSolar = shiftSolar(solar,(8-input.utcOffset)*60);
  const termEc = termSolar.getLunar().getEightChar();
  const clockSolar = shiftSolar(solar,input.timeKnown ? input.timeOffsetMinutes : 0);
  const clockEc = clockSolar.getLunar().getEightChar();
  clockEc.setSect(input.dayBoundary === 'lateZi' ? 1 : 2);
  const pillars = {year:termEc.getYear(),month:termEc.getMonth(),day:clockEc.getDay(),time:''};
  if (input.timeKnown) {
    // 23시 자정 기준에서 라이브러리 일간과 시주 일간이 달라지는 문제를 피하기 위해
    // 선택된 일간으로 오서둔(시간 천간)을 직접 계산합니다.
    const timeBranch = clockEc.getTime()[1];
    const stemIndex = Object.keys(STEM_INFO).indexOf(pillars.day[0]);
    const branchIndex = Object.keys(BRANCH_INFO).indexOf(timeBranch);
    pillars.time = Object.keys(STEM_INFO)[((stemIndex%5)*2+branchIndex)%10]+timeBranch;
  }
  const keys = input.timeKnown ? ['year','month','day','time'] : ['year','month','day'];
  if (keys.some(key => !STEM_INFO[pillars[key]?.[0]] || !BRANCH_INFO[pillars[key]?.[1]])) throw new Error('명식 계산값을 확인할 수 없습니다.');
  const solarDate = `${solar.getYear()}.${String(solar.getMonth()).padStart(2,'0')}.${String(solar.getDay()).padStart(2,'0')}`;
  const termDay = termEc.getDay();
  // 시간이 없고 그날 정오의 년·월주를 사용할 경우 해당 날짜에 절기 경계가 있는지 확인합니다.
  let boundaryUncertain = false;
  if (!input.timeKnown) {
    const early = Solar.fromYmdHms(solar.getYear(),solar.getMonth(),solar.getDay(),0,0,0);
    const late = Solar.fromYmdHms(solar.getYear(),solar.getMonth(),solar.getDay(),23,59,59);
    const a = shiftSolar(early,(8-input.utcOffset)*60).getLunar().getEightChar();
    const b = shiftSolar(late,(8-input.utcOffset)*60).getLunar().getEightChar();
    boundaryUncertain = a.getYear() !== b.getYear() || a.getMonth() !== b.getMonth();
  }
  return {pillars,extra:{timeKnown:input.timeKnown,keys,hideGan:Object.fromEntries(keys.map(key=>[key,HIDDEN_STEMS[pillars[key][1]] || []])),solarDate,boundaryUncertain,source:'lunar-javascript@1.7.7',termDay}};
}
function getTenGod(dayStem,targetStem) {
  const day=STEM_INFO[dayStem], target=STEM_INFO[targetStem];
  if (!day || !target) return '';
  const same = day.yy === target.yy;
  if (day.element===target.element) return same?'비견':'겁재';
  if (GENERATES[day.element]===target.element) return same?'식신':'상관';
  if (CONTROLS[day.element]===target.element) return same?'편재':'정재';
  if (CONTROLS[target.element]===day.element) return same?'편관':'정관';
  if (GENERATES[target.element]===day.element) return same?'편인':'정인';
  return '';
}
function getStructures(pillars,keys) {
  const result=[];
  const add=(type,pair,positions) => result.push({type,pair,positions});
  const pairs={
    '천간합':[['甲','己'],['乙','庚'],['丙','辛'],['丁','壬'],['戊','癸']],

        storage: { water:'辰', fire:'戌', metal:'丑', wood:'未' },
        general: { water:'子', fire:'午', metal:'酉', wood:'卯' }
      };

      return table[type]?.[group] || '';
    }

        if (position) existing.positions.push(position);
      } else {
        found.push({

          positions: position ? [position] : []
        });
      }
    }

  const twelveShinsalTable = {
    water: {

    },
    wood: {
      '겁살': '申',

      '천살': '戌',
      '지살': '亥',

    },
    metal: {
      '겁살': '寅',
      '재살': '卯',
      '천살': '辰',
      '지살': '巳',
      '년살': '午',

      '망신살': '申',

      '반안살': '戌',
      '역마살': '亥',
      '육해살': '子',

    }
  };

  const twelveWeight = {
    '겁살': 8,
    '재살': 8,
    '천살': 7,
    '지살': 7,

    '월살': 7,

    '장성살': 9,
    '반안살': 7,
    '역마살': 9,
    '육해살': 7,
    '화개살': 9
  };

  const applyTwelveShinsal = (basisBranch, basisLabel, multiplier) => {
    const group = getSamhapGroup(basisBranch);
    const table = twelveShinsalTable[group];

    if (!table) return;

    Object.entries(table).forEach(([name, target]) => {
      if (!SHINSAL_DESC[name]) return;

      if (hasBranch(target)) {
        const baseScore = twelveWeight[name] || 7;
        addShinsal(
          found,
          name,
          Math.round(baseScore * multiplier),
          `${basisLabel}를 기준으로 ${name}의 흐름이 잡힙니다.`,
          `${basisLabel} 기준 ${target}`
        );
      }
    });
  };

  const ganZhi60 = [
    '甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉',
    '甲戌','乙亥','丙子','丁丑','戊寅','己卯','庚辰','辛巳','壬午','癸未',
    '甲申','乙酉','丙戌','丁亥','戊子','己丑','庚寅','辛卯','壬辰','癸巳',
    '甲午','乙未','丙申','丁酉','戊戌','己亥','庚子','辛丑','壬寅','癸卯',
    '甲辰','乙巳','丙午','丁未','戊申','己酉','庚戌','辛亥','壬子','癸丑',
    '甲寅','乙卯','丙辰','丁巳','戊午','己未','庚申','辛酉','壬戌','癸亥'
  ];

  const gongmangByStart = {
    0: ['戌','亥'],
    10: ['申','酉'],
    20: ['午','未'],
    30: ['辰','巳'],
    40: ['寅','卯'],
    50: ['子','丑']
  };

  const addGongmang = () => {
    if (!SHINSAL_DESC['공망']) return;

    const dayIndex = ganZhi60.indexOf(a.pillars.day);
    if (dayIndex < 0) return;

    const start = Math.floor(dayIndex / 10) * 10;
    const emptyBranches = gongmangByStart[start] || [];

    emptyBranches.forEach(target => {
      if (hasBranch(target)) {
        addShinsal(
          found,
          '공망',

          `공망 ${target}`

      }

  addIfAnyBranch(
    '천을귀인',
    cheoneul[a.dayStem] || [],

  addIfBranch(
    '문창귀인',
    moonchang[a.dayStem],
    18,

  addIfBranch(

    yangin[a.dayStem],
    17,
    `자기 힘과 돌파력이 강하게 작동합니다.`,
    `일간 기준`
  );

  addIfAnyBranch(
    '태극귀인',
    taeguk[a.dayStem] || [],
    12,
    `깊은 이해력과 보호받는 흐름이 있습니다.`,
    `일간 기준`
  );

  addIfChar(
    '천덕귀인',
    cheondeok[a.monthBranch],
    15,
    `일이 크게 꼬이기 전에 완화되는 덕의 흐름이 있습니다.`,
    `월지 기준`
  );

  const monthGroup = getSamhapGroup(a.monthBranch);
  const wd = woldeok[monthGroup];

  if (wd && hasStem(wd) && SHINSAL_DESC['월덕귀인']) {
    addShinsal(
      found,
      '월덕귀인',
      15,
      `사회적 도움과 평판의 덕이 들어오는 흐름이 있습니다.`,
      `월지 삼합 기준 천간 ${wd}`
    );
  }

  addIfBranch(
    '금여록',
    geumyeo[a.dayStem],
    10,
    `생활의 안정감, 품위, 호감으로 이어지는 흐름이 있습니다.`,
    `일간 기준`
  );

  addIfBranch(
    '암록',
    amrok[a.dayStem],
    10,
    `겉으로 드러나지 않는 숨은 도움과 저장된 복이 작동합니다.`,
    `일간 기준`
  );

  const dayPeach = getSamhapTarget(a.dayBranch, 'peach');
  const yearPeach = getSamhapTarget(a.yearBranch, 'peach');

  addIfBranch(
    '도화살',
    dayPeach,
    16,
    `개인 매력과 분위기가 사람들의 시선을 끄는 흐름입니다.`,
    `일지 기준`
  );

  applyTwelveShinsal(a.dayBranch, '일지', 1.1);
  applyTwelveShinsal(a.yearBranch, '년지', 0.8);

  const hyeonchimCount = allChars.filter(char => ['甲','辛','卯','酉'].includes(char)).length;

  if (hyeonchimCount >= 2 && SHINSAL_DESC['현침살']) {

  const dayLonelyGroup = getLonelyGroup(a.dayBranch);

  if (dayLonelyGroup) {
    addIfBranch(
      '고신살',
      dayLonelyGroup.gosin,

      '과숙살',

  if (yearLonelyGroup) {
    addIfBranch(
      '고신살',

    );

    addIfBranch(
      '과숙살',

  }

  const sangmunTarget = getMovedBranch(a.yearBranch, 2);
  const jogaekTarget = getMovedBranch(a.yearBranch, -2);

  addIfBranch(
    '상문살',
    sangmunTarget,
    7,
    `삶의 무게와 책임을 깊게 받아들이는 흐름이 있습니다.`,
    `년지 기준`
  );

  addIfBranch(
    '조객살',
    jogaekTarget,
    7,
    `타인의 감정과 분위기를 민감하게 흡수하는 흐름이 있습니다.`,
    `년지 기준`
  );

  return found.map(item => ({...item, reasons: [...new Set(item.reasons)], positions: [...new Set(item.positions)]})).sort((x,y) => x.name.localeCompare(y.name, 'ko'));
}

}

 peer:['본인이 맡은 결과에 맞는 결정권이 있을 때 업무의 장점이 드러나는 방향입니다. 책임만 받고 방법은 모두 지시받는 환경보다, 목표를 합의한 뒤 실행 방법을 선택할 수 있는 역할이 편할 수 있습니다.','자기 방식의 완성도를 지키느라 협업의 속도를 놓치는 상황을 살펴야 합니다. 상대의 요청이 잘못됐다는 결론부터 내기보다 결과가 필요한 이유를 확인하면 지켜야 할 기준과 바꿀 수 있는 방법이 구분됩니다.','실무와 결정이 가까운 역할을 살펴볼 수 있습니다. 담당한 일의 결과를 직접 확인할 수 있어야 판단을 고치기 쉽고, 여러 승인 단계에서 이유 없이 방법만 바뀌는 업무는 피로가 커질 수 있습니다.','업무를 선택할 때는 독립적으로 일할 수 있다는 말의 실제 의미를 확인하는 것이 중요합니다. 혼자 모든 책임을 지는 구조인지, 필요한 협의와 지원을 받으면서 선택할 수 있는 구조인지에 따라 일의 지속 가능성이 달라집니다.'],
 output:['아이디어나 기술을 실제 결과로 옮기는 업무가 중심이 되는 방향입니다. 기획, 제작, 설명, 개선처럼 결과를 만들고 반응을 확인하는 과정에서 자신의 강점을 알아보기 쉽습니다.','잘하는 사람이 계속 추가 일을 받는 환경에서는 분량이 늘어도 평가가 따라오지 않을 수 있습니다. 결과를 만들었다는 사실과 그 과정의 부담을 기록해두면 자신의 기여를 설명하고 범위를 협의하기 쉬워집니다.','작게 만들고 검토한 뒤 개선할 수 있는 환경이 어울립니다. 처음부터 수정 없는 정답을 요구하거나 반대로 끝낼 기준 없이 계속 새 결과만 요청하는 환경은 장점을 쓰면서도 피로가 쌓이기 쉽습니다.','직업 이름보다 하루의 작업 흐름을 확인하는 편이 맞습니다. 생각을 표현할 시간, 실제로 만들 자원, 검토받을 기준이 연결되어 있는지 보면 자신에게 필요한 조건이 훨씬 분명하게 드러납니다.'],
 wealth:['사람과 자원이 실제 성과로 이어지도록 조율하는 업무가 중심이 되는 방향입니다. 비용, 일정, 거래, 운영처럼 여러 조건을 비교하고 현실적인 선택을 하는 역할에서 장점을 사용하기 좋습니다.','성과만 확인하고 후속 관리가 보이지 않는 환경에서는 숨은 업무를 떠안을 수 있습니다. 숫자에 드러나는 결과와 그 결과를 유지하기 위한 연락, 정산, 수정의 분량을 함께 확인할 필요가 있습니다.','조건을 비교하고 협상한 뒤 결과를 끝까지 관리할 수 있는 역할이 어울립니다. 다만 정재와 편재의 실제 배치에 따라 반복되는 운영을 잘 맞추는 쪽과 새 거래를 연결하는 쪽의 비중은 달라집니다.','직업을 고를 때는 실적을 만들 수 있다는 말보다 실적이 자신의 보상으로 연결되는 조건을 보는 편이 좋습니다. 목표가 바뀔 때 자원과 평가 기준도 함께 바뀌는지 확인해야 책임만 커지는 구조를 줄일 수 있습니다.'],
 officer:['역할과 평가 기준이 분명한 업무에서 장점이 드러나는 방향입니다. 기준을 유지하고 문제를 대응하는 힘을 읽을 수 있어 운영 관리, 검토, 품질 확인, 책임 있는 실무 같은 조건을 살펴볼 수 있습니다.','신뢰를 받는 만큼 맡는 범위가 커지기 쉽습니다. 실제 권한은 늘지 않았는데 책임만 커지는지 확인해야 하며, 실수가 나지 않도록 개인이 계속 버티는 방식은 장기적인 업무 조건으로 보기 어렵습니다.','일을 잘하는 기준이 설명되는 환경이 어울립니다. 누군가의 기분에 따라 평가가 달라지기보다 정상 상황의 절차와 예외 상황의 대응이 구분되어 있어야 책임감을 실무의 힘으로 사용하기 쉽습니다.','직업운의 장점을 사용하려면 의무를 더 지는 것보다 책임의 범위를 명확히 하는 것이 먼저입니다. 맡을 일의 완료 조건과 어려운 판단의 승인자를 정하면 성실함이 무제한의 부담으로 굳어지는 일을 줄일 수 있습니다.'],
 resource:['이유를 이해하고 자료를 연결하는 과정에서 전문성이 쌓이는 방향입니다. 조사, 교육, 기록, 분석, 설계처럼 배운 것을 다른 사람이 사용할 수 있는 형태로 정리하는 조건을 살펴볼 수 있습니다.','충분히 준비한 뒤에만 보여주려는 태도가 강해지면 결과가 늦어질 수 있습니다. 미완성 상태를 검토받는 것과 전문성이 부족하다는 평가는 다른 문제이므로, 현재 정리된 부분부터 확인받을 수 있는 환경이 필요합니다.','한 주제를 익힐 시간이 있고 생각의 근거를 설명할 수 있는 역할이 어울립니다. 반대로 확인 없이 즉답만 반복해야 하거나 근거를 말할 기회가 없는 환경에서는 충분히 알아도 자신의 강점이 드러나기 어렵습니다.','업무를 선택할 때는 배울 수 있다는 조건과 실제로 배운 것을 써볼 수 있다는 조건을 함께 확인하는 편이 좋습니다. 지식이 쌓여도 결정이나 결과와 멀리 떨어져 있으면 만족이 줄어들 수 있습니다.']},
business:{
 peer:['스스로 방향을 정하고 운영을 통제하는 형태에 끌리기 쉬운 방향입니다. 직접 고른 방법을 끝까지 시험해볼 수 있다는 장점이 있지만, 혼자 결정하는 범위와 도움을 받을 범위를 구분해야 운영이 오래 유지됩니다.','창업을 자기 능력의 증명으로 받아들이면 사업의 조건을 바꾸는 일이 마음의 실패처럼 느껴질 수 있습니다. 잘못된 가설을 수정하는 일과 자신이 부족하다는 결론은 분리해서 보는 편이 좋습니다.','본인이 잘 아는 한 가지 제공에서 시작하고 실제 고객의 반응을 확인하는 방식이 어울립니다. 여러 분야를 한꺼번에 통제하려 하기보다 직접 확인할 수 있는 결과부터 반복해보는 쪽입니다.','동업에서는 결정권을 모두 갖는 것보다 의견이 다를 때 어떤 기준으로 결정할지 정하는 것이 중요합니다. 친분이 좋다는 사실만으로 업무의 권한과 몫이 자연스럽게 맞춰지지는 않습니다.'],
 output:['자신이 만든 결과나 숙련된 기술을 고객의 필요와 연결하는 방식이 중심입니다. 제품이나 서비스의 완성도를 보여주기 좋지만 무엇을 제공하고 어느 범위까지 책임질지를 처음부터 정해야 운영에 무리가 적습니다.','고객을 만족시키려는 마음 때문에 추가 수정과 무료 제공이 계속 늘어날 수 있습니다. 좋은 반응을 받았다는 사실과 같은 방식으로 운영해도 남는다는 사실을 따로 확인하는 것이 중요합니다.','작은 제공을 반복해 실제로 많이 요청되는 부분을 확인하는 방식이 어울립니다. 모든 요구를 한 번에 담기보다 핵심 결과를 분명히 보여주면 필요한 수정과 불필요한 추가를 구분하기 쉽습니다.','운영을 늘릴 때는 직접 만드는 분량이 얼마나 늘어나는지를 함께 봐야 합니다. 본인이 빠지면 결과가 나오지 않는 구조인지, 다른 사람도 같은 기준으로 수행할 수 있는 구조인지에 따라 다음 단계의 조건이 달라집니다.'],
 wealth:['사람과 거래, 비용을 연결해 현실적인 기회를 찾는 방식이 중심입니다. 새로운 수요를 알아보는 힘과 이미 들어온 거래를 관리하는 힘을 함께 살펴야 하며, 거래의 수보다 실제로 유지 가능한 구조가 중요합니다.','기회가 많아질수록 연락과 정산, 후속 확인도 동시에 늘어납니다. 시작하는 힘이 좋아도 종료 조건과 반복 비용을 정하지 않으면 작은 여러 일이 생활 전체를 차지할 수 있습니다.','기존 수입을 유지하는 운영과 새 제안을 검증하는 활동을 구분하는 방식이 어울립니다. 새로운 거래가 좋아 보여도 기존 약속을 지킬 자원을 빼야 한다면 전체에 미치는 영향을 먼저 확인하는 쪽입니다.','협업자의 장점보다 실제 역할과 정산 흐름을 확인하는 편이 중요합니다. 고객을 찾는 일, 결과를 제공하는 일, 비용을 받는 일이 서로 다른 사람에게 있다면 연결이 끊겼을 때 누가 해결할지도 정해야 합니다.'],
 officer:['믿고 맡길 수 있는 운영 기준을 만드는 방식이 중심입니다. 정해진 품질과 약속을 지키는 것이 고객의 재방문 이유가 될 수 있으며, 복잡한 문제가 생겼을 때 대응 절차를 정하는 힘을 살펴볼 수 있습니다.','고객과 협업자의 문제를 모두 본인의 책임으로 받아들이면 운영이 커질수록 부담도 급격히 늘 수 있습니다. 책임을 다한다는 뜻이 언제든 모든 요구를 받아준다는 뜻으로 굳어지지 않게 범위를 정할 필요가 있습니다.','제공 조건과 품질 기준이 설명되는 방식이 어울립니다. 고객이 무엇을 받을지 알고 운영자도 어느 단계에서 일을 끝낼지 알 수 있어야 신뢰가 반복되는 결과로 이어지기 쉽습니다.','시작 전에 완벽한 체계를 모두 갖추려 하기보다 실제로 반복되는 요구부터 절차로 정리하는 편이 좋습니다. 예상만으로 규칙을 너무 많이 만들면 고객의 필요가 바뀌었을 때 수정할 부담도 커집니다.'],
 resource:['깊게 익힌 주제나 독특한 기술을 실제 문제의 해결로 제공하는 방식이 중심입니다. 전문성의 가치를 드러내려면 설명이 풍부한 것과 고객이 사용할 결과가 분명한 것을 함께 갖춰야 합니다.','더 배워야 시작할 수 있다는 생각이 이어지거나, 본인이 흥미를 느끼는 내용과 고객이 필요한 내용이 달라지는 상황을 살펴야 합니다. 오래 조사했다는 이유만으로 제공의 필요가 확인되는 것은 아닙니다.','좁은 문제를 대상으로 현재 가능한 결과를 먼저 제시하는 방식이 어울립니다. 모든 지식을 담기보다 고객이 이해할 수 있는 한 가지 도움을 보여주면 실제 필요와 다음 학습 과제를 함께 확인하기 쉽습니다.','협업에서는 전문 내용의 판단과 운영의 판단을 구분할 필요가 있습니다. 본인이 깊이 아는 부분을 지키면서도 일정과 정산, 고객 안내를 맡을 사람과 기준을 나눌 수 있어야 전문성이 운영의 병목이 되지 않습니다.']},
popularity:{
 peer:['자신의 태도가 분명한 점이 사람들에게 인상을 남기는 방향입니다. 모두에게 맞추기보다 무엇을 좋아하고 어떤 선택을 하는지 드러날 때 비슷한 기준을 가진 사람이 알아보기 쉽습니다.','독립적인 태도가 거리감으로 읽히거나 다른 의견을 듣지 않는 사람처럼 전달될 수 있습니다. 자신의 기준을 설명하는 힘과 상대가 다른 기준을 갖고 있음을 인정하는 태도가 함께 필요합니다.','처음부터 넓게 친해지는 것보다 관심사가 맞는 자리에서 의견을 주고받는 방식이 어울립니다. 자신이 어떤 역할로 함께할 수 있는지 보여주면 친밀함을 억지로 만들지 않아도 관계의 접점이 생깁니다.','사람의 수보다 반복해서 편하게 만나는 관계를 기준으로 삼는 편이 좋습니다. 독립성이 있다는 이유로 먼저 말을 걸거나 도움을 받는 행동까지 줄이면 실제로 잘 맞는 사람도 자신을 알아보기 어렵습니다.'],
 output:['말과 결과, 작은 배려가 관심을 만드는 방향입니다. 자신이 이해한 것을 설명하거나 실제로 만들어 보여줄 때 사람들은 어떤 장점이 있는지 구체적으로 알아보기 쉽습니다.','주목을 받으려고 표현의 분량을 계속 늘리면 평소의 모습과 보여주는 모습 사이에 부담이 생길 수 있습니다. 반응이 작은 날에도 같은 수준의 관심을 얻으려 애쓰는 상황을 살펴야 합니다.','직접 한 일이나 관심 있는 주제를 공유하는 만남이 어울립니다. 자신을 잘 보이게 포장하는 것보다 상대에게 실제로 도움이 되거나 재미있게 느껴지는 결과가 남을 때 다음 만남의 이유도 생깁니다.','관심이 신뢰로 이어지려면 첫 표현의 매력과 이후의 일관성이 연결되어야 합니다. 말로 크게 약속하기보다 실제로 계속할 수 있는 범위만 보여주면 좋은 인상을 유지할 부담이 줄어듭니다.'],
 wealth:['사람과 사람의 필요를 연결하는 능력이 인상을 만드는 방향입니다. 상대가 무엇을 원하는지 보고 정보를 소개하거나 조건을 맞추는 과정에서 자연스럽게 존재감이 생기기 쉽습니다.','상대를 계속 챙기거나 유용한 정보를 주어야 관계가 유지된다고 느끼면 만남이 관리 업무처럼 될 수 있습니다. 도움이 되는 사람이라는 인상과 아무것도 제공하지 않아도 편한 관계는 구분해서 볼 필요가 있습니다.','공통의 활동이나 실제로 함께할 일이 있는 만남이 어울립니다. 사람을 많이 아는 것 자체보다 서로 어떤 필요를 나눌 수 있는지 설명될 때 본인의 연결 능력이 부담 없이 드러나기 쉽습니다.','관계를 넓힐 때 이미 지키고 있는 약속의 분량을 함께 살펴야 합니다. 많은 사람에게 좋은 반응을 얻는 것과 그 관계를 계속 유지할 여유가 있는 것은 다른 조건이므로 가까워지는 속도를 선택할 필요가 있습니다.'],
 officer:['태도의 일관성과 약속을 지키는 모습이 신뢰를 만드는 방향입니다. 처음부터 크게 눈에 띄지 않더라도 함께한 시간이 쌓이면서 믿고 찾는 사람이라는 인상이 남을 수 있습니다.','실망시키지 않으려 항상 좋은 태도를 유지하면 편한 자리에서도 역할을 수행하는 느낌이 생길 수 있습니다. 믿을 만한 모습과 자신의 불편을 전혀 드러내지 않는 모습이 같지는 않습니다.','같은 활동을 반복하며 서로의 태도를 알아가는 만남이 어울립니다. 한 번의 강한 인상보다 일정이 바뀌거나 문제가 생긴 뒤에도 어떻게 설명하고 해결하는지가 본인의 장점을 전달하는 통로입니다.','호감을 오래 유지하려면 요청을 잘 들어주는 것과 자신의 범위를 설명하는 일을 함께 해야 합니다. 거절을 하지 않는 태도가 신뢰의 근거가 되면 관계가 늘수록 부담도 커질 수 있습니다.'],
 resource:['깊이 있는 대화와 상대를 이해하려는 태도가 인상을 만드는 방향입니다. 빠르게 주목받기보다 관심사를 충분히 나누고 필요한 설명을 줄 때 자신이 가진 장점이 드러나기 쉽습니다.','혼자 생각한 만큼 상대도 자신을 이해할 것이라 기대하면 실제 표현은 부족할 수 있습니다. 관심이 있어도 말이나 행동으로 나타나지 않으면 상대에게는 거리감으로 전달될 수 있습니다.','서로의 질문을 충분히 다룰 수 있는 작은 만남이 어울립니다. 한 자리에서 많은 사람에게 자신을 설명하려 하기보다 공통 관심사를 중심으로 대화를 이어가면 부담은 줄고 인상은 구체적으로 남습니다.','친밀함을 만들려면 상대의 이야기를 이해한 뒤 자신의 경험도 조금씩 공유할 필요가 있습니다. 듣기만 하는 역할이 오래 이어지면 상대는 편해도 본인은 관계에서 이해받지 못한다고 느낄 수 있습니다.']},
study:{
 peer:['배운 내용을 직접 풀거나 실행해봐야 자신의 실력으로 받아들이기 쉬운 방향입니다. 설명을 따라갈 수 있다는 확인보다 자료 없이 다시 해낼 수 있는지를 보는 과정이 학습의 핵심입니다.','혼자 해결해야 실력이 늘었다고 생각해 질문을 늦추는 점을 살펴야 합니다. 이미 이해한 부분과 막힌 부분을 구분해 질문하면 자기 판단을 지키면서도 불필요한 반복을 줄일 수 있습니다.','스스로 고른 문제를 끝까지 풀고 풀이를 비교하는 방식이 어울립니다. 정답만 확인하기보다 왜 다른 방법도 가능한지를 보면 자신의 기준이 더 유연하고 정확해질 수 있습니다.','학습 계획에서는 자율적으로 정할 범위와 외부에서 확인받을 기준을 함께 두는 편이 좋습니다. 목표를 혼자 정해도 실제로 어떤 수준까지 익혔는지는 다른 문제나 설명을 통해 검토할 필요가 있습니다.'],
 output:['직접 설명하거나 결과를 만들면서 배우는 방향입니다. 읽은 내용을 자신의 말로 정리하고 적용해보는 과정에서 이해의 빈칸을 알아차리기 쉽습니다.','이해한 것처럼 설명할 수 있는데 새로운 조건에서는 사용하지 못하는 점을 살펴야 합니다. 표현이 자연스러운 것과 개념을 정확하게 구분할 수 있는 것은 다르므로 낯선 문제에서도 확인하는 편이 좋습니다.','짧게 익힌 뒤 실제로 써보고 부족한 부분을 다시 배우는 방식이 어울립니다. 처음부터 많은 내용을 완벽히 정리하기보다 작은 실행에서 나온 질문을 중심으로 복습하면 지식이 결과와 연결됩니다.','학습을 계속하려면 흥미로운 새 결과와 반복 연습의 균형이 필요합니다. 이미 아는 것을 설명하는 데만 머물지 않고 아직 바로 사용하지 못하는 부분을 정해 연습하면 실제 실력이 쌓이기 쉽습니다.'],
 wealth:['실제 사용 목적이 보일 때 학습에 집중하기 쉬운 방향입니다. 무엇에 쓰이는지 알고 배우면 범위를 정하기 편하며, 배운 내용을 생활이나 업무의 문제와 연결하는 과정에서 기억이 남기 쉽습니다.','빨리 쓸 수 있는 것만 고르면 기본 원리를 충분히 익히지 못할 수 있습니다. 당장의 도움이 작아 보여도 다음 내용을 이해하는 데 필요한 기초라면 별도의 시간을 두는 편이 좋습니다.','현재 해결할 문제를 정하고 필요한 개념부터 익히는 방식이 어울립니다. 다만 답을 그대로 가져다 쓰는 데서 끝내지 않고 조건이 바뀌었을 때 무엇을 수정해야 하는지까지 확인해야 재사용할 수 있는 지식이 됩니다.','학습 계획에서는 투입한 시간과 비용보다 실제로 사용할 수 있게 된 내용을 확인하는 것이 중요합니다. 과정의 이름이나 자료의 양보다 직접 수행한 결과를 남기면 다음에 무엇을 배울지도 분명해집니다.'],
 officer:['목표와 평가 기준이 설명될 때 꾸준히 학습하기 쉬운 방향입니다. 무엇을 알아야 하고 어떤 방식으로 확인하는지를 알면 반복할 범위를 정하고 부족한 부분을 체계적으로 채우는 데 강점을 쓸 수 있습니다.','실수하지 않으려 익숙한 문제만 반복하거나 좋은 평가를 받을 때까지 결과를 보여주지 않는 점을 살펴야 합니다. 틀린 문제는 능력의 판정이 아니라 다음에 익힐 내용을 알려주는 자료로 사용할 필요가 있습니다.','정해진 범위를 학습한 뒤 새로운 문제로 점검하는 방식이 어울립니다. 기준은 유지하되 풀이 방법을 하나로 고정하지 않으면 평가 조건이 달라져도 익힌 내용을 활용하기 쉬워집니다.','학습을 오래 유지하려면 계획을 지키는 날과 계획을 조정하는 날을 구분하는 편이 좋습니다. 밀린 분량을 모두 의무로 남기면 부담이 커지므로 실제 이해 수준에 맞춰 다음 범위를 다시 정할 필요가 있습니다.'],
 resource:['설명의 이유와 개념의 연결을 이해할 때 기억이 깊어지는 방향입니다. 단순히 답을 외우기보다 왜 그런지 확인하고 자신의 말로 구조를 정리하는 과정에서 장점을 쓰기 좋습니다.','자료를 충분히 모은 것이 곧 학습을 끝냈다는 느낌으로 이어질 수 있습니다. 정리한 내용을 보지 않고 설명하거나 풀어봐야 이해한 부분과 다시 배울 부분이 실제로 구분됩니다.','한 주제를 깊게 익힌 뒤 짧은 설명이나 실행으로 확인하는 방식이 어울립니다. 추가 자료를 찾기 전에 현재 아는 내용을 한번 써보면 더 알아야 할 질문이 구체적으로 남아 조사의 범위도 줄어듭니다.','학습 계획에서는 준비와 적용을 별도 단계로 두는 것이 좋습니다. 이해가 완벽해질 때까지 적용을 미루기보다 지금 가능한 수준으로 써본 결과를 다시 자료와 비교하면 생각이 사실에 더 가까워집니다.']},
luck:{
 peer:['도움이 들어와도 자신의 판단으로 사용할 수 있어야 편한 방향입니다. 결정을 대신해주는 사람보다 필요한 자원이나 실무를 나누어주는 사람을 만날 때 기회를 자신의 결과로 바꾸기 쉽습니다.','스스로 해내야 한다는 마음 때문에 도움이 되는 제안도 간섭으로 받아들이는 점을 살펴야 합니다. 선택을 맡기는 것과 필요한 부분에 도움을 받는 것은 구분할 수 있습니다.','현재 목표와 직접 맡을 부분을 설명할 수 있는 관계가 도움의 통로로 어울립니다. 상대가 무엇을 도와야 할지 알 수 있으면 독립성을 지키면서도 필요한 지원을 받기 쉬워집니다.','기회를 사용하려면 자신의 판단을 지키는 동시에 새로운 방법을 검토할 작은 여지를 남기는 것이 좋습니다. 기존 방식을 모두 버릴 필요 없이 한 부분만 도움을 받아보고 실제로 달라진 결과를 확인하는 쪽입니다.'],
 output:['자신이 만든 결과를 보여주는 과정에서 제안과 연결이 생기는 방향입니다. 무엇을 할 수 있는지 구체적으로 드러날 때 필요한 사람이 알아보고 다음 일을 함께할 이유가 생기기 쉽습니다.','좋은 반응을 기회라고 느껴 제공 범위를 급하게 늘리는 점을 살펴야 합니다. 칭찬과 실제 지원은 다를 수 있으므로 제안이 들어왔을 때 무엇을 함께 책임질 수 있는지까지 확인할 필요가 있습니다.','작은 결과를 공유하고 반응을 받을 수 있는 자리에서 도움의 접점이 생기기 쉽습니다. 완벽하게 준비한 큰 결과보다 상대가 이해하고 구체적으로 의견을 줄 수 있는 형태가 더 유용할 수 있습니다.','기회를 이어가려면 관심을 받은 결과의 장점과 이후에 지킬 수 있는 조건을 연결해야 합니다. 새로운 제안을 모두 받아들이기보다 현재 가능한 분량을 설명하면 도움을 받으면서도 기존 결과를 지킬 수 있습니다.'],
 wealth:['정보와 사람의 필요를 비교하는 과정에서 기회를 알아보는 방향입니다. 상대가 가진 자원과 본인이 할 수 있는 역할이 연결될 때 단순한 호의가 실제로 함께할 일로 바뀌기 쉽습니다.','좋은 조건을 놓치지 않으려 여러 제안을 계속 열어두는 점을 살펴야 합니다. 선택할 기회가 많다는 사실과 실제로 운영할 여유가 있다는 사실은 다르기 때문에 관리할 범위를 확인해야 합니다.','실제 필요와 조건을 나눌 수 있는 사람이 도움의 통로로 어울립니다. 막연히 잘될 것이라는 말보다 누가 무엇을 맡고 어떤 결과를 확인할 수 있는지 설명되는 관계에서 기회를 활용하기 쉽습니다.','기회를 오래 사용하려면 새 연결을 찾는 힘과 이미 받은 도움에 응답하는 힘이 함께 필요합니다. 상대의 기대를 알아두고 현재 가능한 결과를 보여주면 관계가 막연한 기대에 머무는 일을 줄일 수 있습니다.'],

function reportSubject(a) {return `${a.input.name}님`;}
function withJosa(value,consonant,vowel) {const text=String(value);const last=text.charCodeAt(text.length-1);return text+(last>=0xAC00&&last<=0xD7A3?(last-0xAC00)%28?consonant:vowel:consonant);}
function pillarName(pillar) {return pillar ? `${STEM_INFO[pillar[0]].ko}${BRANCH_INFO[pillar[1]].ko}` : '시간 모름';}
function paragraphs(items) {return items.flat().filter(Boolean).map(value=>`<p class="paragraph">${escapeHtml(value)}</p>`).join('');}
function section(number,title,items,extra='') {return `<section class="report-section" id="chapter-${number}"><div class="section-title"><span>CHAPTER ${String(number).padStart(2,'0')}</span><h2>${escapeHtml(title)}</h2></div>${paragraphs(items)}${extra}</section>`;}
function basis(text) {return `<details class="rule-details basis"><summary>풀이에 반영한 명식 보기</summary><p>${escapeHtml(text)}</p></details>`;}
function buildSummary(a) {
  const input=a.input;
  const date=`${input.year}.${String(input.month).padStart(2,'0')}.${String(input.day).padStart(2,'0')}`;
  const time=input.timeKnown?`${input.hour}시 ${String(input.minute).padStart(2,'0')}분`:'시간 모름';
  const columns=['time','day','month','year'];
  const table=`<div class="table-wrap"><table class="pillar-table"><caption>계산된 사주 명식</caption><thead><tr>${columns.map(k=>`<th scope="col">${POSITION_KO[k]}</th>`).join('')}</tr></thead><tbody><tr>${columns.map(k=>`<td>${a.pillars[k]?`<b class="hanja">${pillarName(a.pillars[k])}</b><span>${ELEMENT_KO[STEM_INFO[a.pillars[k][0]].element]} · ${ELEMENT_KO[BRANCH_INFO[a.pillars[k][1]].element]}</span>`:'<span>시간 모름</span>'}</td>`).join('')}</tr><tr>${columns.map(k=>`<td class="ten-cell">${k==='day'?'나 자신':a.pillars[k]?getTenGod(a.dayStem,a.pillars[k][0]):'해석 제외'}</td>`).join('')}</tr></tbody></table></div>`;
  const composition=ELEMENTS.map(e=>`${ELEMENT_KO[e]} ${a.visible[e]}개`).join(' · ');
  return `<section class="summary-box"><div class="summary-title">${escapeHtml(reportSubject(a))}의 사주</div><p class="summary-desc">${date} ${input.calendar==='lunar'?'음력':'양력'}${input.isLeapMonth?' 윤달':''} · ${input.gender==='F'?'여성':'남성'} · ${escapeHtml(time)}</p>${table}<p class="composition">겉글자 ${a.keys.length*2}개 기준 · ${composition}</p><p class="summary-note">${input.calendar==='lunar'?`변환한 양력 날짜 ${a.extra.solarDate} · `:''}${input.dayBoundary==='lateZi'?'23시':'자정'} 일주 변경${input.timeKnown?` · 시주 ${input.timeOffsetMinutes?`${input.timeOffsetMinutes>0?'+':''}${input.timeOffsetMinutes}분 보정`:'표준시 기준'}`:' · 시주와 시간대 해석 제외'}</p>${a.extra.boundaryUncertain?'<div class="notice-box">이 날짜는 절기 경계에 해당합니다. 출생시간을 알 수 없어 정오를 기준으로 년·월주를 표시했으며, 실제 시간에 따라 달라질 수 있습니다.</div>':''}</section>`;
}

function deepFacts(a) {
  const mt=getTenGod(a.dayStem,a.monthStem), dt=getTenGod(a.dayStem,HIDDEN_STEMS[a.dayBranch][0]), yt=getTenGod(a.dayStem,a.yearStem);
  const tt=a.timeKnown?getTenGod(a.dayStem,a.timeStem):null;
  const groups=Object.keys(a.groups).sort((x,y)=>a.groups[y]-a.groups[x]);
  const seasonKey=a.seasonElement===a.dayElement?'same':a.seasonElement===a.resourceElement?'resource':a.seasonElement===a.outputElement?'output':a.seasonElement===a.wealthElement?'wealth':'officer';
  const band=a.supportRatio<.37?'low':a.supportRatio>.62?'high':'middle';
  return {mt,dt,yt,tt,first:groups[0],second:groups[1],least:groups.at(-1),seasonKey,band,stem:D_STEM[a.dayStem],branch:D_BRANCH[a.dayBranch],pair:D_PAIR[groups[0]][groups[1]],outerPair:D_PAIR[GROUP_OF[mt]][GROUP_OF[dt]]};
}

function partnerTen(a,group) {
  const list=TEN_ORDER.filter(t=>GROUP_OF[t]===group);
  return list.sort((x,y)=>a.ten[y]-a.ten[x])[0];
}

function evidence(a,group) {
  const positions=a.keys.filter(k=>(k!=='day'&&GROUP_OF[getTenGod(a.dayStem,a.pillars[k][0])]===group)||HIDDEN_STEMS[a.pillars[k][1]].some(s=>GROUP_OF[getTenGod(a.dayStem,s)]===group));
  return positions.length?`사주 안의 ${positions.map(k=>`${POSITION_KO[k]}(${pillarName(a.pillars[k])})`).join(', ')} 자리에 해당 기운이 든든히 뿌리내리고 있습니다`:`사주 겉글자에 직접 드러나 있지는 않지만, 내가 가진 주특기 기운을 지렛대 삼아 충분히 만들어 쓰는 구조입니다`;
}

    `다만 일복이 많은 사주 구조라 내가 일을 잘 처리할수록 주변의 골치 아픈 업무까지 나에게 슬쩍 넘어오는 일이 생기기 쉽습니다. 직장에서 지치지 않고 내 몸값을 제대로 인정받으려면, 무조건 다 떠안지 말고 내가 맡을 범위와 권한을 처음부터 명확하게 짚고 넘어가는 영리함이 꼭 필요합니다.`

// CHAPTER 06: 평생 배우자운 (어떤 사람을 만나 어떻게 살게 될까?) -> 새로 신설된 초정밀 배우자운 챕터!

// CHAPTERS 07~11: 재물운(07), 직업운(08), 사업운(09), 인기운(10), 학업·행운·개운법(11)
function detailedFortune(a,f,domain,number,customTitle) {
  const d=D_DOMAIN[domain],pair=domainPair(f.first,f.second,domain);
  const rows=D_FIELD[domain][f.first];
  const first=partnerTen(a,f.first),second=partnerTen(a,f.second);
  const dsg = DEEP_STEM_PSYCH[a.dayStem];
  const needElem = a.weakest[0] || a.resourceElement;
  const lucky = LUCKY_ELEM_GUIDE[needElem];

  if (domain === 'luck') {
    const studyRows = D_FIELD.study[f.first];
    return section(number, customTitle || '학업·자격증운과 내 운을 트이게 하는 개운법', [
      `${withJosa(reportSubject(a),'이','가')} 공부나 자격증, 새로운 전문 기술을 가장 빠르게 내 것으로 만드는 방법을 보면, 이유도 모른 채 무조건 통암기하는 방식은 금방 질려버립니다. 전체 원리를 먼저 이해하고 내가 직접 문제를 풀어보거나 실전에 바로 써먹어 볼 때 남들보다 두 배 빠르게 실력이 붙습니다. ${studyRows[0]}`,
      `아울러 ${reportSubject(a)}의 사주에 타고난 행운의 통로와 일상 개운법(운을 트이게 하는 비결)을 살펴보면, 내 사주에 부족한 균형을 채워주는 고마운 오행은 바로 [${ELEMENT_KO[needElem]} 기운]입니다.`,
      `평소 가까이하면 좋은 행운의 색상은 [${lucky.color}], 좋은 방향은 [${lucky.dir}], 행운의 숫자는 [${lucky.num}]입니다. 일상 속에서 ${lucky.habit}을 실천하시면 답답하게 막혔던 흐름이 한결 시원하게 풀리고 좋은 기회가 자연스럽게 따라붙습니다.`,
      `${rows[0]} ${rows[3]}`
    ]);
  }

  const domainSpecificIntro = {
    money: `${reportSubject(a)}의 타고난 재물 그릇과 돈 모으는 방식을 살펴보면, ${dsg.money_style} ${evidence(a,'wealth')}. 남의 말만 듣고 따라가는 투자보다 내 판단으로 직접 흐름을 통제할 수 있을 때 돈이 가장 잘 붙습니다.`,
    work: `${reportSubject(a)}에게 딱 맞는 평생 직업과 적성을 짚어보면, ${STEM_NARRATIVE[a.dayStem].work} 특히 사주 기질과 가장 잘 맞아떨어지는 추천 분야는 [${dsg.jobs}] 등이며, 내 재량권이 보장되는 자리일수록 능력을 백 퍼센트 발휘합니다.`,
    business: `${withJosa(reportSubject(a),'이','가')} 내 이름으로 사업이나 프리랜서, 독립적인 일, 부업을 할 때의 성향을 보면, 남 밑에서 시키는 일만 할 때보다 내 기준대로 판을 짤 때 에너지가 배로 살아납니다. 특히 [${dsg.jobs}] 영역에서 내 전문성을 무기로 작게 시작해 단골과 시스템을 넓혀가는 방식이 가장 큰 성공을 안겨줍니다.`,
    popularity: `${withJosa(reportSubject(a),'이','가')} 사람들 사이에서 매력을 발산하고 인기를 얻는 비결을 보면, 억지로 남의 비위를 맞추려 애쓰지 않아도 나만의 뚜렷한 주관과 일 처리 능력, 그리고 내 사람에게만 보여주는 반전 다정함에서 자연스럽게 사람이 꼬입니다. ${dsg.people_tip}`
  }[domain];

  const parts = [
    domainSpecificIntro,
    `${rows[0]} 여기에 사주의 또 다른 축인 ${withJosa(D_TEN_LABEL[second],'이','가')} 힘을 보태주어, ${withJosa(D_TEN[second][d.key],'을','를')} 함께 챙길 때 훨씬 안정적인 결과를 얻습니다.`,
    `${rows[1]} 특히 주의할 점은 내 마음이 급해지거나 정에 끌려 ${withJosa(D_TEN[f.dt].cost,'이','가')} 반복되는 것인데, 이럴 때는 망설이지 말고 ${withJosa(D_TEN[f.dt].fix,'을','를')} 선택해야 내 실속을 지킵니다.`,
    `${rows[2]} ${rows[3]}`
  ];
  return section(number, customTitle || d.label, parts);
}

// CHAPTER 15: 내 사주의 특수 기운(귀인·도화·역마·신살) 핵심 요약
function translateRule(text) {return String(text).replace(/[甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥]/g,ch=>(STEM_INFO[ch]||BRANCH_INFO[ch]).ko);}

function shinsalMarkup(a,f) {
  const cards=a.shinsals.map(item=>{
    const desc = SHINSAL_DESC[item.name];
    const posText = translateRule(item.positions.join(' · '));
    if(desc) {
      return `<article class="shinsal-card"><h3>${escapeHtml(item.name)} <span style="font-size:13px;color:var(--muted);font-weight:400;">(${escapeHtml(posText)})</span></h3>${paragraphs([`${desc.good}`, `💡 주의할 점: ${desc.caution}`])}</article>`;
    }
    return '';
  }).filter(Boolean).join('');
  return cards || `<p class="paragraph">특정 신살에 치우치지 않고 사주 본연의 오행과 기질로 균형 있게 살아가는 담백한 명식입니다.</p>`;
}

function chapter18LifeStages(a,f) {
  const ytB = getTenGod(a.dayStem, HIDDEN_STEMS[a.yearBranch][0]);

  const ttB = a.timeKnown ? getTenGod(a.dayStem, HIDDEN_STEMS[a.timeBranch][0]) : f.dt;

  const earlyStage = `▶ 초년운 (유년기~20대 초반 · 년주 ${pillarName(a.pillars.year)} 기준): 인생의 밑그림을 그리는 초년에는 겉으로 [${TEN_GOD_REAL_LIFE[f.yt].title}], 속으로 [${D_TEN_LABEL[ytB]}]의 기운이 작동합니다. ${LIFE_STAGE_BY_TENGOD[f.yt].early} 또한 ${BRANCH_NARRATIVE[a.yearBranch].inner}`;

  const middleStage = `▶ 중년운 (20대 중반~50대 · 월주 ${pillarName(a.pillars.month)} · 일주 ${pillarName(a.pillars.day)} 기준): 사회에서 가장 활발하게 활동하고 내 가정을 꾸리는 중년기에는 [${TEN_GOD_REAL_LIFE[f.mt].title}]과 [${TEN_GOD_REAL_LIFE[f.dt].title}]이 본격적으로 꽃을 피웁니다. ${LIFE_STAGE_BY_TENGOD[f.mt].middle} 특히 내면과 가정을 뜻하는 일지(${BRANCH_INFO[a.dayBranch].ko})의 힘 덕분에 중년으로 갈수록 ${LIFE_STAGE_BY_TENGOD[f.dt].middle}`;

  const lateStage = a.timeKnown
    ? `▶ 말년운 (50대 이후~노년기 · 시주 ${pillarName(a.pillars.time)} 기준): 인생의 결실을 거두는 후반부에는 [${TEN_GOD_REAL_LIFE[f.tt].title}]과 [${D_TEN_LABEL[ttB]}]의 기운이 내 삶을 감싸줍니다. ${LIFE_STAGE_BY_TENGOD[f.tt].late} ${BRANCH_NARRATIVE[a.timeBranch].inner}`
    : `▶ 말년운 (50대 이후~노년기 · 일주 ${pillarName(a.pillars.day)} 기준): 나이가 들수록 내 본연의 중심 기운인 [${TEN_GOD_REAL_LIFE[f.dt].title}]이 깊어집니다. ${LIFE_STAGE_BY_TENGOD[f.dt].late}`;

  return [
    `${reportSubject(a)}의 사주 네 기둥(년·월·일·시)에 각각 배정된 글자와 십성 기운을 바탕으로, 초년·중년·말년의 인생 흐름이 어떻게 다르게 펼쳐지는지 짚어드립니다.`,
    earlyStage,

    lateStage
  ];
}

function graphMarkup(a,f) {
  const map={money:['wealth','output'],work:['officer','resource'],love:['peer','officer'],popularity:['output','peer'],business:['wealth','output'],study:['resource','output'],luck:['resource','peer']};
  return `<div class="luck-graph-card">${Object.entries(D_DOMAIN).map(([k,d])=>{
    const [x,y]=map[k],share=(a.groupShare[x]+a.groupShare[y])/2;
    const label=share>=.3?'타고난 기운이 강하게 집중됨':share>=.15?'고르게 조화를 이루며 작동함':'내 주특기를 통해 발휘됨';
    return `<div class="luck-row"><div class="luck-top"><b>${d.label}</b><span>${label}</span></div><div class="bar-track" role="img" aria-label="${d.label}: ${label}"><div class="bar-fill" style="width:${Math.max(15,Math.min(100,share*210)).toFixed(2)}%"></div></div></div>`;
  }).join('')}</div>`;
}

function fillTestForm(input) {
  for(const key of ['name','year','month','day','hour','minute','gender','calendar','dayBoundary','utcOffset','timeOffsetMinutes']) document.getElementById(`test-${key}`).value=String(input[key]);
  document.getElementById('test-unknown').checked=!input.timeKnown;
  document.getElementById('test-leap').checked=input.isLeapMonth;
  syncTestFields();
}
function syncTestFields() {
  const unknown=document.getElementById('test-unknown').checked;
  for(const key of ['hour','minute','timeOffsetMinutes']) document.getElementById(`test-${key}`).disabled=unknown;
  const solar=document.getElementById('test-calendar').value==='solar';
  document.getElementById('test-leap').disabled=solar;
  if(solar) document.getElementById('test-leap').checked=false;
}
function readTestForm() {
  const raw={};
  for(const key of ['name','year','month','day','hour','minute','gender','calendar','dayBoundary','utcOffset','timeOffsetMinutes']) raw[key]=document.getElementById(`test-${key}`).value;
  raw.timeKnown=!document.getElementById('test-unknown').checked;
  raw.isLeapMonth=document.getElementById('test-leap').checked;
  raw.timeLabel='';
  return validateInput(raw);
}
async function renderReport() {
  const ticket=++renderTicket;
  const loading=document.getElementById('result-loading'), content=document.getElementById('dynamic-fortune-content'), error=document.getElementById('result-error');
  loading.hidden=false; error.hidden=true; content.hidden=true;
  document.getElementById('test-submit').disabled=true;
  await new Promise(resolve=>setTimeout(resolve,160));
  if(ticket!==renderTicket) return;
  try {
    const result=executePremiumEngine();
    content.innerHTML=result.html;
    content.hidden=false;
    if(TEST_MODE) document.getElementById('test-calculated').textContent=`실제 계산: ${['year','month','day','time'].map(k=>`${POSITION_KO[k]} ${pillarName(result.pillars[k])}`).join(' · ')}`;
  } catch(err) {
    error.textContent=err.message || '계산 중 문제가 발생했습니다. 입력값을 확인해 주세요.';
    error.hidden=false;
  } finally {
    if(ticket===renderTicket) {loading.hidden=true;document.getElementById('test-submit').disabled=false;}
  }
}

function restorePremiumInput(info) {
  const fields = {name:'saju_name',year:'saju_year',month:'saju_month',day:'saju_day',time:'saju_time',gender:'saju_gender',calendar:'saju_calendar',hour:'saju_hour',minute:'saju_minute',timeKnown:'saju_time_known',isLeapMonth:'saju_is_leap',dayBoundary:'saju_day_boundary',utcOffset:'saju_utc_offset'};
  for (const [field,key] of Object.entries(fields)) {
    if (info[field] !== undefined && info[field] !== null) sessionStorage.setItem(key,String(info[field]));
    else sessionStorage.removeItem(key);
  }
  sessionStorage.setItem('saju_time_offset','0');
  sessionStorage.setItem('saju_product','saju9900');
  sessionStorage.setItem('saju_result_test','false');

async function loadPremiumPurchase(orderId) {
  const {api,db,user} = await premiumStore();
  const snap = await api.getDoc(api.doc(db,'users',user.uid,'purchases',orderId));
  if (!snap.exists() || snap.data().itemType !== 'saju9900' || !snap.data().sajuInfo) throw new Error('이 계정의 정밀사주 구매 내역을 찾을 수 없습니다.');
  restorePremiumInput(snap.data().sajuInfo);
}
async function savePremiumPurchase(orderId) {
  const input = getInputData();
  const {api,db,user} = await premiumStore();
  const ref = api.doc(db,'users',user.uid,'purchases',orderId);
  const existing = await api.getDoc(ref);
  const previous = existing.exists() ? existing.data() : {};
  await api.setDoc(ref, {
    orderId,itemName:'나를 꿰뚫는 사주',itemType:'saju9900',amount:9900,
    purchaseDate:previous.purchaseDate || new Date().toISOString(),
    sajuInfo:{name:input.name,year:input.year,month:input.month,day:input.day,
      time:input.timeLabel,hour:input.hour,minute:input.minute,timeKnown:input.timeKnown,
      gender:input.gender,calendar:input.calendar,isLeapMonth:input.isLeapMonth,
      dayBoundary:input.dayBoundary,utcOffset:input.utcOffset,timeOffsetMinutes:0}
  }, {merge:true});
}
async function savePremiumWithRetry(orderId) {
  try {await savePremiumPurchase(orderId);}
  catch (error) {
    console.error('정밀사주 보관함 저장 실패:',error);
    let notice = document.getElementById('purchase-save-notice');
    if (!notice) {
      notice = document.createElement('div');
      notice.id = 'purchase-save-notice';
      notice.className = 'notice-box';
      document.getElementById('dynamic-fortune-content').before(notice);
    }
    notice.replaceChildren();
    const text = document.createElement('p');
    text.textContent = '결제는 완료됐지만 보관함에 저장하지 못했습니다. 다시 결제하지 마세요. '+error.message;
    const retry = document.createElement('button');
    retry.type = 'button';retry.textContent = '보관함에 다시 저장';
    retry.onclick = async () => {retry.disabled=true;await savePremiumWithRetry(orderId);retry.disabled=false;};
    notice.append(text,retry);
    return;
  }
  document.getElementById('purchase-save-notice')?.remove();
}
