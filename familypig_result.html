<script>
    function openLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

    // ==========================================================
    // 🚨 [필수] 결제 우회 방지 및 전역 변수 안전 선언
    // ==========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get('paymentKey');
    const amount = urlParams.get('amount') || 770;
    const meYear = sessionStorage.getItem('me_year');
    const youYear = sessionStorage.getItem('you_year');
    const orderId = urlParams.get('orderId') || '현장결제';
    window.globalOrderId = orderId;
    window.globalPaymentKey = paymentKey;

    if (!paymentKey || paymentKey === '') {
        alert("정상적인 결제 내역이 확인되지 않았습니다! 결제 페이지로 이동합니다.");
        document.body.style.display = "none";
        window.location.replace("familypig.html");
        throw new Error("결제 미확인 차단");
    } else if (!meYear || !youYear) {
        alert("사주 정보가 만료되었습니다. 결제 페이지에서 다시 입력해주세요!");

        window.location.replace("familypig.html");
        throw new Error("정보 만료 차단");

    // ==========================================================
    // 1. 내부 사주 계산 데이터 (정밀 계산은 유지, 화면 출력은 100% 쉬운 말!)
    // ==========================================================
    const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const charData = {
        '甲': { hg:'갑', el:'木', yy:1, cls:'c-wood' }, '乙': { hg:'을', el:'木', yy:0, cls:'c-wood' },
        '丙': { hg:'병', el:'火', yy:1, cls:'c-fire' }, '丁': { hg:'정', el:'火', yy:0, cls:'c-fire' },
        '戊': { hg:'무', el:'土', yy:1, cls:'c-earth'}, '己': { hg:'기', el:'土', yy:0, cls:'c-earth'},
        '庚': { hg:'경', el:'金', yy:1, cls:'c-metal'}, '辛': { hg:'신', el:'金', yy:0, cls:'c-metal'},
        '壬': { hg:'임', el:'水', yy:1, cls:'c-water'}, '癸': { hg:'계', el:'水', yy:0, cls:'c-water'},
        '子': { hg:'자', el:'水', yy:0, cls:'c-water'}, '丑': { hg:'축', el:'土', yy:0, cls:'c-earth'},
        '寅': { hg:'인', el:'木', yy:1, cls:'c-wood' }, '卯': { hg:'묘', el:'木', yy:0, cls:'c-wood' },
        '辰': { hg:'진', el:'土', yy:1, cls:'c-earth'}, '巳': { hg:'사', el:'火', yy:1, cls:'c-fire' },
        '午': { hg:'오', el:'火', yy:0, cls:'c-fire' }, '未': { hg:'미', el:'土', yy:0, cls:'c-earth'},
        '申': { hg:'신', el:'金', yy:1, cls:'c-metal'}, '酉': { hg:'유', el:'金', yy:0, cls:'c-metal'},
        '戌': { hg:'술', el:'土', yy:1, cls:'c-earth'}, '亥': { hg:'해', el:'水', yy:1, cls:'c-water'}
    };
    const EL_EASY = { '木':'나무 기운', '火':'불 기운', '土':'흙 기운', '金':'쇠 기운', '水':'물 기운' };
    const EL_ICON = { '木':'🌳 나무', '火':'🔥 불', '土':'⛰️ 흙', '金':'🪙 쇠', '水':'💧 물' };
    const EL_CLS = { '木':'c-wood', '火':'c-fire', '土':'c-earth', '金':'c-metal', '水':'c-water' };

    const generateMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
    const overcomeMap = { '木':'土', '土':'水', '水':'火', '火':'金', '金':'木' };
    const TEN_TO_GROUP = {
        '비견':'비겁','겁재':'비겁','식신':'식상','상관':'식상',
        '편재':'재성','정재':'재성','편관':'관성','정관':'관성','편인':'인성','정인':'인성'
    };

    const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
    const UNSEONG_START = { '甲':11,'乙':6,'丙':2,'丁':9,'戊':2,'己':9,'庚':5,'辛':0,'壬':8,'癸':3 };

    function get12Unseong(dGan, zhi) {
        if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return '';
        const s = UNSEONG_START[dGan], z = BRANCHES.indexOf(zhi);
        return UNSEONG_NAMES[charData[dGan].yy === 1 ? (z - s + 12) % 12 : (s - z + 12) % 12];
    }

    function getTenGod10(dGan, targetChar) {
        if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
        const dm = charData[dGan], tg = charData[targetChar], same = (dm.yy === tg.yy);
        if (dm.el === tg.el) return same ? '비견' : '겁재';
        if (generateMap[dm.el] === tg.el) return same ? '식신' : '상관';
        if (overcomeMap[dm.el] === tg.el) return same ? '편재' : '정재';
        if (overcomeMap[tg.el] === dm.el) return same ? '편관' : '정관';
        if (generateMap[tg.el] === dm.el) return same ? '편인' : '정인';
        return null;
    }

    function getCharHtml(char) {
        if (!char || char === '?' || char === 'unknown') return "?";
        const d = charData[char];
        return d ? `<span class="${d.cls}">${char}</span>` : char;
    }

    // ==========================================================
    // 2. 60가지 타고난 가족 성격 + 숨은 에너지 12종 + 핵심 성향 5종 (전부 쉬운 말!)
    // ==========================================================
    const iljuPersonality = {
        '甲子': "가족 관계에서 겉으로는 침착하고 듬직한 어른처럼 굴지만, 속으로는 집안의 편애 분위기나 사소한 말의 숨은 뜻까지 다 꿰뚫어 보는 눈치 백단입니다. 자존심이 강해 서열 싸움이나 원칙 문제에서는 절대 먼저 굽히지 않으며, 집안일이 자기 생각대로 흘러가지 않으면 속으로 스트레스를 크게 쌓습니다. 하지만 한 번 내 식구를 책임지기로 마음먹으면 끝까지 방패가 되어주는 의리가 깊으므로, '내가 맞아'라는 잔소리만 줄이면 집안에서 가장 믿음직한 기둥이 됩니다.",
        '乙丑': "명절과 집안의 궂은일을 도맡아 처리하는 책임감 넘치는 헌신파입니다. 가족을 위해 시간과 돈을 아낌없이 쏟으면서도, 속으로는 '내가 이렇게까지 애쓰는데 왜 아무도 몰라주지?'라는 서운함이 차곡차곡 쌓이기 쉽습니다. 평소엔 묵묵히 참다가 한계가 넘으면 한꺼번에 터뜨려 가족들을 당황시키곤 하니, 핏줄 사이라도 하기 싫은 일은 초반에 부드럽게 거절하는 연습이 꼭 필요합니다.",
        '丙寅': "명절 모임의 분위기를 단숨에 띄우고 가족들에게 용돈과 선물을 화끈하게 쏘는 집안의 분위기 메이커입니다. 기분이 좋을 땐 태양처럼 집안을 환하게 밝히지만, 자존심을 건드리거나 억지 잔소리를 들으면 필터링 없이 직설을 날려 분위기를 얼렸다가 10분 만에 후회하는 화끈한 성격입니다. 뒤끝이 전혀 없고 식구 사랑이 뜨거우니, 욱하는 순간 3초만 숨을 고르면 모두가 사랑하는 식구가 됩니다.",
        '丁卯': "부모님의 한숨 소리나 형제의 짧은 카톡만 보고도 '혹시 나 때문에 기분 상했나?'라며 밤새 고민하는 예민하고 다정한 성격입니다. 가족의 하소연을 다 들어주며 어떻게든 집안 평화를 지키려 애쓰지만, 정작 자기 속마음은 숨기다 지치기 쉽습니다. 가족의 기분까지 내가 다 책임질 필요는 없으므로, 따뜻한 마음은 유지하되 가족 문제와 내 생활을 적당히 나누는 연습이 필요합니다.",
        '戊辰': "살가운 애교나 잦은 안부 전화는 서툴러도, 집안에 큰 위기나 목돈이 필요한 일이 터지면 가장 먼저 나서서 막아주는 바위 같은 기둥입니다. 입이 무거워 가족의 비밀을 끝까지 지켜주는 믿음직함이 크지만, 한 번 세운 기준을 잘 바꾸지 않아 가족들에게 다소 고집 세고 꽉 막혀 보일 수 있습니다. '다 너희를 위해서'라는 고집만 조금 내려놓으면 누구보다 든든하고 편안한 식구가 됩니다.",
        '己巳': "집안에서 큰소리 한 번 안 내고 적을 만들지 않는 처세술의 달인입니다. 겉으로는 네네 하며 어른들과 형제들의 이야기를 다 맞춰주는 순둥이처럼 보이지만, 머릿속으로는 상황 파악과 손익 계산이 칼같이 돌아갑니다. 불필요한 감정 싸움은 기막히게 피해 가면서도 챙길 실속은 확실히 챙기는 영리한 타입이며, 가끔은 속내를 솔직하게 보여줘야 가족들이 거리감을 느끼지 않습니다.",
        '庚午': "피를 나눈 가족이라도 지켜야 할 선과 사생활은 확실히 지켜야 한다는 원칙주의자입니다. 가족 단톡방에서는 무뚝뚝한 단답형이라 정 없어 보일 때도 있지만, 내 식구가 밖에서 억울한 일을 당하거나 현실적인 위기에 처하면 가장 빠르고 확실한 해결책을 들고 달려오는 의리파입니다. 차가운 말투 속에 숨은 깊은 책임감을 가족들이 이해해 줄 때 관계가 훨씬 부드러워집니다.",
        '辛未': "가족의 매너, 말투, 생활 습관까지 깐깐하게 살피는 예민한 완벽주의자입니다. 부모님이나 형제에게도 속마음과 통장 잔고를 쉽게 열지 않으며, 사소한 무례함이나 편애를 마음속에 차곡차곡 기억해 두었다가 결정적인 싸움 때 한 번에 꺼내는 경향이 있습니다. 서운함이 곪기 전에 작은 불편함을 그때그때 부드럽게 말로 풀어내는 습관이 집안 평화의 핵심입니다.",
        '壬申': "어색한 친척 모임도 5분 만에 웃음바다로 만드는 친화력 만렙 자유인입니다. 낡은 관습이나 숨 막히는 훈화 말씀, 무거운 부양 압박은 답답해해 바쁜 일정을 핑계로 쏙 빠져나가는 센스가 뛰어납니다. 억지로 묶어두려 할수록 멀어지지만, 적당한 자유와 거리를 인정해 주면 명절마다 가장 유쾌한 에너지와 센스 있는 선물을 들고 나타나는 매력적인 식구가 됩니다.",
        '癸酉': "식구들의 가식이나 앞뒤 안 맞는 억지를 0.1초 만에 알아채고 차가운 사실로 정리해 버리는 냉철한 해결사입니다. 시끌벅적한 대가족 모임이나 감정적인 하소연에는 금세 기가 빨려 피곤해하지만, 집안에 법적·계약·돈 문제가 터졌을 때 가장 정확하고 깔끔한 해법을 찾아냅니다. 옳은 말을 할 때 따뜻한 공감 한 스푼만 얹어주면 가족들에게 존경받는 최고의 브레인이 됩니다.",
        '甲戌': "집안에서 실질적인 가장이자 중심축 역할을 자처하는 든든한 버팀목입니다. 평소엔 표현이 무뚝뚝해 보여도 가족의 취업·노후·건강·돈 문제를 진심으로 고민하고 현실적인 도움을 건네려 애씁니다. 다만 신뢰를 깨거나 무책임하게 구는 가족에게는 단호하고 차갑게 쓴소리를 던지므로, 완벽한 기준을 가족에게까지 강요하지 않도록 여유를 갖는 것이 좋습니다.",
        '乙亥': "집안 갈등이 생기면 어느 편에도 서지 않고 중립을 지키는 온화한 평화주의자입니다. 평소엔 부드럽고 배려심이 깊지만, 지나친 사생활 간섭이나 감정 강요가 쌓이면 갑자기 연락을 줄이고 혼자만의 공간으로 숨어 버리는 면이 있습니다. 억지로 속마음을 캐묻지 않고 편안한 사생활만 지켜주면 평생 가장 다정하고 편안한 가족으로 곁을 지킵니다.",
        '丙子': "밖에서는 쿨하고 인기 많은 성격이지만, 집안에서는 부모님의 애정과 서열에 은근히 민감한 질투쟁이입니다. 집안 대소사의 주도권을 쥐고 인정받고 싶은 마음이 크며, 겉으로는 신경 안 쓰는 척해도 속으로는 가족을 끔찍이 아끼고 챙깁니다. 서운할 때 툴툴거리기보다 솔직하게 칭찬과 애정을 원한다고 표현하면 집안의 사랑둥이가 됩니다.",
        '丁丑': "가족의 고민과 어려움을 자기 일처럼 끌어안고 해결하려 애쓰는 보살급 헌신파입니다. 집안 불화를 피하기 위해 무조건 참고 양보하다가 억울함이 한계치를 넘으면 어느 날 조용히 마음의 문을 닫고 멀어질 수 있습니다. 착한 자식·형제 노릇을 혼자 다 하려 애쓰지 말고, 가족 사이에서도 내 시간과 감정을 당당히 지키는 연습이 필요합니다.",
        '戊寅': "명절 식당 예약부터 집안 행사 동선, 부모님 병원 일정까지 직접 진두지휘해야 직성이 풀리는 대장부 스타일입니다. 내 가족이 밖에서 무시당하면 불도저처럼 나서서 지켜주는 화끈한 보호 본능을 지녔지만, 가족들에게도 명령조나 통제하는 말투가 나가기 쉽습니다. 지시 대신 상의하는 말투로만 바꿔도 집안을 일으키는 최고의 리더가 됩니다.",
        '己卯': "어느 쪽 편에도 욕먹지 않고 집안의 미묘한 공기를 부드럽게 조율하는 눈치 백단 생존 전문가입니다. 겉으로는 싹싹하고 다정하게 어른들 비위를 맞추지만, 속으로는 부양 분담과 돈 계산이 정확해 억울하게 독박 쓰는 일은 절대 만들지 않습니다. 유연한 처세 덕분에 갈등 중재에 탁월하며, 집안의 윤활유 역할을 톡톡히 해냅니다.",
        '庚辰': "핏줄 사이라도 빙빙 돌려 말하거나 눈치 게임하는 걸 질색해 시원하게 직언을 날리지만, 뒤끝은 1도 없는 화끈한 스타일입니다. 구차한 변명이나 치사한 계산을 싫어하고 집안의 체면과 의리를 중시하며, 결정적 위기에는 가장 먼저 지갑과 몸을 던져 나섭니다. 거친 직언 뒤에 숨은 진심만 부드럽게 포장하면 집안에서 가장 믿음직한 수호신이 됩니다.",
        '辛巳': "깔끔하고 품격 있는 집안 분위기를 중시하는 세련된 완벽주의자입니다. 부모님 용돈과 명절 선물도 허투루 챙기지 않고 격식 있게 준비하지만, 그만큼 사생활 존중과 정중한 대우를 바라는 도도하고 예민한 면이 있습니다. 격식 없이 들이대는 무례한 간섭을 가장 싫어하므로, 서로 예의를 지킬 때 가장 빛나는 효자·효녀가 됩니다.",
        '壬午': "넉살과 유머로 깐깐한 어른들의 마음도 5분 만에 녹여버리는 집안의 재간둥이입니다. 무거운 제사나 진지한 부양 잔소리는 재치 있게 웃어넘기며 빠져나가는 유연함이 있으며, 감정이 깊어지기보다 유쾌하고 가볍게 만날 때 최고의 호흡을 냅니다. 만나면 집안을 웃음바다로 만드는 에너지가 큰 매력이지만, 중요한 약속만큼은 확실히 지켜야 신뢰가 쌓입니다.",
        '癸未': "가족의 아픔과 눈물을 자기 일처럼 함께 느끼고 위로해 주는 따뜻한 감성파입니다. 내가 정성을 쏟은 만큼 집안에서 특별히 인정받고 사랑받고 싶은 마음이 커서 사소한 편애나 무심한 말 한마디에도 깊은 상처를 받기 쉽습니다. 가족의 평가에 내 기분을 다 맡기지 말고 스스로 마음을 단단히 챙길 때 훨씬 평온해집니다.",
        '甲申': "형제자매 사이에서도 은근히 승부욕이 발동해 '내가 제일 잘나가고 인정받아야 한다'는 성취 욕구가 강한 경쟁파입니다. 집안 행사를 기획하고 실행하는 추진력이 뛰어나지만, 타협 없이 자기 방식대로 밀어붙이는 고집 때문에 마찰이 생기기 쉽습니다. 가족을 경쟁 상대가 아닌 한 팀으로 바라볼 때 가장 든든한 행동파가 됩니다.",
        '乙酉': "가족의 생활 습관, 건강 관리, 재테크 방식까지 완벽하게 고쳐주려는 깐깐한 현실 조언가입니다. 따뜻한 위로보다 차가운 현실 조언과 해결책을 먼저 던져 가족들을 서운하게 만들 때가 많지만, 실제로 집안에 위기가 닥쳤을 때 문제를 해결하는 능력만큼은 1등입니다. 조언하기 전에 '많이 힘드셨죠'라는 공감 한마디만 먼저 붙여보세요.",
        '丙戌': "가족을 위해 지갑을 활짝 여는 호탕한 의리파 리더입니다. 직감과 촉이 매우 발달해 집안의 숨겨진 거짓말이나 속내를 귀신같이 알아채며, 내 식구에게는 가장 좋은 것부터 챙겨줄 만큼 뜨겁게 아낍니다. 다만 믿었던 가족에게 배신감이나 무시를 느끼면 불같이 폭발할 수 있으니, 평소 솔직한 대화로 오해를 쌓지 않는 게 중요합니다.",
        '丁亥': "식구들의 지친 마음을 어루만져 주고 고성이 오가는 갈등을 부드럽게 중재하는 집안의 외교관입니다. 겉으로는 온화하고 순하게 보이지만 속으로는 상황 파악과 사람 보는 눈이 매우 냉철해, 부드러운 말 한마디로 집안의 흐름을 영리하게 조율합니다. 남의 감정을 다 받아주다 혼자 지치지 않도록 휴식 시간을 꼭 챙겨야 합니다.",
        '戊子': "연락은 드문드문하고 리액션도 무뚝뚝하지만, 집안에 급전이 필요하거나 가전이 고장 나면 말없이 해결해 주는 그림자 가장입니다. 오글거리는 애정 표현은 못 해도 묵직한 책임감과 실질적인 행동으로 가족을 지킵니다. 가끔은 짧은 안부 문자나 따뜻한 말 한마디만 보태도 가족들의 감동이 10배로 커집니다.",
        '己丑': "집안에 크고 작은 풍파가 생겨도 묵묵히 자리를 지키며 견뎌내는 황소 같은 인내심의 소유자입니다. 보수적이고 익숙한 집안 방식을 고집해 젊은 세대에게 다소 답답하게 보일 때도 있지만, 어떤 상황에서도 가족을 버리지 않고 끝까지 책임지는 가장 믿음직한 기둥입니다. 변화와 새로운 의견을 조금만 더 열어두면 완벽합니다.",
