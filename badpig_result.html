    <script>
        function openLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
        function closeLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

        // ==========================================================

        // ==========================================================
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get('paymentKey');
        const sajuYear = sessionStorage.getItem('saju_year');
        const orderId = urlParams.get('orderId') || '현장결제';
        const amount = urlParams.get('amount') || 770;
        window.globalOrderId = orderId;
        window.globalPaymentKey = paymentKey;

        if (!paymentKey || paymentKey === '') {
            alert("정상적인 결제 내역이 확인되지 않았습니다! 결제 페이지로 이동합니다.");

        // ==========================================================
        // 1. 초정밀 명리학 기초 데이터 (천간·지지·지장간·12운성)
        // ==========================================================
        const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
        const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

        const charData = {
            '甲': { hg: '갑', full: '갑목', el: '木', yy: 1, cls: 'c-wood' },
            '乙': { hg: '을', full: '을목', el: '木', yy: 0, cls: 'c-wood' },
            '丙': { hg: '병', full: '병화', el: '火', yy: 1, cls: 'c-fire' },
            '丁': { hg: '정', full: '정화', el: '火', yy: 0, cls: 'c-fire' },
            '戊': { hg: '무', full: '무토', el: '土', yy: 1, cls: 'c-earth' },
            '己': { hg: '기', full: '기토', el: '土', yy: 0, cls: 'c-earth' },
            '庚': { hg: '경', full: '경금', el: '金', yy: 1, cls: 'c-metal' },
            '辛': { hg: '신', full: '신금', el: '金', yy: 0, cls: 'c-metal' },
            '壬': { hg: '임', full: '임수', el: '水', yy: 1, cls: 'c-water' },
            '癸': { hg: '계', full: '계수', el: '水', yy: 0, cls: 'c-water' },
            // 지지 (명리학 표준 지장간 본기 음양 적용)
            '子': { hg: '자', full: '자수', el: '水', yy: 0, cls: 'c-water', jjg: ['壬','癸'] },
            '丑': { hg: '축', full: '축토', el: '土', yy: 0, cls: 'c-earth', jjg: ['癸','辛','己'] },
            '寅': { hg: '인', full: '인목', el: '木', yy: 1, cls: 'c-wood',  jjg: ['戊','丙','甲'] },
            '卯': { hg: '묘', full: '묘목', el: '木', yy: 0, cls: 'c-wood',  jjg: ['甲','乙'] },
            '辰': { hg: '진', full: '진토', el: '土', yy: 1, cls: 'c-earth', jjg: ['乙','癸','戊'] },
            '巳': { hg: '사', full: '사화', el: '火', yy: 1, cls: 'c-fire',  jjg: ['戊','庚','丙'] },
            '午': { hg: '오', full: '오화', el: '火', yy: 0, cls: 'c-fire',  jjg: ['丙','己','丁'] },
            '未': { hg: '미', full: '미토', el: '土', yy: 0, cls: 'c-earth', jjg: ['丁','乙','己'] },
            '申': { hg: '신', full: '신금', el: '金', yy: 1, cls: 'c-metal', jjg: ['戊','壬','庚'] },
            '酉': { hg: '유', full: '유금', el: '金', yy: 0, cls: 'c-metal', jjg: ['庚','辛'] },
            '戌': { hg: '술', full: '술토', el: '土', yy: 1, cls: 'c-earth', jjg: ['辛','丁','戊'] },
            '亥': { hg: '해', full: '해수', el: '水', yy: 1, cls: 'c-water', jjg: ['戊','甲','壬'] }
        };

        const EL_KR = { '木': '목(木)', '火': '화(火)', '土': '토(土)', '金': '금(金)', '水': '수(水)' };
        const EL_GEN = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };
        const EL_CTRL = { '木': '土', '火': '金', '土': '水', '金': '木', '水': '火' };
        const EL_CTRL_BY = { '木': '金', '火': '水', '土': '木', '金': '火', '水': '土' };
        const EL_GEN_BY = { '木': '水', '火': '木', '土': '火', '金': '土', '水': '金' };

        const TEN_TO_GROUP = {
            '비견': '비겁', '겁재': '비겁', '식신': '식상', '상관': '식상',
            '편재': '재성', '정재': '재성', '편관': '관성', '정관': '관성',
            '편인': '인성', '정인': '인성'
        };

        // 12운성(포태법) 정확 계산 (양간 순행, 음간 역행)
        const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
        const UNSEONG_START = {
            '甲': 11, '乙': 6, '丙': 2, '丁': 9, '戊': 2,
            '己': 9, '庚': 5, '辛': 0, '壬': 8, '癸': 3
        };
        function get12Unseong(dGan, zhi) {
            if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return null;
            const startIdx = UNSEONG_START[dGan];
            const zIdx = BRANCHES.indexOf(zhi);
            const isYang = charData[dGan].yy === 1;
            const diff = isYang ? (zIdx - startIdx + 12) % 12 : (startIdx - zIdx + 12) % 12;
            return UNSEONG_NAMES[diff];
        }

        function getHtmlChar(char) {
            if (!char || char === '?' || char === 'unknown') {
                return "<span class='c-unknown'>?</span><span class='char-hg'>(모름)</span>";
            }
            const data = charData[char];
            if (!data) return char;
            return `<span class='${data.cls}'>${char}</span><span class='char-hg'>(${data.hg})</span>`;
        }

        function getTenGod10(dGan, targetChar) {
            if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
            const dm = charData[dGan];
            const tg = charData[targetChar];
            const sameYY = (dm.yy === tg.yy);
            if (dm.el === tg.el) return sameYY ? '비견' : '겁재';
            if (EL_GEN[dm.el] === tg.el) return sameYY ? '식신' : '상관';
            if (EL_CTRL[dm.el] === tg.el) return sameYY ? '편재' : '정재';
            if (EL_CTRL_BY[dm.el] === tg.el) return sameYY ? '편관' : '정관';
            if (EL_GEN_BY[dm.el] === tg.el) return sameYY ? '편인' : '정인';
            return null;
        }

        function getGongmang(dGan, dZhi) {
            const sIdx = STEMS.indexOf(dGan);
            const bIdx = BRANCHES.indexOf(dZhi);
            if (sIdx < 0 || bIdx < 0) return [];
            const startBranch = (bIdx - sIdx + 12) % 12;
            return [BRANCHES[(startBranch + 10) % 12], BRANCHES[(startBranch + 11) % 12]];
        }

        // ==========================================================
        // 2. 천간·지지 합/충/형/파/해 + 15종 신살 초정밀 감식기
        // ==========================================================
        function analyzeDeepRelations(pillars, dGan, dZhi, yZhi) {
            const items = [];
            const gans = pillars.map(p => ({ pos: p.name, c: p.gan })).filter(x => x.c && x.c !== '?');
            const zhis = pillars.map(p => ({ pos: p.name, c: p.zhi })).filter(x => x.c && x.c !== '?');
            const zList = zhis.map(x => x.c);
            const allChars = [...gans.map(x => x.c), ...zList];

            const findPairs = (pairDefs, list) => {
                const hits = [];
                for (let i = 0; i < list.length; i++) {
                    for (let j = i + 1; j < list.length; j++) {
                        for (const [a, b, label] of pairDefs) {
                            if ((list[i].c === a && list[j].c === b) || (list[i].c === b && list[j].c === a)) {
                                hits.push({ p1: list[i].pos, p2: list[j].pos, c1: list[i].c, c2: list[j].c, label });
                            }
                        }
                    }
                }
                return hits;
            };

            // 1) 천간합 & 천간충
            const ganHaps = findPairs([
                ['甲','己','갑기합'],['乙','庚','을경합'],['丙','辛','병신합'],['丁','壬','정임합'],['戊','癸','무계합']
            ], gans);
            if (ganHaps.length > 0) {
                const dmBound = ganHaps.some(h => h.p1 === '일주' || h.p2 === '일주');
                items.push({
                    tag: `🧲 천간합(${ganHaps.map(x=>x.label).join('·')})`,
                    cat: '합',
                    text: dmBound
                        ? `나 자신(일간)이 <span class='hl'>${ganHaps[0].label}</span>에 묶여 있습니다. 줏대 있게 밀고 나가지 못하고 사람이나 상황에 쉽게 얽매여 질질 끌려다니는 '발목 잡힘' 구조입니다.`
                        : `원국 천간에 <span class='hl'>${ganHaps.map(x=>x.label).join(', ')}</span>이 걸려 있어, 겉으론 원만한 척하지만 속으론 딴생각과 사적인 이해관계가 얽혀 집중력이 분산됩니다.`
                });
            }

            const ganChungs = findPairs([
                ['甲','庚','갑경충'],['乙','辛','을신충'],['丙','壬','병임충'],['丁','癸','정계충']
            ], gans);
            if (ganChungs.length > 0) {
                items.push({
                    tag: `💥 천간충(${ganChungs[0].label})`,
                    cat: '충',
                    text: `하늘의 기운이 정면 충돌하는 <span class='hl'>${ganChungs.map(x=>`${x.p1}-${x.p2} ${x.label}`).join(', ')}</span>이 있습니다. 대외적인 말실수, 직장 내 공개 갈등, 예기치 못한 구설수로 체면이 깎이기 쉬운 위험 구조입니다.`
                });
            }

            // 2) 지지 6충 (위치별 정밀 해석!)
            const zhiChungs = findPairs([
                ['子','午','자오충'],['丑','未','축미충'],['寅','申','인신충'],
                ['卯','酉','묘유충'],['辰','戌','진술충'],['巳','亥','사해충']
            ], zhis);
            if (zhiChungs.length > 0) {
                const posNotes = zhiChungs.map(h => {
                    const pairKey = `${h.p1}-${h.p2}`;
                    if (pairKey.includes('년주') && pairKey.includes('월주')) return `<b>년월충(${h.label})</b>: 초년·집안 환경과 사회생활이 부딪혀 일찍 독립하거나 가족과 갈등이 잦습니다.`;
                    if (pairKey.includes('월주') && pairKey.includes('일주')) return `<b>월일충(${h.label})</b>: 내 본성과 직장·사회 환경이 매번 정면 충돌해 조직 적응이 어렵고 이직·변동이 심합니다.`;
                    if (pairKey.includes('일주') && pairKey.includes('시주')) return `<b>일시충(${h.label})</b>: 배우자궁과 말년궁이 흔들려 가까운 관계에서 뒤끝과 풍파가 끊이지 않습니다.`;
                    return `<b>${pairKey} ${h.label}</b>: 내면의 변덕과 충돌로 평온한 일상을 스스로 뒤엎기 쉽습니다.`;
                });
                items.push({
                    tag: `⚡ ${zhiChungs.map(x=>x.label).join('·')}`,
                    cat: '충',
                    text: posNotes.join('<br>')
                });
            }

            // 3) 형살 (삼형/자형)
            const hasP = (a, b) => zList.includes(a) && zList.includes(b);
            const cnt = (c) => zList.filter(z => z === c).length;
            const hyungNames = [];
            if (hasP('寅','巳') || hasP('巳','申') || hasP('寅','申')) hyungNames.push('인사신 삼형(은혜를 원수로 갚는 마찰)');
            if (hasP('丑','戌') || hasP('戌','未') || hasP('丑','未')) hyungNames.push('축술미 삼형(고집·시비·관재)');
            if (hasP('子','卯')) hyungNames.push('자묘 무례지형(선 넘는 말과 태도)');
            if (cnt('辰') >= 2 || cnt('午') >= 2 || cnt('酉') >= 2 || cnt('亥') >= 2) hyungNames.push('자형(스스로 자기 발등 찍는 자학 패턴)');
            if (hyungNames.length > 0) {
                items.push({
                    tag: `🔪 형살`,
                    cat: '형',
                    text: `<span class='hl'>${hyungNames.join(' / ')}</span>이 원국에 박혀 있습니다. 남 탓할 게 아니라 본인의 조급함·의심·과격한 반응 때문에 멀쩡한 판을 스스로 깨부수는 자폭 기질이 강합니다.`
                });
            }

            // 4) 파살 & 해살 (미세한 균열·배신)
            const zhiPas = findPairs([['子','酉','자유파'],['午','卯','오묘파'],['寅','亥','인해파'],['申','巳','신사파'],['辰','丑','진축파'],['戌','未','술미파']], zhis);
            const zhiHaes = findPairs([['子','未','자미해'],['丑','午','축오해'],['寅','巳','인사해'],['卯','辰','묘진해'],['申','亥','신해해'],['酉','戌','유술해']], zhis);
            if (zhiPas.length > 0 || zhiHaes.length > 0) {
                const phList = [...zhiPas.map(x=>x.label), ...zhiHaes.map(x=>x.label)];
                items.push({
                    tag: `🕳️ 파·해살(${phList[0]})`,
                    cat: '파해',
                    text: `<span class='hl'>${phList.join(', ')}</span>이 숨어 있어, 겉으로는 큰 싸움이 안 나도 속으로 서서히 금이 가고 믿었던 사람에게 뒤통수 맞거나 말실수로 관계가 삐걱거리는 '잔잔한 균열'이 반복됩니다.`
                });
            }

            // 5) 원진살 & 귀문관살
            const wonjins = findPairs([['子','未','자미'],['丑','午','축오'],['寅','酉','인유'],['卯','申','묘신'],['辰','亥','진해'],['巳','戌','사술']], zhis);
            const gwimuns = findPairs([['子','酉','자유'],['丑','午','축오'],['寅','未','인미'],['卯','申','묘신'],['辰','亥','진해'],['巳','戌','사술']], zhis);
            if (wonjins.length > 0) {
                items.push({
                    tag: `🩸 원진살`,
                    cat: '원진',
                    text: `<span class='hl'>${wonjins.map(x=>x.label+'원진').join(', ')}</span>이 작동해, 가까워질수록 이유 없이 상대가 미워지고 꼬아서 듣는 삐딱한 애증 패턴이 폭발합니다. 곁에 있는 사람을 정서적으로 말려 죽이는 주범입니다.`
                });
            }
            if (gwimuns.length > 0) {
                items.push({
                    tag: `👁️ 귀문관살`,
                    cat: '귀문',
                    text: `<span class='hl'>${gwimuns.map(x=>x.label+'귀문').join(', ')}</span>이 깔려 있습니다. 예민함이 집착과 의심으로 변질되기 쉽고, 사소한 일에도 혼자 최악의 망상을 돌려 밤잠 설치는 신경과민 성향이 치명적입니다.`
                });
            }

            // 6) 괴강 / 백호 / 양인 / 홍염 / 고란
            const ilju = dGan + dZhi;
            if (['庚辰','庚戌','壬辰','壬戌'].includes(ilju)) {
                items.push({ tag: '👹 괴강살', cat: '살', text: `극단적인 <span class='hl'>괴강살 일주</span>입니다. 모 아니면 도 식의 독재적 기질과 타협 없는 성질머리가 뼛속까지 박혀 있어, 주변을 숨 막히게 통제하거나 스스로 극단적 굴곡을 자초합니다.` });
            }
            if (['甲辰','乙未','丙戌','丁丑','戊辰','壬戌','癸丑'].includes(ilju)) {
                items.push({ tag: '🐯 백호대살', cat: '살', text: `<span class='hl'>백호대살</span>이 박혀 있어 평소엔 참다가 한 번 뚜껑이 열리면 앞뒤 안 가리고 판을 엎어버리는 폭주 기질이 위험합니다. 감정 폭발 한 번에 큰 대가를 치를 수 있습니다.` });
            }
            const yanginMap = { '甲':'卯', '丙':'午', '戊':'午', '庚':'酉', '壬':'子' };
            if (yanginMap[dGan] && zList.includes(yanginMap[dGan])) {
                items.push({ tag: '⚔️ 양인살', cat: '살', text: `칼날 같은 <span class='hl'>양인살</span>이 들어와 남에게 지는 꼴을 못 보는 지독한 오기가 독이 됩니다. 굽히면 살 길도 끝까지 버티다 부러지는 미련한 자존심의 노예입니다.` });
            }
            const hongyeomMap = { '甲':'午', '乙':'午', '丙':'寅', '丁':'未', '戊':'辰', '己':'辰', '庚':'戌', '辛':'酉', '壬':'子', '癸':'申' };
            const hasHongyeom = hongyeomMap[dGan] && zList.includes(hongyeomMap[dGan]);
            if (hasHongyeom) {
                items.push({ tag: '💋 홍염살', cat: '연애', text: `<span class='hl'>홍염살</span>이 있어 본인이 치명적 매력의 소유자라 착각하거나, 불같은 애정 결핍으로 이성 문제에 쉽게 흔들리고 집착하는 도화 이상의 위험한 감성 기질이 있습니다.` });
            }
            const hasGoran = ['乙巳','丁巳','辛亥','戊申','壬寅'].includes(ilju);
            if (hasGoran) {
                items.push({ tag: '🥀 고란살', cat: '연애', text: `배우자궁에 외로움이 서린 <span class='hl'>고란살 일주</span>입니다. 결혼을 해도 정서적 고독을 느끼기 쉽고, 상대에 대한 기대치가 비현실적으로 높아 스스로 관계를 차갑게 식히기 쉽습니다.` });
            }

            // 7) 도화 / 역마 / 화개 / 현침 / 공망 / 천을귀인(역설 팩폭)
            const getSamhap = (b) => {
                if (['寅','午','戌'].includes(b)) return { dohwa:'卯', yeokma:'申', hwagae:'戌' };
                if (['申','子','辰'].includes(b)) return { dohwa:'酉', yeokma:'寅', hwagae:'辰' };
                if (['巳','酉','丑'].includes(b)) return { dohwa:'午', yeokma:'亥', hwagae:'丑' };
                if (['亥','卯','未'].includes(b)) return { dohwa:'子', yeokma:'巳', hwagae:'未' };
                return {};
            };
            const s1 = getSamhap(dZhi), s2 = getSamhap(yZhi);
            const hasDohwa = zList.includes(s1.dohwa) || zList.includes(s2.dohwa);
            const hasYeokma = zList.includes(s1.yeokma) || zList.includes(s2.yeokma);
            const hasHwagae = zList.includes(s1.hwagae) || zList.includes(s2.hwagae);

            if (hasDohwa) items.push({ tag: '🌸 도화살', cat: '연애', text: `<span class='hl'>도화살</span>로 인해 타인의 시선과 관심에 목마른 관종 기질이 숨어 있습니다. 겉치레와 가벼운 인기에 취해 정작 진중한 인연과 실속을 놓치기 쉽습니다.` });
            if (hasYeokma) items.push({ tag: '🐎 역마살', cat: '이동', text: `<span class='hl'>역마살</span> 탓에 한곳에 진득하게 뿌리내리지 못하고 늘 엉덩이가 들썩입니다. 조금만 힘들면 도망치듯 환경만 바꾸다 전문성 없이 표류할 위험이 큽니다.` });
            if (hasHwagae) items.push({ tag: '🕯️ 화개살', cat: '고독', text: `<span class='hl'>화개살</span>이 강해 과거의 미련을 곱씹으며 혼자만의 동굴로 숨어듭니다. 고상한 척하지만 실상은 현실 도피와 자의식 과잉으로 주변과 벽을 쌓는 편입니다.` });

            const hcCnt = allChars.filter(c => ['甲','辛','卯','午','申'].includes(c)).length;
            if (hcCnt >= 3) {
                items.push({ tag: `🪡 현침살(${hcCnt}개)`, cat: '독설', text: `바늘처럼 뾰족한 글자가 ${hcCnt}개 모인 <span class='hl'>현침살</span>입니다. 말 한마디로 사람 심장에 비수를 꽂는 독설과 트집 잡기가 특기라 주변의 피로도가 극심합니다.` });
            }

            const gm = getGongmang(dGan, dZhi);
            const gmPos = [];
            if (gm.includes(pillars[0].zhi)) gmPos.push('년지(초년·부모)');
            if (gm.includes(pillars[1].zhi)) gmPos.push('월지(청년·직장)');
            if (pillars[3].zhi !== '?' && gm.includes(pillars[3].zhi)) gmPos.push('시지(말년·결실)');
            if (gmPos.length > 0) {
                items.push({ tag: `🕳️ 공망(${gm.join('')})`, cat: '공망', text: `<span class='hl'>${gmPos.join(', ')}</span>에 공망(空亡)이 걸려 있습니다. 겉은 멀쩡해 보여도 결정적인 순간에 힘이 빠지거나 노력의 실속이 허무하게 증발하는 '속 빈 강정' 패턴을 경계해야 합니다.` });
            }

            const gwiinMap = {
                '甲':['丑','未'],'戊':['丑','未'],'庚':['丑','未'],
                '乙':['子','申'],'己':['子','申'],
                '丙':['亥','酉'],'丁':['亥','酉'],
                '辛':['寅','午'],'壬':['卯','巳'],'癸':['卯','巳']
            };
            const hasGwiin = gwiinMap[dGan] && zList.some(z => gwiinMap[dGan].includes(z));
            if (hasGwiin) {
                items.push({ tag: '👑 천을귀인(역설)', cat: '귀인', text: `타고난 <span class='hl'>천을귀인</span> 복이 있어 위기 때마다 주변에서 도와주는데, 정작 본인이 그걸 자기 실력으로 착각하고 고마운 줄 몰라 귀인을 발로 차버리는 배은망덕함을 경계하십시오.` });
            }

            return { items, zhiChungs, wonjins, gwimuns, hasDohwa, hasHongyeom, hasGoran, hasYeokma, gm, gmPos };
        }

        // ==========================================================
        // 3. 10천간(일간) 본질 + 12운성 팩폭 + 60갑자 완전체
        // ==========================================================
        const dmCoreFact = {
            '甲': "큰 나무(갑목) 일간답게 꺾일지언정 굽히지 않는 뻣뻣한 자존심이 문제입니다. 남 밑에 있길 죽도록 싫어하면서 정작 책임질 땐 고집만 부려 주변을 갑갑하게 만듭니다.",
            '乙': "덩굴(을목) 일간답게 겉으론 유순하고 착한 척하지만, 속으론 생존 본능과 계산기가 쉴 새 없이 돌아갑니다. 불리하면 슬쩍 갈아타는 기회주의와 끈질긴 뒤끝이 숨어 있습니다.",
            '丙': "태양(병화) 일간답게 남들 시선과 관심 없이는 못 사는 지독한 관종 기질과 급발진 성향이 치명적입니다. 시작만 거창하고 식을 땐 누구보다 무책임하게 등을 돌립니다.",
            '丁': "촛불(정화) 일간답게 겉은 차분한 척하지만 속은 질투와 예민함으로 부글부글 끓고 있습니다. 한 번 삐지면 은근슬쩍 상대의 아픈 곳을 찌르는 서늘한 뒤끝의 소유자입니다.",
            '戊': "큰 산(무토) 일간답게 '내가 곧 법'이라는 답답한 꼰대 기질과 융통성 제로의 고집이 뼈에 박혀 있습니다. 변화를 극도로 거부해 스스로 시대에 도태되기 쉽습니다.",
            '己': "논밭(기토) 일간답게 속마음을 절대 다 보여주지 않고 실속만 챙기는 의심 많은 현실주의자입니다. 겉으론 다 받아주는 척하지만 속으론 깐깐하게 등급을 매기고 있습니다.",

            '甲申': "자신이 세운 높은 자존심의 성벽에 갇혀, 변화하는 현실을 받아들이지 못하고 꺾일 때까지 버티는 미련한 고집의 화신입니다. 위기 대처 능력은 부족하면서 오기와 허세만 앞세워 억지를 부리다 주변까지 힘들게 합니다. 타협을 실패나 굴복으로 여기는 극단적인 흑백논리 탓에, 충분히 수월하게 갈 수 있는 길도 스스로 험난하게 만들어 걷게 됩니다.",
            '乙酉': "신경이 면도날처럼 날카롭고 예민하여 곁에 있는 사람이 숨소리조차 편히 내지 못하게 만드는 까탈스러움을 가졌습니다. 타인의 아주 작은 실수 하나도 잊지 않고 적어두었다가 반드시 팩트 폭력으로 되돌려주는 집요한 성격입니다. 겉으론 연약하고 상처받기 쉬워 보이나, 내면은 본인의 안위를 위해 타인을 차갑게 밟고 올라서는 승부욕이 강합니다.",
            '丙戌': "감정 기복이 롤러코스터 같아 도무지 어느 장단에 맞춰야 할지 종잡을 수 없는 통제 불능의 다혈질입니다. 뒷수습은 생각지 않고 화가 나는 순간 날 선 말을 여과 없이 쏟아내어 평생 씻을 수 없는 상처를 남기고 뒤늦게 후회하는 패턴을 반복합니다. 겉으론 쿨한 대인배인 척하지만 사소한 비판 하나도 넘기지 못하고 마음속에 담아두는 편입니다.",
            '丁亥': "생각의 미로에 갇혀 명확한 결단 내리기를 극도로 두려워하는 답답한 우유부단함의 표본입니다. 관계에서 갈등이 생기면 정면으로 대화하여 해결하려 하지 않고, 핑계를 대며 상황을 회피하거나 잠수를 타버립니다. 겉으로는 모두에게 좋은 사람으로 남으려 하지만, 속으로 억눌러둔 불만을 엉뚱한 곳에서 삐딱하게 터뜨리는 소극적 공격성이 짙습니다.",
            '戊子': "과묵하고 듬직해 보이는 겉모습과 달리, 속으로는 끊임없이 본인의 이익을 계산하는 치밀한 현실주의자입니다. 물질에 대한 집착과 불안감이 강해 조금의 손해도 보지 않으려는 방어적인 기질로 주변을 지치게 만듭니다. 타인에게 깊은 신뢰를 주는 척하지만 결국 인간관계마저 득실과 비즈니스로 평가하는 메마른 내면을 지녔습니다.",
            '己丑': "새로운 시도나 변화를 극도로 꺼리며 본인의 낡은 경험과 생각에 사로잡혀 대화가 통하지 않는 꽉 막힌 성격입니다. 주변에서 아무리 합리적으로 만류해도 기어이 본인의 굳건한 고집대로 밀어붙이다 일을 그르치곤 합니다. 불만이 있어도 속마음을 꾹 숨기고 있다가 타인의 작은 흠결을 두고두고 원망하며 곱씹는 집요한 뒤끝이 타인을 몹시 지치게 합니다.",
            '庚寅': "타인의 입장이나 상황은 전혀 배려하지 않고 오직 힘과 목소리 크기로 자신의 방식만을 강요하는 독단적인 성향이 강합니다. 본인이 무조건 옳다는 오만함에 빠져 조언을 건네는 사람마저 적으로 간주하고 방어 태세를 취합니다. 참을성이 부족해 장애물이 생기면 억지로 부수고 나가려다 결국 소중한 사람들과의 관계를 파탄 낼 위험이 큽니다.",
            '辛卯': "타인의 단점을 귀신같이 찾아내어 논리적으로 난도질하는 비판 능력을 가졌으나, 정작 본인을 향한 사소한 지적에는 방어벽을 치고 펄펄 뛰는 이중적인 면모가 있습니다. 지나치게 예민한 완벽주의 탓에 스스로도 피곤하게 살지만 곁에 있는 사람의 자존감마저 갉아먹습니다. 타인에게 따뜻한 위로와 온기를 내어주기보다는 차가운 지적을 앞세우는 편입니다.",
            '壬辰': "스케일이 큰 대장부인 척 호탕하게 굴지만, 이면에는 타인을 내 뜻대로 조종하려는 음흉한 권력욕과 옹졸한 피해의식이 깊게 자리 잡고 있습니다. 상황을 이중, 삼중으로 꼬아 생각하며 사람의 진심을 끊임없이 시험하고 의심합니다. 진행하던 일이 뜻대로 돌아가지 않으면 무책임하게 판 전체를 엎어버리는 극단적이고 파괴적인 면이 있습니다.",
            '癸巳': "어디서나 이익을 좇아 기가 막히게 노선을 갈아타는 기회주의적 처세술이 매우 발달해 있습니다. 겉으로는 부드럽게 미소 지으며 친절을 베풀지만, 그 이면에는 결국 상대를 이용하기 위한 철저한 계산과 밑밥 깔기가 숨어 있는 경우가 많습니다. 불리한 상황이나 무거운 책임 앞에서는 남에게 은근슬쩍 떠넘기는 회피 성향이 있어 깊은 신뢰를 얻기 힘듭니다.",
            '甲午': "순간적인 충동이 떠오르면 앞뒤 재지 않고 일단 저지르고 보는 브레이크 없는 폭주 기관차입니다. 매사에 진득한 끈기가 부족해 제대로 끝맺는 일이 드문 전형적인 용두사미의 모습을 보입니다. 감정 조절이 서툴러 욱하는 성질에 필터링 없는 막말을 내뱉어 스스로 관계를 망칩니다. 화려한 겉치레에 에너지를 낭비하다 정작 중요한 인생의 실속을 놓치기 쉽습니다.",
            '乙未': "환경에 잘 적응하는 온화하고 무던한 척을 하지만, 뼛속까지 삐딱한 시선으로 세상을 바라보며 불평불만을 달고 사는 염세주의자입니다. 타인의 성공을 진심으로 축하하지 못하고 은근히 깎아내리려는 자격지심이 심합니다. 삶에 문제가 생기면 스스로의 잘못을 돌아보고 반성하기보다 환경 탓, 남 탓으로 돌리며 합리화의 성을 쌓고 숨어버리는 회피 본능이 강합니다.",
            '丙申': "진지함과 무게감 없이 얕은 잔머리만 굴리며 이리저리 곤란한 상황을 모면하려는 성향이 강합니다. 깊이 있는 지식이나 노력이 뒷받침되지 않은 채 가볍게 아는 척을 하다 결국 실력이 탄로 나 신뢰를 잃기 십상입니다. 쉽게 달아오르고 너무 쉽게 식어버리는 냄비 같은 기질 탓에 책임감 있는 관계나 무거운 업무를 끈기 있게 소화해 내지 못합니다.",
            '丁酉': "물질적인 조건과 화려한 대외적 겉모습에 과도하게 집착하여, 타인의 가치마저 재력과 외모로만 평가하는 속물적인 마인드의 소유자입니다. 지나치게 까탈스러운 미적 기준과 성격으로 주변을 피곤하게 하며, 본인의 기준에 못 미치면 가차 없이 선을 긋습니다. 자신만 세련되고 우아하다는 선민의식에 빠져 정작 내면을 성찰하지 못하는 오만함이 있습니다.",
            '戊戌': "자신이 쌓아온 좁은 경험과 지식만이 세상의 절대적 진리라고 굳게 믿는 답답하고 융통성 없는 꼰대 기질이 다분합니다. 타인의 새로운 의견이나 시대의 변화를 자신에 대한 위협으로 간주하고 무조건 찍어 누르려 듭니다. 속에는 억눌린 고집이 꽉 차 있어 건드리면 폭발하며, 한 번 틀어진 사람에게는 징그러운 뒤끝을 품고 살아가는 피곤한 성향입니다.",
            '己亥': "타인에 대한 의심이 깊어 누군가의 순수한 호의마저도 삐딱하게 왜곡하여 받아들이며 혼자만의 망상 속에서 소설을 쓰는 피곤한 성격입니다. 스스로 결단 내리는 것을 극도로 두려워해 이리저리 끌려다니다가, 결과가 나쁘면 비겁하게 남 탓을 시전합니다. 앞에서는 갈등을 피하려 조용히 있다가 뒤에서 끊임없이 불만을 토로하는 이중성으로 타인의 에너지를 고갈시킵니다.",
            '庚子': "타인의 감정에는 눈곱만큼도 공감하지 못하면서, 얼음장같이 차가운 논리로 상대의 뼈를 때리는 팩트 폭격을 날리는 데서 묘한 우월감을 느끼는 냉혈한입니다. 자신이 가장 이성적이고 똑똑하다는 착각에 빠져 무례하게 남들을 가르치려 듭니다. 인간관계마저 철저히 득실로 평가해 본인에게 쓸모가 없다고 판단되면 가차 없이 끊어버리는 매정한 면이 있습니다.",
            '辛丑': "지독한 황소고집과 세상을 비관적으로 바라보는 어두운 시선이 합쳐져 곁에 있는 사람의 마음마저 우울하게 전염시키는 무거운 멘탈의 소유자입니다. 남의 작은 흠결도 잊지 않고 현미경으로 관찰하며 평생을 곱씹는 집요함을 보여줍니다. 유연하게 상황을 넘기는 법을 몰라 스스로 험난한 가시밭길을 자처하면서도 끝까지 본인이 옳다고 우기는 미련함이 있습니다.",
            '壬寅': "입만 열면 세상을 다 가진 듯 원대한 계획을 털어놓지만 막상 현실에서 실천하라고 하면 핑계만 대며 손가락 하나 까딱하지 않는 게으른 몽상가입니다. 얕은 오지랖으로 남의 일에 간섭하여 분란을 조장하면서 정작 본인 인생의 앞가림은 처참한 수준입니다. 진득하게 한 가지에 몰두하지 못하고 늘 자극적인 것만 기웃거리다 소중한 기회를 낭비하곤 합니다.",
            '癸卯': "스스로 삶을 개척해 나갈 생각 없이 늘 타인에게 기대고 의존하여 정서적 에너지를 빼앗으려 드는 나약함의 결정체입니다. 아주 작은 스트레스와 위기 앞에서도 세상이 끝난 것처럼 징징거리며 타인의 동정심을 무기로 상대를 조종하려 합니다. 책임감이 심각하게 결여되어 있어 힘든 상황이 발생하면 이리저리 핑계를 대며 도망 다니기에 바쁩니다.",
            '甲辰': "겉으로는 포용력 있는 대인배 코스프레를 하지만 실상은 모든 상황을 자신이 쥐고 흔들어야만 직성이 풀리는 억압적인 통제 성향이 짙습니다. 지나친 승부욕과 우월감으로 타인을 굴복시키려다 결국 관계와 조직을 파탄으로 몰고 갑니다. 명분과 도리를 앞세우지만, 이면에는 세속적인 탐욕과 물질에 대한 집착이 강하게 도사리고 있어 본성이 드러나곤 합니다.",
            '乙巳': "감정의 기복과 변덕이 하루에도 열두 번씩 바뀌어 주변 사람들이 도저히 장단을 맞출 수 없는 피곤하고 불안정한 성격입니다. 화려한 겉치장과 대중의 관심에만 에너지를 쏟아부어 내면의 깊이는 부족한 편이며, 입이 가벼워 남의 비밀을 가십거리로 발설하는 악취미가 있습니다. 진득하고 깊은 관계의 무게를 견디지 못하고 쉽게 질려버리는 회피형 멘탈입니다.",
            '丙午': "불난 집에 기름을 붓듯 참을성이 전혀 없고 순간적인 화를 억누르지 못하는 감정 통제 불능자입니다. 화가 나면 상황을 가리지 않고 극단적으로 돌변하여 그동안 쌓아온 공든 탑을 한순간에 스스로 무너뜨리는 패턴을 보입니다. 타인의 입장은 전혀 고려하지 않고 본인의 끓어오르는 감정만을 최우선으로 앞세우다 결국 세상 사람들의 외면을 받기 십상입니다.",

        function getSeasonJohuFact(mZhi) {

        // 삼재(三災) 자동 판독 (띠 기준)
        function getSamjaeStatus(yZhi, curYearZhi) {
            const groups = [
                { zhis: ['申','子','辰'], samjae: ['寅','卯','辰'] },
                { zhis: ['寅','午','戌'], samjae: ['申','酉','戌'] },
                { zhis: ['巳','酉','丑'], samjae: ['亥','子','丑'] },
                { zhis: ['亥','卯','未'], samjae: ['巳','午','未'] }
            ];
            for (const g of groups) {
                if (g.zhis.includes(yZhi)) {
                    const idx = g.samjae.indexOf(curYearZhi);
                    if (idx === 0) return '들삼재(재난 진입기)';
                    if (idx === 1) return '눌삼재(가장 묵직한 정체기)';
                    if (idx === 2) return '날삼재(마지막 뒤통수 주의기)';
                }
            }
            return null;
        }

        // ==========================================================
        // 5. 핵심 초정밀 명리 분석 엔진 (10개 섹션 풀패키지)
        // ==========================================================
        function generateLifetimeFortune(bazi, gender, timeStr, birthYear, curYearGZ) {
            const yGan = bazi.getYear().charAt(0), yZhi = bazi.getYear().charAt(1);
            const mGan = bazi.getMonth().charAt(0), mZhi = bazi.getMonth().charAt(1);
            const dGan = bazi.getDay().charAt(0), dZhi = bazi.getDay().charAt(1);
            const tGan = timeStr === 'unknown' ? '?' : bazi.getTime().charAt(0);
            const tZhi = timeStr === 'unknown' ? '?' : bazi.getTime().charAt(1);

            const pillars = [
                { name: '년주', gan: yGan, zhi: yZhi },
                { name: '월주', gan: mGan, zhi: mZhi },
                { name: '일주', gan: dGan, zhi: dZhi },
                { name: '시주', gan: tGan, zhi: tZhi }
            ];

            const iljuKey = dGan + dZhi;
            const iljuHg = charData[dGan].hg + charData[dZhi].hg;
            const dmElement = charData[dGan].el;

            // 1) 오행 개수 & 가중치
            const elCount = { '木':0, '火':0, '土':0, '金':0, '水':0 };
            const elWeight = { '木':0, '火':0, '土':0, '金':0, '水':0 };
            const allCharsForEl = [
                { c: yGan, w: 1.0 }, { c: yZhi, w: 1.0 },
                { c: mGan, w: 1.2 }, { c: mZhi, w: 2.5 },
                { c: dGan, w: 1.0 }, { c: dZhi, w: 1.5 }
            ];
            if (timeStr !== 'unknown') allCharsForEl.push({ c: tGan, w: 1.2 }, { c: tZhi, w: 1.0 });
            const totalChars = allCharsForEl.length;
            allCharsForEl.forEach(({ c, w }) => {
                if (charData[c]) { elCount[charData[c].el]++; elWeight[charData[c].el] += w; }
            });

            // 2) 정확한 10신 & 5그룹 계산 (일간 제외!)
            const tg10Score = { '비견':0,'겁재':0,'식신':0,'상관':0,'편재':0,'정재':0,'편관':0,'정관':0,'편인':0,'정인':0 };
            const tg10Count = { '비견':0,'겁재':0,'식신':0,'상관':0,'편재':0,'정재':0,'편관':0,'정관':0,'편인':0,'정인':0 };
            const tgGroupCount = { '비겁':0,'식상':0,'재성':0,'관성':0,'인성':0 };
            const tgGroupScore = { '비겁':0,'식상':0,'재성':0,'관성':0,'인성':0 };

            const otherChars = [
                { c: yGan, w: 1.0 }, { c: yZhi, w: 1.0 },
                { c: mGan, w: 1.2 }, { c: mZhi, w: 2.5 },
                { c: dZhi, w: 1.5 }
            ];
            if (timeStr !== 'unknown') otherChars.push({ c: tGan, w: 1.2 }, { c: tZhi, w: 1.0 });
            const totalOtherChars = otherChars.length;
            let totalOtherWeight = 0;

            otherChars.forEach(({ c, w }) => {
                const tg = getTenGod10(dGan, c);
                if (tg) {
                    tg10Count[tg]++; tg10Score[tg] += w;
                    const grp = TEN_TO_GROUP[tg];
                    tgGroupCount[grp]++; tgGroupScore[grp] += w;
                    totalOtherWeight += w;
                }
            });

            const yGanTG = getTenGod10(dGan, yGan), yZhiTG = getTenGod10(dGan, yZhi);
            const mGanTG = getTenGod10(dGan, mGan), mZhiTG = getTenGod10(dGan, mZhi);
            const dZhiTG = getTenGod10(dGan, dZhi);
            const tGanTG = getTenGod10(dGan, tGan), tZhiTG = getTenGod10(dGan, tZhi);

            // 월지 지장간 투간(透干) 여부로 진정한 격국 판별
            const visibleGans = [yGan, mGan, tGan].filter(g => g && g !== '?');
            const mJJG = charData[mZhi].jjg;
            let tuganStem = null;
            for (let i = mJJG.length - 1; i >= 0; i--) {
                if (visibleGans.includes(mJJG[i])) { tuganStem = mJJG[i]; break; }
            }
            const gyeokgukTG = (tuganStem ? getTenGod10(dGan, tuganStem) : mZhiTG) || mZhiTG;
            const gyeokLabel = tuganStem ? `${gyeokgukTG}격 (월지 지장간 ${tuganStem} 투간)` : `${gyeokgukTG}격 (월지 본기)`;

            // 12운성 4자리
            const yUn = get12Unseong(dGan, yZhi), mUn = get12Unseong(dGan, mZhi);
            const dUn = get12Unseong(dGan, dZhi), tUn = get12Unseong(dGan, tZhi);

            // 최다 10신 1, 2순위
            const sortedTG10 = Object.keys(tg10Score).sort((a, b) => tg10Score[b] - tg10Score[a]);
            const domTG1 = tg10Score[sortedTG10[0]] > 0 ? sortedTG10[0] : mZhiTG;
            const domTG2 = tg10Score[sortedTG10[1]] > 0 ? sortedTG10[1] : dZhiTG;

            // 3) 신강/신약 5단계
            const mySideWeight = tgGroupScore['비겁'] + tgGroupScore['인성'];
            const myRatio = totalOtherWeight > 0 ? (mySideWeight / totalOtherWeight) * 100 : 50;
            let strengthLevel = '중화', strengthDesc = '';
            if (myRatio >= 68) {
                strengthLevel = '극신강';
                strengthDesc = `내 편 기운이 ${Math.round(myRatio)}%로 폭주하는 극신강 사주입니다. 자기 확신이 오만으로 변질되어 남의 말은 절대 안 듣고 밀어붙이다 부러지는 독불장군 구조입니다.`;
            } else if (myRatio >= 54) {
                strengthLevel = '신강';
                strengthDesc = `주체성이 강한 신강 사주(${Math.round(myRatio)}%)입니다. 버티는 힘은 좋으나 고집과 아집이 세서 타협을 모르고 주변을 자기 기준대로 휘두르려 듭니다.`;
            } else if (myRatio >= 42) {
                strengthLevel = '중화';
                strengthDesc = `기운이 한쪽으로 크게 쏠리지 않은 중화 사주(${Math.round(myRatio)}%)입니다. 무난해 보이지만 결정적인 독기가 부족해 어정쩡한 포지션에 머물기 쉽습니다.`;
            } else if (myRatio >= 26) {
                strengthLevel = '신약';
                strengthDesc = `내 기운이 ${Math.round(myRatio)}%에 불과한 신약 사주입니다. 욕심과 압박은 큰데 버틸 멘탈이 따라주지 않아 남 눈치 보며 휘둘리거나 쉽게 지쳐 도망칩니다.`;
            } else {
                strengthLevel = '극신약';
                strengthDesc = `내 세력이 ${Math.round(myRatio)}%로 극도로 취약한 극신약 사주입니다. 스스로 중심을 못 잡아 환경과 타인에게 끌려다니며 스트레스에 멘탈이 유리처럼 깨지기 쉽습니다.`;
            }

            // 4) 기신 & 용신
            const sortedElsByWeight = Object.keys(elWeight).sort((a, b) => elWeight[b] - elWeight[a]);
            const missingEls = Object.keys(elCount).filter(e => elCount[e] === 0);
            const excessiveEls = Object.keys(elCount).filter(e => elCount[e] >= 3);
            let badElement = sortedElsByWeight[0], goodElement = sortedElsByWeight[4], badReason = '';

            if (strengthLevel === '극신강' || strengthLevel === '신강') {
                const myEl = dmElement, inEl = EL_GEN_BY[dmElement];
                badElement = elWeight[myEl] >= elWeight[inEl] ? myEl : inEl;
                goodElement = [EL_GEN[dmElement], EL_CTRL[dmElement], EL_CTRL_BY[dmElement]].sort((a, b) => elWeight[a] - elWeight[b])[0];
                badReason = `이미 자기 기운이 넘치는 <span class='hl'>${strengthLevel}</span> 명식이라 나를 더 부추기는 <span class='hl'>${EL_KR[badElement]}</span> 기운이 들어오면 고집과 독선이 폭주해 사람과 돈을 다 잃는 악운이 터집니다.`;
            } else if (strengthLevel === '극신약' || strengthLevel === '신약') {
                badElement = [EL_GEN[dmElement], EL_CTRL[dmElement], EL_CTRL_BY[dmElement]].sort((a, b) => elWeight[b] - elWeight[a])[0];
                goodElement = [EL_GEN_BY[dmElement], dmElement].sort((a, b) => elWeight[a] - elWeight[b])[0];
                badReason = `버틸 힘이 부족한 <span class='hl'>${strengthLevel}</span> 명식에서 나를 짓누르고 기운을 빼앗는 <span class='hl'>${EL_KR[badElement]}</span> 기운이 과도하게 작용해 멘탈 붕괴와 손실을 부르는 최악의 악운이 됩니다.`;
            } else {
                badElement = sortedElsByWeight[0];
                goodElement = missingEls.length > 0 ? missingEls[0] : sortedElsByWeight[4];
                badReason = `균형이 깨지기 쉬운 중화 명식에서 가장 쏠려 있는 <span class='hl'>${EL_KR[badElement]}</span> 기운이 한 번 더 들어오면 숨겨둔 단점이 한꺼번에 터져 나옵니다.`;
            }

            // 5) 형충파해 & 신살 15종
            const rel = analyzeDeepRelations(pillars, dGan, dZhi, yZhi);

            // 6) 5대 팩폭 위험도 지수 (사주 데이터 기반 실제 계산: 25~99%)
            const clamp = (v) => Math.max(25, Math.min(99, Math.round(v)));
            const riskStubborn = clamp(35 + tgGroupScore['비겁'] * 12 + (['제왕','건록','묘'].includes(dUn) ? 15 : 0) + (elCount['土'] >= 3 || elCount['金'] >= 3 ? 12 : 0));
            const riskEmotion  = clamp(30 + tg10Score['상관'] * 15 + tg10Score['편관'] * 10 + rel.zhiChungs.length * 16 + rel.gwimuns.length * 14 + (elCount['火'] >= 3 ? 15 : 0));
            const riskMoney    = clamp(30 + tg10Score['겁재'] * 16 + tg10Score['편재'] * 10 + (tgGroupCount['재성'] === 0 ? 22 : 0) + (myRatio < 40 && tgGroupCount['재성'] >= 2 ? 24 : 0));
            const riskLove     = clamp(30 + rel.wonjins.length * 18 + (rel.hasDohwa ? 12 : 0) + (rel.hasHongyeom ? 14 : 0) + (rel.hasGoran ? 18 : 0) + (rel.zhiChungs.some(c => c.p1==='일주'||c.p2==='일주') ? 20 : 0));
            const riskMental   = clamp(30 + tg10Score['편인'] * 15 + (100 - myRatio) * 0.4 + rel.gwimuns.length * 15 + (['병','사','절'].includes(dUn) ? 15 : 0));

            // 7) 일지 지장간(속마음 겉과 속 모순) 분석
            const dJJG = charData[dZhi].jjg;
            const hiddenFirst = dJJG[0];
            const hiddenMain = dJJG[dJJG.length - 1];
            const hiddenFirstTG = getTenGod10(dGan, hiddenFirst);
            const hiddenMainTG = getTenGod10(dGan, hiddenMain);
            const jjgContradiction = (hiddenFirstTG && hiddenMainTG && hiddenFirstTG !== hiddenMainTG)
                ? `당신의 일지(${dZhi}) 지장간 속에는 <span class='hl'>${dJJG.join('·')}</span>이 숨어 있습니다. 겉으로 드러나는 본심은 <span class='hl'>${hiddenMainTG}</span>인 척 포장하지만, 그 밑바닥 초기 기운에는 <span class='hl'>${hiddenFirstTG}</span>의 욕망이 도사리고 있어 결정적인 순간에 겉과 속이 180도 다른 이중성을 드러냅니다.`
                : `당신의 일지(${dZhi}) 지장간은 <span class='hl'>${dJJG.join('·')}</span>으로 기운이 한쪽으로 순수하게 뭉쳐 있습니다. 앞뒤가 다른 건 아니지만 그만큼 <span class='hl'>${hiddenMainTG}</span>의 단점이 여과 없이 날것 그대로 튀어나와 주변을 피곤하게 만듭니다.`;

            // ==========================================================
            // HTML 렌더링 시작
            // ==========================================================
            let html = "";
            html += "<div class='fortune-result-title'>👊 초정밀 뼈때리는 사주 해부</div>";
            html += "<div class='result-highlight'>";
            html += `<div class='payment-info'>결제 번호: ${orderId}</div>`;
            html += `<div class='bazi-display'>${iljuHg}(${iljuKey}) 일주</div>`;
            html += `<div class='bazi-detail'>일간: ${charData[dGan].full} · 격국: ${gyeokLabel}<br>세력: ${strengthLevel}(${Math.round(myRatio)}%) · 자좌 12운성: ${dUn}</div>`;
            html += "<div class='summary-badges'>";
            html += `<span class='badge-pill dark'>${domTG1} + ${domTG2}</span>`;
            html += `<span class='badge-pill'>기신: ${EL_KR[badElement]}</span>`;
            html += `<span class='badge-pill'>용신: ${EL_KR[goodElement]}</span>`;
            if (missingEls.length > 0) html += `<span class='badge-pill'>결핍: ${missingEls.join('·')}</span>`;

                    const month = parseInt(sessionStorage.getItem('saju_month'), 10);
                    const day = parseInt(sessionStorage.getItem('saju_day'), 10);
                    const timeStr = sessionStorage.getItem('saju_time') || 'unknown';

                    const timeMap = {
                        'unknown': 12, '자시': 0, '축시': 2, '인시': 4, '묘시': 6,
                        '진시': 8, '사시': 10, '오시': 12, '미시': 14, '신시': 16,
                        '유시': 18, '술시': 20, '해시': 22
                    };
                    const hour = timeMap[timeStr] !== undefined ? timeMap[timeStr] : 12;

                    let lunarObj;
                    if (calendarType === 'solar') {
                        lunarObj = Solar.fromYmdHms(year, month, day, hour, 0, 0).getLunar();
                    } else if (calendarType === 'lunar') {
                        lunarObj = Lunar.fromYmdHms(year, month, day, hour, 0, 0);
                    } else {
                        try {
                            lunarObj = Lunar.fromYmdHms(year, -Math.abs(month), day, hour, 0, 0);
                        } catch (leapErr) {
                            lunarObj = Lunar.fromYmdHms(year, Math.abs(month), day, hour, 0, 0);
                        }
                    }

                    const bazi = lunarObj.getEightChar();
                    // 올해 세운 간지 자동 계산 (입춘 지난 6월 1일 기준)
                    let curYearGZ = '';
                    try {
                        curYearGZ = Solar.fromYmd(new Date().getFullYear(), 6, 1).getLunar().getYearInGanZhi();
                    } catch (e) {}

                    const fortuneHtml = generateLifetimeFortune(bazi, gender, timeStr, year, curYearGZ);

                    document.getElementById('result-loading').style.display = 'none';
                    document.getElementById('dynamic-fortune-content').innerHTML = fortuneHtml;
                    document.getElementById('dynamic-fortune-content').style.display = 'block';
                    document.getElementById('go-home-btn').style.display = 'block';
                } catch (err) {
                    console.error("사주 계산 오류:", err);
                    document.getElementById('result-loading').innerText = "사주 정보를 불러오는 중 오류가 발생했습니다. 생년월일을 다시 확인해주세요.";
                }
            }, 1500);
        };
    </script>
