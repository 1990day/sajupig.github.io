    // ==========================================================

    const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const charData = {
        '甲': { hg:'갑', el:'木', yy:1, cls:'c-wood' }, '乙': { hg:'을', el:'木', yy:0, cls:'c-wood' },
        '丙': { hg:'병', el:'火', yy:1, cls:'c-fire' }, '丁': { hg:'정', el:'火', yy:0, cls:'c-fire' },

        '戌': { hg:'술', el:'土', yy:1, cls:'c-earth'}, '亥': { hg:'해', el:'水', yy:1, cls:'c-water'}

    const generateMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
    const overcomeMap = { '木':'土', '土':'水', '水':'火', '火':'金', '金':'木' };
    const TEN_TO_GROUP = {
        '비견':'비겁','겁재':'비겁','식신':'식상','상관':'식상',
        '편재':'재성','정재':'재성','편관':'관성','정관':'관성','편인':'인성','정인':'인성'
    };

    const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
    const UNSEONG_START = { '甲':11,'乙':6,'丙':2,'丁':9,'戊':2,'己':9,'庚':5,'辛':0,'壬':8,'癸':3 };

    function get12Unseong(dGan, zhi) {
        if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return '';
        const s = UNSEONG_START[dGan], z = BRANCHES.indexOf(zhi);
        return UNSEONG_NAMES[charData[dGan].yy === 1 ? (z - s + 12) % 12 : (s - z + 12) % 12];
    }

    function getTenGod10(dGan, targetChar) {
        if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
        const dm = charData[dGan], tg = charData[targetChar], same = (dm.yy === tg.yy);
        if (dm.el === tg.el) return same ? '비견' : '겁재';
        if (generateMap[dm.el] === tg.el) return same ? '식신' : '상관';
        if (overcomeMap[dm.el] === tg.el) return same ? '편재' : '정재';
        if (overcomeMap[tg.el] === dm.el) return same ? '편관' : '정관';
        if (generateMap[tg.el] === dm.el) return same ? '편인' : '정인';
        return null;
    }

    function getCharHtml(char) {
        if (!char || char === '?' || char === 'unknown') return "?";
        const d = charData[char];
        return d ? `<span class="${d.cls}">${char}</span>` : char;
    }

    // ==========================================================

        '丙寅': "감정 표현이 솔직하고 열정적인 만큼 이별 직후에는 크게 힘들어하지만, 특유의 밝은 에너지로 비교적 빠르게 일상에 복귀합니다. 전 연인이 다시 다가오면 반갑게 맞이할 수는 있으나, 무겁고 구속적인 패턴으로 돌아가는 것에는 부담을 느껴 가벼운 거리부터 시작하려 합니다.",

            if (safeOrderId && safePaymentKey && safePaymentKey !== 'revisit') {
                try {
                    const purchaseRef = doc(db, "users", user.uid, "purchases", safeOrderId);
                    await setDoc(purchaseRef, {
                        orderId: safeOrderId,
                        itemName: "돼지 재회 사주",
                        itemType: "reunionpig",
                        purchaseDate: new Date().toISOString(),
                        sajuInfo: {
                            year: sessionStorage.getItem('me_year'),
                            month: sessionStorage.getItem('me_month'),
                            day: sessionStorage.getItem('me_day'),
                            time: sessionStorage.getItem('me_time'),
                            gender: sessionStorage.getItem('me_gender'),
                            calendar: sessionStorage.getItem('me_calendar'),
                            youYear: sessionStorage.getItem('you_year'),
                            youMonth: sessionStorage.getItem('you_month'),
                            youDay: sessionStorage.getItem('you_day'),
                            youTime: sessionStorage.getItem('you_time'),
                            youGender: sessionStorage.getItem('you_gender'),
                            youCalendar: sessionStorage.getItem('you_calendar')
                        }
                    }, { merge: true });
                } catch (e) { console.error("영수증 저장 실패:", e); }
            }
        } else {
            if(headerBtn) { headerBtn.innerText = "로그인 / 가입"; headerBtn.onclick = openLogin; }
        }
    });

    window.realGoogleLogin = function() { signInWithPopup(auth, googleProvider).then(() => { closeLogin(); }).catch(console.error); }
    window.realKakaoLogin = function() { const kakaoProvider = new OAuthProvider('oidc.kakao'); signInWithPopup(auth, kakaoProvider).then(() => { closeLogin(); }).catch(console.error); }
</script>
<script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
    });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
</script>
