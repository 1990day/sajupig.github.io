        // ==========================================================

        const sajuYear = sessionStorage.getItem('saju_year');
        const orderId = urlParams.get('orderId') || '현장결제';

        window.globalPaymentKey = paymentKey;

        if (!paymentKey || paymentKey === '') {
            alert("정상적인 결제 내역이 확인되지 않았습니다! 결제 페이지로 이동합니다.");

        // ==========================================================

        // ==========================================================
        const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

            '丁': { hg: '정', full: '정화', el: '火', yy: 0, cls: 'c-fire' },
            '戊': { hg: '무', full: '무토', el: '土', yy: 1, cls: 'c-earth' },

            '辛': { hg: '신', full: '신금', el: '金', yy: 0, cls: 'c-metal' },

            '癸': { hg: '계', full: '계수', el: '水', yy: 0, cls: 'c-water' },
            '子': { hg: '자', full: '자수', el: '水', yy: 0, cls: 'c-water', jjg: ['壬','癸'] },
            '丑': { hg: '축', full: '축토', el: '土', yy: 0, cls: 'c-earth', jjg: ['癸','辛','己'] },
            '寅': { hg: '인', full: '인목', el: '木', yy: 1, cls: 'c-wood',  jjg: ['戊','丙','甲'] },
            '卯': { hg: '묘', full: '묘목', el: '木', yy: 0, cls: 'c-wood',  jjg: ['甲','乙'] },
            '辰': { hg: '진', full: '진토', el: '土', yy: 1, cls: 'c-earth', jjg: ['乙','癸','戊'] },
            '巳': { hg: '사', full: '사화', el: '火', yy: 1, cls: 'c-fire',  jjg: ['戊','庚','丙'] },
            '午': { hg: '오', full: '오화', el: '火', yy: 0, cls: 'c-fire',  jjg: ['丙','己','丁'] },
            '未': { hg: '미', full: '미토', el: '土', yy: 0, cls: 'c-earth', jjg: ['丁','乙','己'] },
            '申': { hg: '신', full: '신금', el: '金', yy: 1, cls: 'c-metal', jjg: ['戊','壬','庚'] },
            '酉': { hg: '유', full: '유금', el: '金', yy: 0, cls: 'c-metal', jjg: ['庚','辛'] },
            '戌': { hg: '술', full: '술토', el: '土', yy: 1, cls: 'c-earth', jjg: ['辛','丁','戊'] },
            '亥': { hg: '해', full: '해수', el: '水', yy: 1, cls: 'c-water', jjg: ['戊','甲','壬'] }
        };

        const EL_KR = { '木': '목(木)', '火': '화(火)', '土': '토(土)', '金': '금(金)', '水': '수(水)' };
        const EL_GEN = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };
        const EL_CTRL = { '木': '土', '火': '金', '土': '水', '金': '木', '水': '火' };
        const EL_CTRL_BY = { '木': '金', '火': '水', '土': '木', '金': '火', '水': '土' };
        const EL_GEN_BY = { '木': '水', '火': '木', '土': '火', '金': '土', '水': '金' };

        const TEN_TO_GROUP = {
            '비견': '비겁', '겁재': '비겁', '식신': '식상', '상관': '식상',
            '편재': '재성', '정재': '재성', '편관': '관성', '정관': '관성',
            '편인': '인성', '정인': '인성'
        };

        const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
        const UNSEONG_START = { '甲':11, '乙':6, '丙':2, '丁':9, '戊':2, '己':9, '庚':5, '辛':0, '壬':8, '癸':3 };

        function get12Unseong(dGan, zhi) {
            if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return null;
            const startIdx = UNSEONG_START[dGan], zIdx = BRANCHES.indexOf(zhi);
            const diff = charData[dGan].yy === 1 ? (zIdx - startIdx + 12) % 12 : (startIdx - zIdx + 12) % 12;
            return UNSEONG_NAMES[diff];
        }

        function getHtmlChar(char) {
            if (!char || char === '?' || char === 'unknown') return "<span class='c-unknown'>?</span><span class='char-hg'>(모름)</span>";
            const data = charData[char];
            if (!data) return char;
            return `<span class='${data.cls}'>${char}</span><span class='char-hg'>(${data.hg})</span>`;
        }

        function getTenGod10(dGan, targetChar) {
            if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
            const dm = charData[dGan], tg = charData[targetChar], sameYY = (dm.yy === tg.yy);
            if (dm.el === tg.el) return sameYY ? '비견' : '겁재';
            if (EL_GEN[dm.el] === tg.el) return sameYY ? '식신' : '상관';
            if (EL_CTRL[dm.el] === tg.el) return sameYY ? '편재' : '정재';
            if (EL_CTRL_BY[dm.el] === tg.el) return sameYY ? '편관' : '정관';
            if (EL_GEN_BY[dm.el] === tg.el) return sameYY ? '편인' : '정인';
            return null;
        }

        function getGongmang(dGan, dZhi) {
            const sIdx = STEMS.indexOf(dGan), bIdx = BRANCHES.indexOf(dZhi);
            if (sIdx < 0 || bIdx < 0) return [];
            const startBranch = (bIdx - sIdx + 12) % 12;
            return [BRANCHES[(startBranch + 10) % 12], BRANCHES[(startBranch + 11) % 12]];
        }

        // ==========================================================
        // 2. 정확한 정통 신살(삼합 기준) & 천간/지지 합충형파해 판독기
        // ==========================================================
        function analyzeClassicRelations(pillars, dGan, dZhi, yZhi) {
            const items = [];
            const gans = pillars.map(p => ({ pos: p.name, c: p.gan })).filter(x => x.c && x.c !== '?');
            const zhis = pillars.map(p => ({ pos: p.name, c: p.zhi })).filter(x => x.c && x.c !== '?');
            const zList = zhis.map(x => x.c);
            const allChars = [...gans.map(x => x.c), ...zList];

            const findPairs = (pairDefs, list) => {
                const hits = [];
                for (let i = 0; i < list.length; i++) {
                    for (let j = i + 1; j < list.length; j++) {
                        for (const [a, b, label] of pairDefs) {
                            if ((list[i].c === a && list[j].c === b) || (list[i].c === b && list[j].c === a)) {
                                hits.push({ p1: list[i].pos, p2: list[j].pos, label });
                            }
                        }
                    }
                }
                return hits;
            };

            // 천간합·천간충
            const ganHaps = findPairs([['甲','己','갑기합'],['乙','庚','을경합'],['丙','辛','병신합'],['丁','壬','정임합'],['戊','癸','무계합']], gans);
            if (ganHaps.length > 0) {
                items.push({ name: `천간합(${ganHaps[0].label})`, desc: `원국 천간에 ${ganHaps.map(x=>x.label).join(', ')}이 걸려 타인과 합을 맞추는 유대감과 협상력이 좋지만, 지나치게 관계에 얽매이면 결단이 늦어질 수 있습니다.` });

            const ganChungs = findPairs([['甲','庚','갑경충'],['乙','辛','을신충'],['丙','壬','병임충'],['丁','癸','정계충']], gans);

                items.push({ name: `천간충(${ganChungs[0].label})`, desc: `${ganChungs.map(x=>`${x.p1}-${x.p2} ${x.label}`).join(', ')}이 있어 대외적 추진력과 혁신 기질이 강한 반면, 직설적 표현으로 인한 마찰을 조심해야 합니다.` });

            // 지지 6충 (위치별 정통 해석)

                ['子','午','자오충'],['丑','未','축미충'],['寅','申','인신충'],
                ['卯','酉','묘유충'],['辰','戌','진술충'],['巳','亥','사해충']
            ], zhis);
            if (zhiChungs.length > 0) {
                const posDesc = zhiChungs.map(h => {
                    const pk = `${h.p1}-${h.p2}`;
                    if (pk.includes('년주') && pk.includes('월주')) return `년월충(${h.label}): 조기 독립과 환경 변화가 잦아 일찍 자립심을 키우는 구조입니다.`;
                    if (pk.includes('월주') && pk.includes('일주')) return `월일충(${h.label}): 사회 환경과 내 성향이 부딪혀 이직·변동이 잦지만, 스스로 판을 바꾸는 돌파력이 큽니다.`;
                    if (pk.includes('일주') && pk.includes('시주')) return `일시충(${h.label}): 가까운 관계나 말년 계획에 변수가 생기기 쉬우니 안정적 안전장치가 필요합니다.`;
                    return `${pk} ${h.label}: 정체를 거부하고 변화를 일으키는 강한 역동성입니다.`;
                }).join(' ');
                items.push({ name: `지지충(${zhiChungs.map(x=>x.label).join('·')})`, desc: posDesc });

            // 형살 / 원진 / 귀문

            if (hasP('寅','巳') || hasP('巳','申') || hasP('寅','申') || hasP('丑','戌') || hasP('戌','未') || hasP('丑','未') || hasP('子','卯') || cnt('辰')>=2 || cnt('午')>=2 || cnt('酉')>=2 || cnt('亥')>=2) {

            return { items, zhiChungs, wonjins, gwimuns, hasDohwa, hasHongyeom, hasGwiin };

            '己巳': "따뜻한 대지 속 영리한 뱀처럼 겉은 부드럽고 사교적이지만 속에는 강한 승부욕과 치밀한 전략이 끓고 있습니다. 처세술과 눈치가 뛰어나 어느 조직에서든 핵심 실세로 자리 잡으며, 얼굴 붉히지 않고 실속을 챙기는 영리한 전략가입니다.",
            '庚午': "용광로 속에서 제련된 명검처럼 명예와 원칙을 중시하는 강직한 카리스마를 지녔습니다. 맺고 끊음이 칼같아 조직을 이끄는 힘이 강하지만, 타인에게도 지나치게 높은 완벽주의 잣대를 들이대지 않도록 부드러움을 더해야 합니다.",
            '辛未': "모래밭 깊은 곳에 숨은 보석처럼 독창적인 영감과 집요한 장인 정신을 지녔습니다. 타인에게 빚지거나 흠잡히기 싫어하는 꼿꼿한 자존심으로 특수 분야의 최고 전문가 자리에 오르며, 예민한 방어벽만 조금 낮추면 인복이 배가됩니다.",
            '壬申': "바위틈에서 솟아올라 바다로 흐르는 강물처럼 빠른 두뇌 회전과 넓은 융통성을 자랑합니다. 어떤 낯선 환경에서도 능구렁이처럼 적응해 기회를 잡아내며, 임기응변과 식복이 풍부해 실속 있는 삶을 살아가는 다재다능형입니다.",
            '癸酉': "맑은 바위 위 투명한 이슬처럼 눈치와 직관이 예리해 사물의 이면과 거짓을 단숨에 꿰뚫어 봅니다. 냉철한 계산력과 깔끔한 일 처리로 전문직·기획·의료·법조 분야에서 돋보이며, 도도한 기준을 조금만 유연하게 풀면 더 큰 신뢰를 얻습니다.",
            '甲戌': "가을 들판에 억세게 선 단풍나무처럼 현실 감각과 상업적 촉이 매우 예리합니다. 남의 지시를 받기보다 독립적인 사업이나 프로젝트로 큰 목돈을 만져야 직성이 풀리며, 목표를 위해 자존심도 조절할 줄 아는 강한 생활력의 소유자입니다.",
            '乙亥': "드넓은 바다를 유랑하는 부평초처럼 좁은 틀에 갇히길 거부하고 넓은 세상을 누비며 지식과 경험을 흡수합니다. 환경 적응력과 부드러운 처세술이 탁월하지만, 한 곳에 뿌리내리고 마무리하는 지구력을 기르는 것이 핵심 과제입니다.",
            '丙子': "어두운 밤을 밝히는 태양처럼 겉은 원칙과 명분을 중시하는 반듯한 리더지만, 속으로는 화끈한 추진력과 차가운 이성이 공존하는 입체적인 성향입니다. 속내를 잘 드러내지 않는 절제력과 치밀한 판단력으로 조직에서 권위를 얻습니다.",
            '丁丑': "얼어붙은 땅을 녹이는 따뜻한 화로처럼 평소엔 조용하고 헌신적이지만, 목표가 생기면 무서운 집념과 집중력을 발휘합니다. 남들이 포기하는 궂은일도 끝까지 해내어 묵직한 재물과 신뢰를 쌓아 올리는 외유내강형입니다.",
            '戊寅': "호랑이를 품은 거대한 산맥처럼 타인의 간섭을 거부하는 강한 카리스마와 돌파력을 지녔습니다. 평범한 일상보다 크고 역동적인 무대에서 정면 돌파로 권한을 쟁취하는 승부사 기질이며, 독선만 경계하면 큰 리더가 됩니다.",
            '己卯': "봄 들판을 뛰어다니는 영리한 토끼처럼 겉은 순해 보이지만 속에는 강한 승부욕과 생존 본능이 자리 잡고 있습니다. 분위기 파악 레이더가 24시간 돌아가 어떤 환경에서도 빠르게 적응해 내 몫을 챙기는 처세의 달인입니다.",
            '庚辰': "승천을 앞둔 백룡처럼 위기를 피하기보다 정면 돌파해 승리를 쟁취하는 전사형 기질입니다. 맺고 끊음이 확실하고 스케일이 커서 남 밑에 오래 있기보다 큰 판을 주도하며 부와 권위를 함께 거머쥡니다.",
            '辛巳': "완벽하게 제련된 보석처럼 세련된 품격과 치밀한 계산력을 겸비했습니다. 겉으론 부드럽게 미소 지으면서도 속으론 손익을 정확히 따지며, 명예운과 엘리트 기질이 강해 깔끔하고 우아한 성공을 이룹니다.",
            '壬午': "호수 위 달빛처럼 재물 감각(정재)과 명예 감각(정관)이 균형을 이룬 길격 성향입니다. 영리한 눈치와 원만한 대인관계 능력 덕분에 큰 굴곡 없이 돈과 사람을 자연스럽게 끌어모으는 알짜배기 실속파입니다.",
            '癸未': "메마른 사막에 내리는 단비처럼 어떤 고난에도 끝까지 버텨내는 강인한 생존력과 타인을 돕는 따뜻한 마음을 품고 있습니다. 내면의 섬세한 고독을 전문성·예술·교육으로 승화시켜 깊은 존경과 명예를 얻습니다.",
            '甲申': "절벽 끝에 뿌리내린 소나무처럼 시련을 맞을수록 더 단단해지는 개척 정신의 소유자입니다. 권력과 명예를 향한 직진 본능이 강해 독불장군처럼 보일 수 있으나, 유연한 소통만 더하면 정상에 오릅니다.",
            '乙酉': "바위틈을 뚫고 자란 강인한 난초처럼 집요한 근성과 정밀한 기술 감각을 타고났습니다. 과정보다 확실한 결과로 실력을 증명하는 스페셜리스트형이며, 날카로운 완벽주의를 자기 발전에 쓸 때 큰 부를 얻습니다.",
            '丙戌': "서쪽 하늘을 물들이는 노을처럼 속에는 깊은 사색과 고독을 품고 겉으로는 호탕하게 베푸는 이중 매력이 돋보입니다. 사람을 꿰뚫어 보는 직관과 현란한 언변으로 대중의 인기와 재물을 함께 얻습니다.",
            '丁亥': "밤바다를 비추는 등대처럼 위기마다 귀인의 도움을 받는 천을귀인의 복이 깃든 명식입니다. 다정하고 고상한 성품 속에 치밀한 실속 계산도 갖추어 큰 파란 없이 품격 있고 안정된 삶을 누립니다.",
            '戊子': "태산 아래 맑은 지하수를 품은 듯 겉은 무뚝뚝해 보여도 속으론 1원 단위까지 정밀한 경제 관념이 돌아갑니다. 겉멋보다 내실을 중시해 남몰래 현금과 부동산을 차곡차곡 쌓아 올리는 진짜 알부자 기질입니다.",
            '己丑': "단단한 겨울 대지처럼 남의 말에 쉽게 흔들리지 않는 황소고집과 우주 최강의 인내심을 지녔습니다. 느려 보여도 절대 멈추지 않는 꾸준함으로 결국 거대한 기반과 자산을 완성하는 대기만성형입니다.",
            '庚寅': "초봄의 기운을 가르는 날카로운 도끼처럼 기회의 냄새를 동물적으로 포착하는 과감한 승부사입니다. 스케일이 크고 실행력이 빨라 답답한 틀을 벗어나 역동적인 시장에서 큰 성과를 거둡니다.",
            '辛卯': "자연을 정교하게 다듬는 명장의 도구처럼 미적 센스와 디테일 감각이 타의 추종을 불허합니다. 남들이 놓치는 틈새를 정확히 찾아내어 독보적인 기획력과 기술로 안정적인 수익을 창출합니다.",
            '壬辰': "번개를 머금은 흑룡처럼 시야와 야망이 광활해 평범한 울타리에 안주하기 어렵습니다. 위기 상황에서 오히려 침착하고 대범하게 판을 뒤집어 큰 권한과 부를 거머쥐는 혁명가형 리더입니다.",
            '癸巳': "만물을 적시는 이슬비처럼 재물과 명예의 균형이 뛰어나고 환경 적응력이 탁월합니다. 어떤 험한 무대에서도 부드럽게 스며들어 갈등 없이 알짜배기 실속을 챙기는 영리한 처세의 달인입니다.",
            '甲午': "한여름 타오르는 불꽃처럼 두뇌 회전이 비상하고 사람의 마음을 사로잡는 언변과 끼가 넘칩니다. 욱하는 성질과 감정 기복만 잘 다스리면 대중의 스포트라이트를 받으며 화려하게 성공합니다.",
            '乙未': "사막의 선인장처럼 부드러운 겉모습 속에 독한 생존 본능과 뛰어난 현실 감각을 숨기고 있습니다. 맨바닥에서도 기어이 자수성가해 내는 저력이 있으며, 베푸는 여유를 더하면 더욱 풍요로워집니다.",
            '丙申': "전 세계를 누비는 태양처럼 호기심과 활동성이 넘치고 다방면에 걸친 지식이 풍부합니다. 무역·영업·기획처럼 넓은 무대에서 빛나며, 벌려놓은 일을 끝까지 마무리하는 뒷심만 챙기면 크게 성공합니다.",
            '丁酉': "어둠 속에서 빛나는 보석처럼 정밀한 재무 감각과 깔끔한 완벽주의를 지녔습니다. 구차한 것을 싫어하고 우아하고 윤택한 삶을 지향하며, 타인을 향한 비판만 줄이면 평생 품격 있게 누립니다.",
            '戊戌': "광활한 태산처럼 남의 간섭을 싫어하는 강한 카리스마와 묵직한 책임감을 지녔습니다. 거친 경쟁 속에서 무리를 통솔해 권력을 쥐는 대장부 기질이며, 융통성을 키울수록 인덕이 커집니다.",
            '己亥': "비옥한 대지 아래 흐르는 지하수처럼 원만한 사교성 속에 치밀한 실속 계산을 숨긴 지략가입니다. 얼굴 붉히지 않고도 조용히 큰 부와 지위를 축적하며, 가끔은 솔직하게 속내를 열면 신뢰가 깊어집니다.",
            '庚子': "차가운 물에 씻긴 강철처럼 사물의 허점을 단번에 짚어내는 예리한 이성과 분석력을 지녔습니다. 특수 전문 분야에서 독보적 천재성을 발휘하며, 차가운 직설만 부드럽게 포장하면 최고의 대우를 받습니다.",
            '辛丑': "혹독한 압력을 견뎌낸 다이아몬드처럼 차분한 겉모습 속에 엄청난 뚝심과 인내심을 품고 있습니다. 묵묵히 실력을 갈고닦아 한 분야의 권위자로 우뚝 서며, 묵직한 부동산·문서 자산으로 보상받습니다.",
            '壬寅': "대지를 적시며 흐르는 강물처럼 왕성한 학구열과 청산유수 같은 언변, 넓은 스케일을 지녔습니다. 역동적인 무대를 누비며 식복과 재물을 끌어모으고, 오지랖으로 인한 누수만 막으면 크게 번창합니다.",
            '癸卯': "초원을 적시는 봄비처럼 윗사람과 귀인의 도움을 받는 인덕이 풍부합니다. 부드러운 처세와 빠른 눈치로 적을 만들지 않고 순탄하게 실속을 챙기며, 독립심을 키울수록 더 큰 성취를 이룹니다.",
            '甲辰': "따스한 대지에 뿌리내린 청룡처럼 강한 깡다구와 예리한 상업적 혜안을 겸비했습니다. 남 밑에 머무르기보다 스스로 판을 개척해 굵직한 사업과 권한을 쥐며, 겸손함을 더하면 진짜 리더가 됩니다.",
            '乙巳': "햇살 아래 화려하게 핀 꽃처럼 넘치는 끼와 빠른 눈치, 매력적인 화술로 무장했습니다. 역동적인 무대에서 대중의 시선을 끌어모아 수익으로 연결하며, 변덕만 다스리면 화려한 전성기를 누립니다.",
            '丙午': "한여름 태양처럼 압도적인 열정과 타협 없는 승부욕으로 앞만 보고 달리는 폭발적 기질입니다. 치열한 경쟁의 최전선에서 정상을 쟁취하는 힘이 크지만, 불같은 화를 조절해야 얻은 것을 지킵니다.",
            '丁未': "용광로 같은 열정을 숨긴 외유내강형으로, 겉은 다정하지만 속에는 남에게 지지 않으려는 악바리 근성이 살아 있습니다. 묵묵히 독보적인 전문 자격을 쌓아 자수성가하는 강인한 실력자입니다.",
            '戊申': "깊은 산속 거대한 금광처럼 행동은 신중하지만 두뇌 회전은 누구보다 빠르고 치밀합니다. 조용히 깊은 전문 기술을 갈고닦아 평생 마르지 않는 탄탄한 밥그릇과 부를 쌓아 올리는 장인형입니다.",
