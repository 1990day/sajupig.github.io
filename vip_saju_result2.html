<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>초정밀 VIP 사주 리포트</title>
  <script src="https://unpkg.com/lunar-javascript@1.7.7/lunar.js"></script>
  <link rel="icon" type="image/png" href="/favicon.png">

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg: #080808;
      --panel: #141414;
      --panel2: #1b1914;
      --gold: #d4af37;
      --gold2: #f7e5a3;
      --line: #3c3020;
      --text: #f1f1f1;
      --muted: #aaa;
      --danger: #ff6b6b;
      --soft: #f7e7b2;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 2.05;
      word-break: keep-all;
    }

    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 850px;
      min-height: 100vh;
      background: linear-gradient(180deg, #151515 0%, #101010 100%);
      padding: 34px 22px 60px;
      box-shadow: 0 0 60px rgba(0,0,0,0.85);
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 26px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 1.94rem;
      font-weight: 950;
      letter-spacing: -0.8px;
      line-height: 1.25;
    }

    .header-sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.98rem;
      font-weight: 650;
      line-height: 1.55;
    }

    .test-badge {
      display: inline-block;
      margin-top: 16px;
      padding: 7px 13px;
      border: 1px solid rgba(212,175,55,0.45);
      color: var(--gold2);
      background: rgba(212,175,55,0.08);
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 850;
    }

    #result-loading {
      text-align: center;
      padding: 92px 0;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 3px solid #252525;
      border-top: 3px solid var(--gold);
      border-radius: 50%;
      animation: spin 0.95s linear infinite;
      margin: 0 auto 22px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--gold);
      font-size: 1.17rem;
      font-weight: 950;
    }

    .loading-desc {
      margin-top: 12px;
      color: #bcbcbc;
      font-size: 0.94rem;
      line-height: 1.65;
    }

    .summary-card {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 17px;
      margin: 18px 0 46px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px dashed rgba(212,175,55,0.22);
      padding: 9px 0;
      font-size: 0.95rem;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-key {
      color: #aaa;
      font-weight: 780;
      flex: 0 0 120px;
    }

    .summary-value {
      color: var(--soft);
      font-weight: 900;
      text-align: right;
    }

    .report-section {
      margin-bottom: 90px;
      animation: fadeIn 0.55s ease both;
    }

    .section-title {
      color: var(--gold);
      font-size: 1.46rem;
      line-height: 1.35;
      font-weight: 950;
      letter-spacing: -0.5px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 13px;
      margin-bottom: 27px;
    }

    .section-title span {
      display: block;
      color: #922334;
      font-size: 0.82rem;
      letter-spacing: 0;
      font-weight: 950;
      margin-bottom: 3px;
    }

    .paragraph {
      margin: 0 0 34px;
      color: #e9e9e9;
      font-size: 1.08rem;
      font-weight: 430;
      letter-spacing: -0.36px;
      text-align: left;
    }

    .highlight {
      color: var(--soft);
      font-weight: 900;
      background: rgba(212,175,55,0.12);
      padding: 2px 6px;
      border-radius: 5px;
      box-shadow: inset 0 -8px 0 rgba(212,175,55,0.12);
    }

    .notice-box {
      border-left: 4px solid var(--gold);
      background: rgba(212,175,55,0.08);
      padding: 22px 19px;
      border-radius: 0 10px 10px 0;
      margin: 30px 0;
      color: #f4e8c1;
      font-size: 1.04rem;
      font-weight: 520;
    }

    .danger-alert {
      border-left: 4px solid var(--danger);
      background: rgba(255,104,104,0.08);
      padding: 22px 19px;
      border-radius: 0 10px 10px 0;
      margin: 30px 0;
      color: #ffd4d4;
      font-size: 1.04rem;
    }

    .danger-title {
      display: block;
      color: #ff8585;
      font-size: 1.06rem;
      font-weight: 950;
      margin-bottom: 9px;
    }

    .luck-graph-card {
      background: #131313;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 18px;
      margin: 0 0 38px;
    }

    .luck-graph-title {
      color: var(--soft);
      font-size: 1.13rem;
      font-weight: 950;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .luck-row {
      margin-bottom: 17px;
    }

    .luck-row:last-child {
      margin-bottom: 0;
    }

    .luck-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .luck-name {
      color: #f3f3f3;
      font-size: 0.96rem;
      font-weight: 900;
    }

    .luck-score {
      color: var(--gold2);
      font-size: 0.94rem;
      font-weight: 950;
    }

    .bar-track {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: #252525;
      border: 1px solid #373020;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #9b7a22 0%, #d4af37 52%, #f7e5a3 100%);
      min-width: 8%;
      transition: width 0.7s ease;
    }

    .luck-detail-card,
    .analysis-card {
      background: #151515;
      border: 1px solid #2f281a;
      border-radius: 14px;
      padding: 22px 18px;
      margin: 22px 0;
    }

    .luck-detail-title,
    .analysis-card-title {
      color: var(--gold);
      font-size: 1.16rem;
      font-weight: 950;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .luck-detail-score {
      display: inline-block;
      margin-left: 7px;
      color: #111;
      background: var(--gold);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.82rem;
      font-weight: 950;
      vertical-align: 1px;
    }

    .noble-card {
      background: #15130f;
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 16px;
      padding: 22px 18px;
      margin: 22px 0 34px;
    }

    .noble-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0 4px;
    }

    .noble-chip {
      border: 1px solid rgba(212,175,55,0.32);
      background: rgba(212,175,55,0.08);
      border-radius: 12px;
      padding: 14px 13px;
    }

    .noble-chip b {
      display: block;
      color: var(--gold2);
      font-size: 0.92rem;
      margin-bottom: 3px;
    }

    .noble-chip span {
      color: #e6e0cc;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 18px 0 28px;
    }

    .tag {
      border: 1px solid rgba(212,175,55,0.35);
      background: rgba(212,175,55,0.08);
      color: var(--gold2);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.9rem;
      font-weight: 850;
    }

    .go-home-btn {
      width: 100%;
      border: 1px solid var(--gold);
      background: #222;
      color: var(--gold);
      padding: 18px 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 950;
      cursor: pointer;
      margin-top: 12px;
    }

    .go-home-btn:hover {
      background: var(--gold);
      color: #111;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 540px) {
      .container {
        padding: 28px 14px 44px;
      }

      h1 {
        font-size: 1.56rem;
      }

      .summary-row {
        display: block;
      }

      .summary-value {
        display: block;
        text-align: left;
        margin-top: 3px;
      }

      .paragraph {
        font-size: 1.01rem;
      }

      .luck-detail-card,
      .analysis-card {
        padding: 20px 15px;
      }

      .noble-grid {
        grid-template-columns: 1fr;
      }
    }

    .luck-detail-card .paragraph {
      margin-bottom: 16px;
      line-height: 1.85;
    }

    .luck-detail-card .paragraph:last-child {
      margin-bottom: 0;
    }

  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>초정밀 VIP 사주 풀이</h1>
      <div class="header-sub">계절, 낮밤, 성향의 결, 살의 작용, 귀인, 장단점, 운 그래프까지 풀어낸 장문 리포트</div>
      <div class="test-badge">TEST MODE : 1990.10.07 진시 여성</div>
    </header>

    <main>

          삶의 흐름을 장문으로 풀어내고 있습니다.
        </div>
      </div>

      <div id="dynamic-fortune-content" style="display:none;"></div>

      <button id="go-home-btn" class="go-home-btn" style="display:none;" onclick="location.href='index.html'">
        다른 사주 다시 보기

  </div>

    function getInputData() {
      const timeLabel = sessionStorage.getItem('saju_time') || '진시';
      const fallbackHour = TIME_BRANCH_TO_HOUR[timeLabel] ?? 8;

      return {
        calendar: sessionStorage.getItem('saju_calendar') || 'solar',
        gender: sessionStorage.getItem('saju_gender') || 'F',
        year: parseInt(sessionStorage.getItem('saju_year') || '1990', 10),
        month: parseInt(sessionStorage.getItem('saju_month') || '10', 10),
        day: parseInt(sessionStorage.getItem('saju_day') || '7', 10),
        hour: parseInt(sessionStorage.getItem('saju_hour') || String(fallbackHour), 10),
        minute: parseInt(sessionStorage.getItem('saju_minute') || '0', 10),
        timeLabel
      };
    }

    function getTenGod(dayStem, targetStem) {
      const day = STEM_INFO[dayStem];
      const target = STEM_INFO[targetStem];
      if (!day || !target) return '';

      const sameElement = day.element === target.element;
      const dayGeneratesTarget = GENERATES[day.element] === target.element;
      const dayControlsTarget = CONTROLS[day.element] === target.element;
      const targetControlsDay = CONTROLS[target.element] === day.element;
      const targetGeneratesDay = GENERATES[target.element] === day.element;
      const samePolarity = day.yy === target.yy;

      if (sameElement) return samePolarity ? '비견' : '겁재';
      if (dayGeneratesTarget) return samePolarity ? '식신' : '상관';
      if (dayControlsTarget) return samePolarity ? '편재' : '정재';
      if (targetControlsDay) return samePolarity ? '편관' : '정관';
      if (targetGeneratesDay) return samePolarity ? '편인' : '정인';

      return '';
    }

    function getResourceElement(dayElement) {
      return Object.keys(GENERATES).find(el => GENERATES[el] === dayElement);
    }

    function getOfficerElement(dayElement) {
      return Object.keys(CONTROLS).find(el => CONTROLS[el] === dayElement);
    }

    function clamp(num, min, max) {
      return Math.max(min, Math.min(max, Math.round(num)));
    }

  function getPillars(input) {
  let pillars = null;
  let extra = {
    source: 'lunar-javascript',
    hideGan: {}
  };

  const isExactTest =
    TEST_MODE &&
    input.year === 1990 &&
    input.month === 10 &&
    input.day === 7 &&
    input.timeLabel === '진시';

  try {
    if (typeof Solar === 'undefined') {
      throw new Error('Solar 객체를 찾을 수 없습니다. lunar-javascript 로드 실패');
    }

    const solar = Solar.fromYmdHms(input.year, input.month, input.day, input.hour, input.minute, 0);
    const lunar = solar.getLunar();

    if (!lunar || typeof lunar.getEightChar !== 'function') {
      throw new Error('Lunar 객체에서 getEightChar 함수를 찾을 수 없습니다.');
    }

    const ec = lunar.getEightChar();

    if (ec && typeof ec.setSect === 'function') {
      ec.setSect(2);
    }

    if (
      !ec ||
      typeof ec.getYear !== 'function' ||
      typeof ec.getMonth !== 'function' ||
      typeof ec.getDay !== 'function' ||
      typeof ec.getTime !== 'function'
    ) {
      throw new Error('EightChar 객체가 정상적으로 생성되지 않았습니다.');
    }

    pillars = {
      year: ec.getYear(),
      month: ec.getMonth(),
      day: ec.getDay(),
      time: ec.getTime()
    };

    const invalidPillar =
      !pillars.year || !pillars.month || !pillars.day || !pillars.time ||
      pillars.year.length < 2 ||
      pillars.month.length < 2 ||
      pillars.day.length < 2 ||
      pillars.time.length < 2;

    if (invalidPillar) {
      throw new Error('사주 원국 값이 비어 있거나 형식이 올바르지 않습니다.');
    }

    extra.source = 'lunar-javascript';

  } catch (err) {
    console.error('사주 원국 계산 실패:', err);

    if (TEST_MODE && isExactTest) {
      pillars = { ...TEST_EXPECTED };
      extra.source = 'TEST_EXPECTED_FALLBACK_ONLY_IN_TEST_MODE';
    } else {
      throw new Error(
        '사주 계산 라이브러리 로드 또는 원국 계산에 실패했습니다. ' +
        '실제 배포 상태에서는 테스트 사주로 대체하지 않습니다. ' +
        String(err.message || err)
      );
    }
  }

  if (TEST_MODE && isExactTest) {
    pillars = { ...TEST_EXPECTED };
    extra.source = 'TEST_FIXED_1990_10_07_JINSI_FEMALE';
  }

  extra.hideGan = {
    year: HIDDEN_STEMS[pillars.year[1]] || [],
    month: HIDDEN_STEMS[pillars.month[1]] || [],
    day: HIDDEN_STEMS[pillars.day[1]] || [],
    time: HIDDEN_STEMS[pillars.time[1]] || []
  };

  console.log('사주 원국 계산 결과', pillars, extra.source);
  return { pillars, extra };
}

    function getBranchStructures(branches) {
      const result = [];

      BRANCH_STRUCTURE_RULES.forEach(([a,b,type,text]) => {
        if (branches.includes(a) && branches.includes(b)) {
          result.push({ pair: [a, b], type, text });
        }
      });

      return result;
    }

    function analyzeChart(pillars, input, extra) {
      const allGanZhi = [pillars.year, pillars.month, pillars.day, pillars.time];

      const yearStem = pillars.year[0];
      const monthStem = pillars.month[0];
      const dayStem = pillars.day[0];
      const timeStem = pillars.time[0];

      const yearBranch = pillars.year[1];
      const monthBranch = pillars.month[1];
      const dayBranch = pillars.day[1];
      const timeBranch = pillars.time[1];

      const elementWeighted = { '木':0, '火':0, '土':0, '金':0, '水':0 };
      const tenStemCount = {};
      const tenGroupCount = {
        '자기주도':0,
        '경쟁과 선별':0,
        '꾸준한 표현':0,
        '강한 표현':0,
        '안정적 현실감':0,
        '확장형 기회':0,
        '책임과 신뢰':0,
        '압박과 돌파':0,
        '공부와 보호':0,
        '통찰과 독자성':0
      };

      allGanZhi.join('').split('').forEach(char => {
        const info = STEM_INFO[char] || BRANCH_INFO[char];
        if (info && elementWeighted[info.element] !== undefined) {
          elementWeighted[info.element] += 1;
        }
      });

      ['year','month','day','time'].forEach(key => {
        const gz = pillars[key];
        const hidden = extra.hideGan[key] || HIDDEN_STEMS[gz[1]] || [];

        hidden.forEach((gan, idx) => {
          const weight = idx === 0 ? 0.7 : idx === 1 ? 0.35 : 0.2;
          const el = STEM_INFO[gan].element;
          elementWeighted[el] += weight;

          const ten = getTenGod(dayStem, gan);
          const group = TEN_GOD_GROUP[ten];
          if (ten) tenStemCount[ten] = (tenStemCount[ten] || 0) + weight;
          if (group) tenGroupCount[group] += weight;
        });
      });

      const tenByPosition = {
        early: getTenGod(dayStem, yearStem),
        social: getTenGod(dayStem, monthStem),
        later: getTenGod(dayStem, timeStem)
      };

      Object.values(tenByPosition).forEach(ten => {
        const group = TEN_GOD_GROUP[ten];
        if (ten) tenStemCount[ten] = (tenStemCount[ten] || 0) + 1;
        if (group) tenGroupCount[group] += 1;
      });

      const dayElement = STEM_INFO[dayStem].element;
      const resourceElement = getResourceElement(dayElement);
      const outputElement = GENERATES[dayElement];
      const wealthElement = CONTROLS[dayElement];
      const officerElement = getOfficerElement(dayElement);
      const seasonElement = BRANCH_INFO[monthBranch].element;

      let seasonBoost = 0;

      if (seasonElement === dayElement) seasonBoost += 1.6;
      if (seasonElement === resourceElement) seasonBoost += 1.15;
      if (seasonElement === officerElement) seasonBoost -= 1.25;
      if (seasonElement === outputElement) seasonBoost -= 0.55;
      if (seasonElement === wealthElement) seasonBoost -= 0.75;

      const supportScore =
        elementWeighted[dayElement] * 1.05 +
        elementWeighted[resourceElement] * 0.95 +
        seasonBoost;

      const pressureScore =
        elementWeighted[officerElement] * 1.05 +
        elementWeighted[wealthElement] * 0.78 +
        elementWeighted[outputElement] * 0.52;

      let strength = '균형형';
      let strengthText = `한쪽으로 완전히 치우친 구조라기보다, 환경과 선택에 따라 강점이 살아나거나 흐려지는 균형형에 가깝습니다. 좋은 판에 들어가면 빠르게 살아나지만, 맞지 않는 판에 오래 머물면 장점이 제대로 나오지 않습니다.`;

      if (supportScore - pressureScore >= 1.4) {
        strength = '자기 힘이 강한 편';
        strengthText = `스스로 버티고 밀고 가는 힘이 강한 편입니다. 주도권을 쥐면 능력이 살아나지만, 내 기준이 지나치게 강해지면 사람의 도움이나 돈이 들어오는 길을 스스로 좁힐 수 있습니다.`;
      } else if (pressureScore - supportScore >= 1.0) {
        strength = '주변 압박을 크게 느끼는 편';
        strengthText = `주변의 요구와 압박을 크게 느끼는 구조입니다. 혼자 모든 것을 감당하면 소진이 빠르기 때문에, 사람과 시스템이 중요합니다.`;
      }

      const sortedElements = Object.keys(elementWeighted).sort((a,b) => elementWeighted[b] - elementWeighted[a]);
      const strongestElement = sortedElements[0];
      const secondElement = sortedElements[1];
      const weakestElement = sortedElements[sortedElements.length - 1];

      const sortedTenGroups = Object.keys(tenGroupCount).sort((a,b) => tenGroupCount[b] - tenGroupCount[a]);
      const mainTenGroup = sortedTenGroups[0];
      const secondTenGroup = sortedTenGroups[1];

      const branches = [yearBranch, monthBranch, dayBranch, timeBranch];
      const stems = [yearStem, monthStem, dayStem, timeStem];
      const structures = getBranchStructures(branches);

      const seasonGroup = SEASON_GROUP_BY_BRANCH[monthBranch];
      const dayNightGroup = DAY_NIGHT_BY_BRANCH[timeBranch];

      return {
        yearStem,
        monthStem,
        dayStem,
        timeStem,
        yearBranch,
        monthBranch,
        dayBranch,
        timeBranch,
        branches,
        stems,
        dayElement,
        resourceElement,
        outputElement,
        wealthElement,
        officerElement,
        seasonElement,
        elementWeighted,
        tenStemCount,
        tenGroupCount,
        tenByPosition,
        sortedElements,
        strongestElement,
        secondElement,
        weakestElement,
        mainTenGroup,
        secondTenGroup,
        strength,
        strengthText,
        structures,
        seasonGroup,
        dayNightGroup,
        pillars
      };
    }

      const earlyStory = `${branchAgeText.early[a.yearBranch] || ''} ${groupAgeText.early[earlyGroup] || ''}`;
      const middleStory = `${branchAgeText.middle[a.monthBranch] || ''} ${groupAgeText.middle[socialGroup] || ''} ${elementAgeText[a.strongestElement] || ''}`;

      return `
        <section class="report-section">
          <div class="section-title"><span>CHAPTER 4</span>초년운·중년운·말년운</div>

    function vipCleanText(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    function vipParagraphs(items, groupSize = 3) {

        .map(vipCleanText)

      const paragraphs = [];

      for (let i = 0; i < cleanItems.length; i += groupSize) {
        paragraphs.push(cleanItems.slice(i, i + groupSize).join(' '));
      }

      return paragraphs
        .map(text => `<p class="paragraph">${text}</p>`)
        .join('');
    }

        '문창귀인': `머릿속에 떠오른 것을 말이나 글, 기획, 문서, 콘텐츠로 바꾸는 힘이 있습니다. 생각만 하고 있으면 묶이지만, 가다듬기해서 보여주면 그것이 일과 돈의 씨앗이 됩니다.`,

        '확장형 기회': `돈은 고정된 자리보다 사람과 기회가 오가는 곳에서 움직입니다. 제안, 거래, 소개, 확장성이 있는 일을 만나면 수입의 폭이 넓어질 수 있습니다.`,

        '압박과 돌파': `편한 일보다 어려운 일을 맡았을 때 실력이 드러나는 편입니다. 압박이 있으면 집중력이 살아나지만, 늘 긴장 속에서만 일하면 몸과 마음이 빨리 닳습니다.`,

        '丙': `일에서는 사람들에게 보이는 자리가 필요합니다. 홍보, 소개, 설명, 콘텐츠처럼 내가 가진 것을 밝게 꺼내야 흐름이 살아납니다.`,

      return [
        workStyleByStem[a.dayStem] || vipCleanText(stem.work),
        combinedMap[`${mainGroup}|${strong}`] || socialMap[mainGroup] || socialMap[socialGroup],
        elementMap[strong] ? elementMap[strong].strong : '',
        elementMap[weak] ? elementMap[weak].weak : '',
        vipMainShinsalTone(a)
      ];
    }

    function vipRelationshipStory(a, input) {
      const branch = BRANCH_NARRATIVE[a.dayBranch] || {};
      const laterBranch = BRANCH_NARRATIVE[a.timeBranch] || {};
      const earlyGroup = vipTenGroup(a.tenByPosition && a.tenByPosition.early);
      const socialGroup = vipTenGroup(a.tenByPosition && a.tenByPosition.social);
      const laterGroup = vipTenGroup(a.tenByPosition && a.tenByPosition.later);
      const gender = input.gender === 'F' ? 'F' : 'M';

      const branchLoveMap = {
        '子': `마음은 깊지만 쉽게 열리지는 않습니다. 상대가 다가온다고 바로 믿기보다, 시간이 지나도 태도가 안정적인지 오래 살핍니다. 말하지 않은 불안이 커지기 쉬워서 관계가 깊어질수록 혼자 결론 내리지 않는 것이 중요합니다.`,
        '丑': `사랑에서도 꾸준함을 봅니다. 화려한 표현보다 반복되는 행동, 약속을 지키는 태도, 생활 속 책임감에 마음이 갑니다. 한 번 실망하면 오래 남기 때문에 작은 약속도 가볍게 보지 않습니다.`,
        '寅': `붙잡히는 관계보다 믿고 놓아주는 관계에서 오래 갑니다. 상대가 통제하려 들면 빠르게 답답해지고, 자유를 존중받을 때 오히려 더 책임 있게 마음을 씁니다.`,
        '卯': `말투와 태도가 사랑의 온도를 결정합니다. 다정한 배려에는 깊게 움직이지만, 반복되는 무심함에는 조용히 마음을 거둘 수 있습니다.`,
        '辰': `마음이 끌려도 현실을 함께 봅니다. 당신이 내 삶을 안정시키는지, 함께 쌓이는 것이 있는지, 미래가 어지럽지 않은지를 자연스럽게 확인합니다.`,
        '巳': `끌림이 빠르게 올라오는 편입니다. 말이 통하고 반응이 살아 있으면 가까워지는 속도도 빠르지만, 순간의 열기가 안정감인지 착각하지 않는 것이 중요합니다.`,
        '午': `표현이 있어야 안정됩니다. 좋아한다면 말과 행동으로 느껴져야 마음이 놓이고, 애매한 태도가 반복되면 겉으로 밝아도 속으로 상처가 쌓입니다.`,
        '未': `따뜻함과 현실감이 같이 있어야 합니다. 말만 다정한 사람보다 실제로 책임을 나누고 생활을 맞춰가는 사람에게 깊어집니다.`,
        '申': `대화가 통하지 않으면 오래 버티기 어렵습니다. 감정은 있어도 문제를 함께 풀 수 있어야 마음이 안정되고, 답답한 관계에서는 인내심이 빨리 줄어듭니다.`,
        '酉': `예의와 약속이 사랑의 기준입니다. 무례함이나 허술함이 반복되면 감정이 있어도 마음이 식을 수 있고, 한 번 식으면 회복이 쉽지 않습니다.`,
        '戌': `신뢰가 가장 중요합니다. 한번 믿으면 오래 지키지만, 거짓말이나 반복된 실망이 생기면 다시 마음을 여는 데 시간이 오래 걸립니다.`,
        '亥': `마음이 통하는지가 중요합니다. 말하지 않아도 알아주는 느낌, 정서적으로 연결되어 있다는 느낌이 있어야 오래 머뭅니다.`
      };

      const tenLoveMap = {
        '자기주도': `관계 안에서도 내 공간과 결정권이 필요합니다. 사랑한다고 해서 모든 속도를 상대에게 맞추면 오래 버티기 어렵습니다.`,
        '경쟁과 선별': `사람을 넓게 만나도 결국 오래 남길 사람은 엄격하게 가립니다. 정이 있어도 내 몫을 계속 침범하는 사람은 피로해집니다.`,
        '꾸준한 표현': `사랑은 꾸준히 보여주는 방식이 잘 맞습니다. 큰 이벤트보다 반복되는 관심과 작은 행동이 마음을 깊게 만듭니다.`,
        '강한 표현': `감정이 올라오면 표현도 강해질 수 있습니다. 좋아하는 마음도, 서운한 마음도 빠르게 드러날 수 있어 말의 온도 조절이 필요합니다.`,
        '안정적 현실감': `관계에서는 생활 감각이 중요합니다. 돈, 약속, 일상의 리듬이 맞지 않으면 감정이 있어도 불안이 커집니다.`,
        '확장형 기회': `사람을 통해 새로운 세계가 열리는 관계에 끌립니다. 다만 설렘과 가능성만 보고 깊어지면 현실의 부담을 늦게 볼 수 있습니다.`,
        '책임과 신뢰': `가볍게 만나는 관계보다 책임이 보이는 관계에서 안정됩니다. 상대가 자기 삶을 제대로 꾸려가는지도 중요하게 봅니다.`,
        '압박과 돌파': `강한 사람에게 끌리거나 긴장감 있는 관계를 경험하기 쉽습니다. 다만 사랑이 늘 버티기와 증명이 되면 마음이 지칩니다.`,
        '공부와 보호': `이해받고 보호받는 느낌이 있어야 깊어집니다. 내 마음을 함부로 판단하지 않고 차분히 들어주는 사람에게 약합니다.`,
        '통찰과 독자성': `평범한 대화보다 깊은 생각을 나눌 수 있는 사람에게 끌립니다. 혼자만의 세계를 존중받아야 관계가 오래 갑니다.`,
        '균형형': `관계에서는 감정과 현실을 함께 봐야 오래 갑니다.`
      };

      const genderMap = {
        F: {
          '책임과 신뢰': `상대의 책임감과 태도를 많이 봅니다. 좋아한다는 말보다 삶을 어떻게 꾸리고 약속을 어떻게 지키는지가 더 크게 들어옵니다.`,
          '확장형 기회': `나를 더 넓은 세계로 데려가는 사람에게 끌릴 수 있습니다. 다만 설렘만 크고 책임이 약한 관계는 오래 갈수록 불안해집니다.`,
          '압박과 돌파': `강한 사람에게 마음이 움직일 수 있지만, 그 강함이 나를 누르는 방식이면 빨리 지칩니다.`
        },
        M: {
          '책임과 신뢰': `관계 안에서 책임지는 모습이 중요합니다. 좋아하는 마음이 커질수록 지켜야 한다는 부담도 같이 커질 수 있습니다.`,
          '확장형 기회': `관계가 삶의 기회를 넓히는 방향이면 마음이 살아납니다. 다만 여러 가능성을 동시에 보다가 한 사람에게 집중이 늦어질 수 있습니다.`,
          '압박과 돌파': `관계에서도 해결하려는 태도가 강해질 수 있습니다. 다만 상대의 감정을 문제처럼 다루면 거리가 생깁니다.`
        }
      };

      return [
        branchLoveMap[a.dayBranch] || vipCleanText(branch.relation),
        tenLoveMap[socialGroup] || tenLoveMap[earlyGroup],
        (genderMap[gender] && genderMap[gender][socialGroup]) || '',
        laterBranch.relation ? `${vipCleanText(laterBranch.relation)} 시간이 갈수록 관계의 기준은 더 선명해지고, 억지로 맞추는 관계보다 편안하게 오래 가는 관계를 고르게 됩니다.` : tenLoveMap[laterGroup],
        branch.risk ? `${vipCleanText(branch.risk)} 이것이 관계에서도 반복될 수 있으니, 마음이 완전히 식기 전에 작게 말하는 습관이 필요합니다.` : ''
      ];
    }

    function vipTransitionStory(a) {
      const structures = Array.isArray(a.structures) ? a.structures : [];
      const mainGroup = a.mainTenGroup || vipTenGroup(a.tenByPosition && a.tenByPosition.social);
      const weak = a.weakestElement;
      const strong = a.strongestElement;

      const noStructureMap = {
        '자기주도': `삶이 크게 뒤집히기보다, 내가 더는 납득하지 못하는 순간 조용히 방향을 바꾸는 식으로 전환이 옵니다. 오래 참다가 갑자기 그만두는 것처럼 보일 수 있지만, 실제로는 마음속 기준이 오래 쌓인 결과입니다.`,
        '경쟁과 선별': `전환은 사람 문제에서 시작되기 쉽습니다. 누구와 함께할지, 어디까지 나눌지, 내 몫이 침범되는지를 오래 보다가 어느 순간 선을 긋게 됩니다.`,
        '꾸준한 표현': `크게 흔들리는 사건보다 반복해서 쌓은 결과가 방향을 바꿉니다. 계속 만들어왔던 것이 반응을 얻으면 삶이 넓어지고, 반응이 없으면 새로운 방식을 찾게 됩니다.`,
        '강한 표현': `참다가 한 번에 터지는 방식보다, 표현하고 싶은 마음이 커질수록 전환이 생깁니다. 나를 드러낼 수 없는 자리에서는 오래 버티기 어렵습니다.`,
        '안정적 현실감': `전환은 현실의 계산에서 시작됩니다. 돈, 생활, 책임이 더 이상 맞지 않으면 마음도 함께 움직입니다.`,
        '확장형 기회': `새로운 제안과 사람을 통해 길이 바뀌기 쉽습니다. 한곳에만 머물다가도 더 넓은 가능성이 보이면 마음이 빠르게 이동합니다.`,
        '책임과 신뢰': `전환은 신뢰가 깨지는 순간 시작됩니다. 오래 참아도 책임과 약속이 무너지면 마음의 문이 닫히고 방향을 다시 잡습니다.`,
        '압박과 돌파': `압박이 커질수록 오히려 결단이 빨라집니다. 힘든 상황을 지나며 내가 얼마나 버틸 수 있는지 확인하고, 그 뒤에 삶의 기준을 바꾸게 됩니다.`,
        '공부와 보호': `전환은 배움과 깨달음에서 옵니다. 어떤 경험을 그냥 넘기지 않고 가다듬기하면서 다음 삶의 방향을 바꿉니다.`,
        '통찰과 독자성': `남들이 보기엔 조용해 보여도 안쪽에서는 이미 오래 전부터 다른 길을 보고 있습니다. 혼자 생각한 결론이 어느 순간 삶의 방향을 바꿉니다.`
      };

      const elementPressureMap = {
        '木': `방향이 흐려지면 삶이 멈춘 느낌을 받을 수 있습니다. 그래서 전환이 필요할 때는 큰 결심보다 작은 계획을 다시 세우는 것이 먼저입니다.`,
        '火': `보여줄 기회가 없으면 마음이 식을 수 있습니다. 전환은 사람들의 반응이 끊기거나 내가 사라지는 느낌이 들 때 시작되기 쉽습니다.`,
        '土': `기반이 흔들리면 불안이 커집니다. 돈, 생활 리듬, 책임의 경계가 무너지면 삶을 다시 가다듬기해야 한다는 신호가 옵니다.`,
        '金': `가다듬기가 늦어질수록 피로가 커집니다. 아닌 사람과 아닌 일을 오래 붙잡으면 어느 순간 단호하게 끊고 싶어집니다.`,
        '水': `생각할 시간과 회복이 부족하면 판단이 거칠어질 수 있습니다. 멈춰서 가다듬기할 시간이 없을 때 전환의 필요가 커집니다.`
      };

      const structureText = structures.length
        ? structures.slice(0, 3).map(s => {
            const easyMap = {
              '합': `한번 이어진 사람이나 일을 쉽게 놓지 않는 편입니다. 좋게 쓰면 꾸준함이 되고, 나쁘게 쓰면 끝내야 할 일도 오래 끌고 갈 수 있습니다.`,
              '충': `마음 한쪽은 앞으로 가고 싶은데, 다른 한쪽은 멈춰 서서 다시 생각하게 만듭니다. 그래서 선택 앞에서 갈등이 생기고, 어느 순간 방향을 크게 바꾸게 됩니다.`,
              '형': `겉으로는 괜찮은 척해도 속으로는 압박이 쌓이기 쉽습니다. 참는 시간이 길어지면 말이나 행동이 갑자기 단단해질 수 있습니다.`,
              '해': `대놓고 부딪히기보다 작은 서운함과 불편함이 천천히 쌓이기 쉽습니다. 처음에는 별일 아닌 것 같아도 반복되면 마음이 멀어질 수 있습니다.`
            };
            const easyText = easyMap[s.type] || `겉으로는 큰 문제가 없어 보여도 마음속에서는 불편함이 조금씩 쌓일 수 있습니다.`;
            return `${easyText} ${vipCleanText(s.text)} 그래서 당신은 비슷한 상황을 다시 만나면 예전처럼 그냥 넘기기보다, 이번에는 어디서 멈추고 어디서 가다듬기해야 하는지 더 빨리 알아차리는 쪽으로 바뀌어 갑니다.`;
          })
        : [noStructureMap[mainGroup] || `삶의 방향이 갑자기 바뀌는 것처럼 보여도, 실제로는 마음속 판단이 오래 쌓인 뒤에 움직이는 편입니다.`];

      return [
        ...structureText,
        elementPressureMap[weak] || '',
        strong === weak ? '' : `반대로 잘 살아나는 힘을 제대로 쓰면 전환은 불안이 아니라 새 길이 됩니다. 강한 흐름이 일을 밀어주고, 부족한 흐름을 생활에서 받쳐주면 같은 문제가 반복되어도 결과가 달라집니다.`
      ];
    }

    function vipLaterLifeStory(a) {
      const laterGroup = vipTenGroup(a.tenByPosition && a.tenByPosition.later);
      const laterBranch = BRANCH_NARRATIVE[a.timeBranch] || {};
      const strong = a.strongestElement;
      const weak = a.weakestElement;
      let luckSentence = '';

      try {
        if (typeof calcLuckScores === 'function') {
          const items = calcLuckScores(a, { gender: sessionStorage.getItem('saju_gender') || 'F' }).slice().sort((x, y) => y.score - x.score);
          if (items.length) {
            const top = items[0];
            const low = items[items.length - 1];
            const map = {
              '재물운': `돈의 흐름이 삶의 중심으로 커질수록, 단순히 많이 버는 것보다 남기는 구조가 중요해집니다.`,
              '직장운': `일의 자리와 역할이 삶의 방향을 크게 바꿀 수 있습니다. 어디에서 누구와 일하느냐가 중요합니다.`,
              '애정운': `관계의 안정감이 삶 전체의 컨디션을 크게 흔들 수 있습니다.`,
              '귀인운': `사람의 도움과 연결이 후반의 길을 여는 데 중요하게 작동합니다.`,
              '건강운': `몸의 리듬을 지키는 것이 운을 지키는 일과 연결됩니다.`,
              '명예운': `이름값과 평판이 쌓일수록 더 큰 기회를 받을 수 있습니다.`,
              '이동운': `움직임과 변화가 삶의 문을 여는 역할을 할 수 있습니다.`
            };
            luckSentence = `${map[top.label] || `${top.label} 쪽에서 힘이 비교적 잘 붙습니다.`} ${low.label} 쪽은 방치하면 에너지가 새기 쉬우니 습관으로 관리해야 합니다.`;
          }
        }
      } catch (e) {
        luckSentence = '';
      }

      const laterMap = {
        '자기주도': `앞으로의 삶에서는 남이 짜준 판보다 내가 고른 판이 중요해집니다. 나이가 들수록 누군가에게 맞추기보다 직접 결정하고 책임지는 삶을 원하게 됩니다.`,
        '경쟁과 선별': `앞으로는 사람을 많이 두는 것보다 제대로 남기는 것이 중요해집니다. 오래 갈 사람과 지나갈 사람을 구분하면서 삶의 피로가 줄어듭니다.`,
        '꾸준한 표현': `앞으로는 오래 만들어온 것이 삶을 지켜줍니다. 작은 기록, 결과물, 반복된 실력이 시간이 지나 이름값이 됩니다.`,

    function vipLuckTopLow(a) {
      try {
        if (typeof calcLuckScores !== 'function') return { top: null, low: null };
        const input = { gender: sessionStorage.getItem('saju_gender') || 'F' };
        const items = calcLuckScores(a, input).slice().sort((x, y) => y.score - x.score);
        return { top: items[0] || null, low: items[items.length - 1] || null };

    function vipHappinessByTenGroup(group) {
      const map = {

        '안정적 현실감': `행복은 생활이 안정될 때 깊어집니다. 돈이 어디로 들어오고 어디로 나가는지 보이고, 내가 감당할 수 있는 책임만 남았을 때 마음이 편해집니다.`,
        '확장형 기회': `행복은 새로운 제안과 사람을 통해 들어옵니다. 가만히 있을 때보다 움직이고 연결될 때 길이 열리지만, 좋은 기회와 피곤한 약속을 구분해야 합니다.`,
        '책임과 신뢰': `행복은 사람들이 믿고 맡겨줄 때 커집니다. 내가 한 말을 지키고, 끝까지 챙긴 일이 쌓이면 그 신뢰가 다음 기회가 됩니다.`,

        '통찰과 독자성': `행복은 남들과 똑같이 할 때보다 혼자 깊게 본 것을 세상에 꺼냈을 때 옵니다. 내가 이상하다고 느꼈던 관점이 오히려 재능이 될 수 있습니다.`,

    function vipHappinessByBranch(branch) {

      return text.replace(/조심해야 합니다\.?/g, '편해집니다.');

      return good.map(s => vipCleanText(s.text)).join(' ');

        '해': `작은 서운함과 불편함이 천천히 쌓일 수 있습니다. 별일 아닌 듯 넘긴 일이 반복되면 마음이 멀어질 수 있습니다.`
      };
      return structures.slice(0, 3).map(s => map[s.type] || `마음속에서 서로 다른 욕구가 함께 움직입니다. 그래서 같은 상황을 만나도 쉽게 단정하지 않고 다시 생각하게 됩니다.`).join(' ');

    function vipShinsalEasyText(a) {

    function buildChapter12Shinsal(a) {

    function calcNobleAnalysis(a, input) {
      const e = a.elementWeighted;
      const g = a.tenGroupCount;

      const harmony = getStructureBonus(a, '합');
      const clash = getStructureBonus(a, '충');
      const tension = getStructureBonus(a, '형') + getStructureBonus(a, '해');

      const olderScore =
        (g['공부와 보호'] || 0) * 8 +
        (g['책임과 신뢰'] || 0) * 7 +
        (e[a.resourceElement] || 0) * 5 +
        (e[a.officerElement] || 0) * 4 +
        (a.monthBranch === '酉' || a.monthBranch === '申' || a.monthBranch === '戌' ? 5 : 0);

      const peerScore =
        (g['자기주도'] || 0) * 7 +
        (g['경쟁과 선별'] || 0) * 7 +
        (e[a.dayElement] || 0) * 5 +
        harmony * 4 -
        tension * 2;

      const youngerScore =
        (g['꾸준한 표현'] || 0) * 7 +
        (g['강한 표현'] || 0) * 7 +
        (g['확장형 기회'] || 0) * 5 +
        (e[a.outputElement] || 0) * 5 +
        (a.timeBranch === '辰' || a.timeBranch === '巳' || a.timeBranch === '午' ? 4 : 0);

      const typeScores = [
        { key: 'older', label: '연상·선배·전문가형 귀인', score: Math.round(olderScore) },
        { key: 'peer', label: '동갑·동료·친구형 귀인', score: Math.round(peerScore) },
        { key: 'younger', label: '연하·후배·고객형 귀인', score: Math.round(youngerScore) }
      ].sort((x, y) => y.score - x.score);

      const workScore =
        (g['책임과 신뢰'] || 0) * 7 +
        (g['압박과 돌파'] || 0) * 5 +
        (e[a.officerElement] || 0) * 5 +
        harmony * 3;

      const moneyScore =
        (g['안정적 현실감'] || 0) * 6 +
        (g['확장형 기회'] || 0) * 7 +
        (e[a.wealthElement] || 0) * 6 +
        harmony * 2 -
        clash * 2;

      const loveScore =
        (input.gender === 'F' ? (e[a.officerElement] || 0) : (e[a.wealthElement] || 0)) * 6 +
        (g['책임과 신뢰'] || 0) * 4 +
        harmony * 5 -
        clash * 3;

      const studyScore =
        (g['공부와 보호'] || 0) * 8 +
        (g['통찰과 독자성'] || 0) * 6 +
        (e[a.resourceElement] || 0) * 6 +
        (a.dayNightGroup === 'night' || a.dayNightGroup === 'deepNight' ? 4 : 0);

      const crisisScore =
        (g['압박과 돌파'] || 0) * 7 +
        (g['책임과 신뢰'] || 0) * 4 +
        tension * 5 +
        clash * 4;

      const fieldScores = [
        { key: 'work', label: '일·직장 귀인', score: Math.round(workScore) },
        { key: 'money', label: '돈·기회 귀인', score: Math.round(moneyScore) },
        { key: 'love', label: '연애·관계 귀인', score: Math.round(loveScore) },
        { key: 'study', label: '공부·전문성 귀인', score: Math.round(studyScore) },
        { key: 'crisis', label: '위기 때 들어오는 귀인', score: Math.round(crisisScore) }
      ].sort((x, y) => y.score - x.score);

      const total =
        Math.round(
          45 +
          harmony * 7 -
          clash * 3 -
          tension * 2 +
          Math.min(e[a.resourceElement] || 0, 3) * 5 +
          Math.min(e[a.officerElement] || 0, 3) * 3 +
          Math.min(e[a.wealthElement] || 0, 3) * 3 +
          (g['공부와 보호'] || 0) * 3 +
          (g['책임과 신뢰'] || 0) * 2 +
          (g['확장형 기회'] || 0) * 2
        );

      const score = clamp(total, 32, 96);

      return {
        score,
        primaryType: typeScores[0],
        secondaryType: typeScores[1],
        weakestType: typeScores[2],
        primaryField: fieldScores[0],
        secondaryField: fieldScores[1],
        weakestField: fieldScores[fieldScores.length - 1],
        typeScores,
        fieldScores
      };
    }

    function getNobleExistText(noble) {
      if (noble.score >= 80) return `사람 도움은 분명히 들어오는 편입니다. 다만 아무나 오래 붙잡는다고 좋아지는 것이 아니라, 당신의 기준을 알아보고 실제로 길을 열어주는 사람을 골라야 합니다.`;
      if (noble.score >= 60) return `필요한 순간에 도움을 받을 수 있지만, 가만히 기다리기보다 먼저 움직였을 때 더 잘 열립니다. 작은 연결을 놓치지 않는 것이 중요합니다.`;
      return `귀인이 저절로 크게 들어오기보다 스스로 찾아가야 열리는 편입니다. 사람을 넓게 만나기보다 믿을 만한 연결을 천천히 쌓는 방식이 좋습니다.`;
    }

    function getNobleAgeTypeText(typeKey) {
      const map = {
        older: `위에서 끌어주는 사람, 경험이 많은 사람, 이미 자리를 잡은 사람이 도움이 되기 쉽습니다. 조언 하나가 방향을 바꾸거나, 좋은 기준을 알려주는 식으로 들어옵니다.`,
        peer: `비슷한 위치의 사람, 동료, 친구, 같이 성장하는 사람이 중요합니다. 서로 자극을 주고 정보를 나누면서 길이 열릴 수 있습니다.`,
        younger: `아래에서 올라오는 사람, 후배, 어린 감각을 가진 사람이 기회를 가져올 수 있습니다. 작게 보이는 제안이나 새로운 방식 안에 길이 있을 수 있습니다.`

    function getNobleFieldText(fieldKey) {
      const map = {
        work: `일과 역할 안에서 귀인이 들어옵니다. 당신의 능력을 알아보고 맡겨주는 사람, 평가해주는 사람, 다음 일을 연결해주는 사람이 중요합니다.`,
        money: `돈과 제안 안에서 귀인이 들어옵니다. 좋은 조건을 알려주거나, 수입이 될 수 있는 길을 보여주는 사람이 도움이 됩니다.`,
        love: `가까운 관계 안에서 귀인이 들어옵니다. 마음을 안정시키거나, 관계를 통해 삶의 기준을 다시 세우게 만드는 사람이 있습니다.`,
        study: `배움과 정보 안에서 귀인이 들어옵니다. 자료, 강의, 문서, 조언, 자격처럼 지식의 형태로 길이 열릴 수 있습니다.`,
        crisis: `평온할 때보다 힘든 순간에 귀인이 보일 수 있습니다. 어려울 때 남는 사람이 이후의 삶에서 중요한 기준이 됩니다.`
      };

    function getNobleCautionText(noble) {
      const byKey = {
        older: `조언을 귀하게 듣되, 내 삶을 대신 결정하게 두면 안 됩니다. 도움과 통제는 다릅니다.`,
        peer: `가깝다고 모두 같은 편은 아닙니다. 도움과 경쟁이 섞일 수 있으니 돈과 책임의 선을 흐리지 말아야 합니다.`,
        younger: `작게 보이는 사람을 가볍게 보면 기회를 늦게 잡을 수 있습니다. 아래에서 올라오는 신호도 잘 봐야 합니다.`

      return byKey[noble.primaryType.key] || `도움이 들어와도 내 기준이 없으면 오히려 흔들릴 수 있습니다. 사람을 고르는 기준을 분명히 해야 합니다.`;

      return { noble, pieces: [

        `${getNobleCautionText(noble)} ${vipElementEasyText(a.weakestElement, 'weakness')}`,

    function vipFinalNarrativeText(text) {
      return vipCleanText(text)
        .replace(/합니다\./g, '해요.')
        .replace(/있습니다\./g, '있어요.')
        .replace(/없습니다\./g, '없어요.')
        .replace(/됩니다\./g, '돼요.')
        .replace(/큽니다\./g, '커요.')
        .replace(/좋습니다\./g, '좋아요.')
        .replace(/중요합니다\./g, '중요해요.')
        .replace(/필요합니다\./g, '필요해요.')
        .replace(/가능성이 큽니다\./g, '가능성이 커요.')
        .replace(/편입니다\./g, '편이에요.')
        .replace(/사람입니다\./g, '사람이에요.')
        .replace(/쪽입니다\./g, '쪽이에요.')
        .replace(/자리입니다\./g, '자리예요.')
        .replace(/흐름입니다\./g, '흐름이에요.')
        .replace(/살아납니다\./g, '살아나요.')
        .replace(/다듬습니다\./g, '다듬어요.')
        .replace(/열립니다\./g, '열려요.')
        .replace(/봅니다\./g, '봐요.')
        .replace(/가깝습니다\./g, '가까워요.')
        .replace(/어렵습니다\./g, '어려워요.')
        .replace(/커집니다\./g, '커져요.')
        .replace(/받습니다\./g, '받아요.')
        .replace(/느낍니다\./g, '느껴요.')
        .replace(/만듭니다\./g, '만들어요.');
    }

    function vipFinalCleanParagraphs(items) {
      return items
        .map(vipFinalNarrativeText)
        .filter(Boolean)
        .map(text => `<p class="paragraph final-story-paragraph">${text}</p>`)
        .join('');

    function vipFinalTonePick(a, arr) {
      const raw = [
        a.yearBranch, a.monthBranch, a.dayBranch, a.timeBranch,
        a.strongestElement, a.weakestElement,
        a.mainTenGroup, a.secondTenGroup,
        a.strength
      ].join('|');
      const seed = raw.split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return arr[seed % arr.length];
    }

    function vipFinalStrengthMood(a) {
      const map = {

  const cleaned = (items || [])
    .flat()

  const chunks = [];
  for (let i = 0; i < cleaned.length; i += perParagraph) {
    chunks.push(cleaned.slice(i, i + perParagraph).join(' '));

  return chunks
    .filter(Boolean)
    .map(text => `<p class="paragraph">${text}</p>`)
    .join('');
}

function vipPillarIndex(pillar) {
  const list = [
    '甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉',
    '甲戌','乙亥','丙子','丁丑','戊寅','己卯','庚辰','辛巳','壬午','癸未',
    '甲申','乙酉','丙戌','丁亥','戊子','己丑','庚寅','辛卯','壬辰','癸巳',
    '甲午','乙未','丙申','丁酉','戊戌','己亥','庚子','辛丑','壬寅','癸卯',
    '甲辰','乙巳','丙午','丁未','戊申','己酉','庚戌','辛亥','壬子','癸丑',
    '甲寅','乙卯','丙辰','丁巳','戊午','己未','庚申','辛酉','壬戌','癸亥'

  const idx = list.indexOf(pillar);
  return idx < 0 ? 0 : idx;
}

function vipSixtyPillarStory(pillar, role, a) {
  if (!pillar || pillar.length < 2) return '';
  const stem = pillar[0];
  const branch = pillar[1];
  const idx = vipPillarIndex(pillar);
  const stemRole = role === 'past' ? 'past' : role === 'work' ? 'work' : role === 'love' ? 'love' : role === 'future' ? 'future' : 'self';
  const branchRole = role === 'past' ? 'past' : role === 'work' ? 'social' : role === 'love' ? 'love' : role === 'future' ? 'future' : 'social';
  const toneMap = {
    self: [
      `그래서 당신은 첫인상보다 속이 훨씬 복잡하고, 마음을 주기 전까지 꽤 오래 살피는 편이에요.`,
      `겉으로는 자연스럽게 넘어가는 것처럼 보여도, 안쪽에서는 이미 사람과 상황의 무게를 재고 있어요.`,
      `이런 바탕 때문에 당신은 쉽게 휩쓸리기보다, 마음속에서 충분히 납득돼야 오래 움직여요.`
    ],
    past: [
      `이 경험은 지금도 사람을 믿는 속도와 거리를 두는 방식에 남아 있어요.`,
      `그래서 어린 시절의 당신은 생각보다 일찍 어른스러운 얼굴을 배웠을 가능성이 커요.`,
      `그때 익힌 버릇은 지금도 힘든 순간에 먼저 참고 살피는 모습으로 다시 나올 수 있어요.`
    ],
    work: [
      `일에서는 이 감각이 돈으로 바뀔 수 있어요. 남들이 놓친 부분을 잡아내고, 반응을 보고 바꾸는 힘이 있기 때문이에요.`,
      `사회에서는 이 흐름이 당신의 일하는 태도로 드러나요. 빠르게 움직이되 아무 데나 마음을 쓰지는 않아요.`,
      `돈은 단순히 운으로만 붙지 않고, 당신이 반복해서 고쳐낸 결과와 사람들의 신뢰를 타고 들어와요.`
    ],
    love: [
      `그래서 관계에서도 한순간의 설렘보다 반복된 태도를 더 믿어요. 마음이 움직여도 끝까지 남는 사람은 오래 보고 고른 사람이에요.`,
      `사랑에서는 따뜻함만큼 안정감이 중요해요. 말이 좋아도 행동이 비면 마음이 오래 머물기 어려워요.`,
      `가까운 사람 앞에서는 예민한 눈이 더 살아나지만, 그만큼 진심이 느껴지면 깊게 기대는 힘도 커요.`
    ],
    future: [
      `앞으로는 이 흐름을 억지로 바꾸기보다, 당신이 덜 지치고 더 오래 갈 수 있는 방식으로 쓰는 게 중요해요.`,
      `나이가 들수록 남의 속도보다 당신에게 맞는 생활과 일의 방식이 더 중요해져요.`,
      `후반으로 갈수록 억지로 버틴 시간보다, 당신이 잘 쓰이는 자리에서 쌓은 시간이 큰 결과로 남아요.`
    ]
  };
  const tones = toneMap[role] || toneMap.self;
  const tone = tones[idx % tones.length];
  return `${vipStemStory(stem, stemRole)} ${vipBranchStory(branch, branchRole)} ${tone}`;
}

function vipStructureStory(a, role = 'plain') {
  if (!a.structures || !a.structures.length) {
    return `크게 한 번에 뒤집히는 흐름보다 작은 선택이 오래 쌓여 삶을 바꾸는 쪽이에요. 그래서 어떤 사람을 곁에 두는지, 어떤 일을 반복하는지가 생각보다 크게 작용해요.`;
  }

  const simple = a.structures.slice(0, 2).map(s => {
    const type = s.type || '';
    if (type === '충') return `마음 안에서 앞으로 밀고 가려는 쪽과 잠깐 멈춰 확인하려는 쪽이 같이 움직여요. 그래서 중요한 선택 앞에서는 확신과 걱정이 번갈아 올라올 수 있어요.`;
    if (type === '합') return `한 번 이어진 사람이나 일을 쉽게 놓지 않는 편이에요. 좋게 쓰면 꾸준함이 되고, 나쁘게 쓰면 끝내야 할 일까지 오래 붙들 수 있어요.`;
    if (type === '형') return `참고 넘긴 일이 마음속에 오래 남기 쉬워요. 작을 때 말하지 못한 불편함이 나중에 예민한 반응으로 나올 수 있어요.`;
    if (type === '해') return `겉으로는 괜찮다고 넘겨도 속으로는 어긋난 느낌을 오래 들고 갈 수 있어요. 불편한 마음은 작을 때 풀어야 커지지 않아요.`;
    return s.text || '';
  }).filter(Boolean);

  return simple.join(' ');
}

    </section>
  `;
}

function buildChapter10Happiness(a) {
  const luck = vipLuckList(a);
  const top = luck[0];
  const second = luck[1];
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 9</span>당신이 행복해지는 장면</div>
      ${vipDeepParagraphs([
        top ? `${top.label} 쪽이 살아날 때 당신은 마음이 가벼워져요. 억지로 맞추는 느낌보다, 내가 잘 쓰이는 자리라는 감각이 들어야 오래 행복해져요.` : `${vipStemStory(a.dayStem, 'self')}`,
        second ? `${second.label}도 함께 받쳐줄 때 삶이 안정돼요. 하나만 잘 풀리는 것보다 일과 사람, 돈과 몸의 균형이 맞을 때 만족감이 커져요.` : `${vipBranchStory(a.dayBranch, 'love')}`,
        `${vipBranchStory(a.dayBranch, 'love')} ${vipTenStoryByGroup(a.mainTenGroup, 'future')}`
      ], 1)}
    </section>
  `;
}

function buildChapter11Risk(a) {
  const luck = vipLuckList(a).slice().sort((x, y) => x.score - y.score);
  const low = luck[0];
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 10</span>조심하면 덜 힘들어지는 패턴</div>
      ${vipDeepParagraphs([
        low ? `${low.label} 쪽은 방치하면 피로가 쌓이기 쉬워요. 안 좋은 운이라는 뜻이 아니라, 여기에서 무리하면 다른 장점까지 같이 흐려진다는 뜻이에요.` : `${vipElementStory(a.weakestElement, 'weak')}`,
        `${vipElementStory(a.weakestElement, 'weak')} ${vipStructureStory(a)}`,
        `${vipBranchStory(a.dayBranch, 'love')} ${vipStemStory(a.dayStem, 'future')}`
      ], 1)}
    </section>
  `;
}

function buildChapter12Shinsal(a) {
  const found = vipTopShinsalsDeep(a, 12);
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 11</span>반복해서 드러나는 특별한 흐름</div>
      ${vipDeepParagraphs([
        `${vipShinsalStory(a)}`,
        `${vipSixtyPillarStory(a.pillars.day, 'self', a)} ${vipStructureStory(a)}`,
        `${vipElementStory(a.strongestElement, 'strong')} ${vipElementStory(a.weakestElement, 'weak')}`
      ], 1)}
      ${found.length ? `<div class="tag-list">${found.slice(0, 10).map(item => `<span class="tag">${item.name}</span>`).join('')}</div>` : ''}

}

function buildChapter13StrengthWeakness(a) {
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 12</span>잘 살아나는 점과 쉽게 지치는 점</div>
      ${vipDeepParagraphs([
        `${vipSixtyPillarStory(a.pillars.day, 'self', a)} ${vipElementStory(a.strongestElement, 'strong')}`,
        `${vipTenStoryByGroup(a.mainTenGroup, 'work')} ${vipShinsalStory(a)}`,
        `${vipElementStory(a.weakestElement, 'weak')} ${vipStructureStory(a)}`
      ], 1)}
    </section>
  `;
}

function buildChapter14Noble(a, input) {
  const shinsals = vipTopShinsalsDeep(a, 8);
  const nobleNames = shinsals.filter(x => ['천을귀인','천덕귀인','월덕귀인','태극귀인','복성귀인','암록','금여록'].includes(x.name)).map(x => x.name);
  const nobleText = nobleNames.length ? nobleNames.join(', ') : '직접 찾아야 열리는 도움';
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 13</span>당신에게 도움을 주는 사람</div>
      <div class="noble-card"><div class="noble-grid">
        <div class="noble-chip"><b>도움의 방식</b><span>${nobleText}</span></div>
        <div class="noble-chip"><b>잘 열리는 자리</b><span>${a.mainTenGroup || '생활 속 기회'}</span></div>
      </div></div>
      ${vipDeepParagraphs([
        `${vipNobleSimpleStory(a)}`,
        `${vipTenStoryByGroup(a.mainTenGroup, 'work')} ${vipBranchStory(a.monthBranch, 'social')}`,
        `${vipElementStory(a.weakestElement, 'weak')} 도움을 받는다고 약해지는 게 아니에요. 당신에게 맞는 사람을 곁에 두면 오히려 오래 버틸 수 있어요.`
      ], 1)}
    </section>
  `;
}

function getLuckDetailText(item, a, input) {
  const sorted = vipLuckList(a);
  const rank = sorted.findIndex(x => x.key === item.key) + 1;
  const rankText = rank > 0 && rank <= 2
    ? `이 운은 비교적 쉽게 살아나는 편이에요.`
    : rank >= sorted.length - 1
      ? `이 운은 의식적으로 챙겨야 안정돼요.`
      : `이 운은 환경에 따라 좋게도, 피곤하게도 드러날 수 있어요.`;

  const parts = [
    `${rankText} ${vipTenStoryByGroup(a.mainTenGroup, 'work')}`,
    `${vipElementStory(a.strongestElement, 'strong')} ${vipElementStory(a.weakestElement, 'weak')}`,
    `${vipStructureStory(a)}`
  ];

  return vipDeepParagraphs(parts, 1);
}

function buildLuckGraphAndDetail(a, input) {
  const luckItems = calcLuckScores(a, input);
  const sorted = luckItems.slice().sort((x, y) => y.score - x.score);
  const top = sorted[0];
  const low = sorted[sorted.length - 1];
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 14</span>7가지 핵심 운 그래프</div>
      ${vipDeepParagraphs([
        `${top ? `${top.label} 쪽은 당신에게 비교적 잘 살아나는 흐름이에요.` : ''} ${low ? `${low.label} 쪽은 생활 속에서 챙겨야 덜 흔들려요.` : ''}`,
        `${vipLuckStory(a)}`
      ], 1)}
      <div class="luck-graph-card"><div class="luck-graph-title">핵심 운세 밸런스</div>
        ${luckItems.map(item => `<div class="luck-row"><div class="luck-top"><div class="luck-name">${item.label}</div><div class="luck-score">${item.score}점</div></div><div class="bar-track"><div class="bar-fill" style="width:${item.score}%"></div></div></div>`).join('')}
      </div>
      ${luckItems.map(item => `<div class="luck-detail-card"><div class="luck-detail-title">${item.label}<span class="luck-detail-score">${item.score}점</span></div>${getLuckDetailText(item, a, input)}</div>`).join('')}
    </section>
  `;
}

function buildChapter16Final(a) {
  return `
    <section class="report-section">
      <div class="section-title"><span>CHAPTER 15</span>최종 장문 총평</div>
      ${vipDeepParagraphs([
        `${vipSixtyPillarStory(a.pillars.year, 'past', a)} ${vipSixtyPillarStory(a.pillars.day, 'self', a)}`,
        `${vipSixtyPillarStory(a.pillars.month, 'work', a)} ${vipTenStoryByGroup(a.mainTenGroup, 'work')} ${vipElementStory(a.strongestElement, 'strong')}`,
        `${vipSixtyPillarStory(a.pillars.day, 'love', a)} ${vipBranchStory(a.dayBranch, 'love')} ${vipShinsalStory(a)}`,
        `${vipSixtyPillarStory(a.pillars.time, 'future', a)} ${vipTenStoryByGroup(vipTenGroupSafe(a.tenByPosition && a.tenByPosition.later), 'future')} ${vipElementStory(a.weakestElement, 'weak')}`,
        `당신은 아무 자리에서나 똑같이 피는 사람이 아니에요. 맞는 사람, 맞는 일, 맞는 속도를 만나면 조용히 쌓아온 감각이 결과로 바뀌고, 반대로 맞지 않는 곳에 오래 있으면 장점이 예민함으로 바뀔 수 있어요. 그래서 앞으로의 핵심은 더 세게 버티는 게 아니라, 당신이 가진 눈과 마음이 제대로 쓰이는 판을 고르는 일이에요.`
      ], 1)}
    </section>
  `;
}


function executePremiumEngine() {
      try {
        const input = getInputData();
        const { pillars, extra } = getPillars(input);
        const a = analyzeChart(pillars, input, extra);

        let html = '';

        html += buildSummary(input, a);
        html += buildChapter1(a);
        html += buildChapter2(a);
        html += buildChapter3(a);
        html += buildChapter4(a);
        html += buildChapter5(a);
        html += buildChapter6(a, input);
        html += buildChapter8(a);
        html += buildChapter9(a);
        html += buildChapter10Happiness(a);
        html += buildChapter11Risk(a);
        html += buildChapter12Shinsal(a);
        html += buildChapter13StrengthWeakness(a);
        html += buildChapter14Noble(a, input);
        html += buildLuckGraphAndDetail(a, input);
        html += buildChapter16Final(a);

        return html;
      } catch (err) {
        console.error(err);
        return `
          <div class="danger-alert">
            <span class="danger-title">연산 오류</span>
            사주 계산 중 문제가 발생했습니다. lunar-javascript가 정상 로드되었는지,
            입력값이 숫자로 들어왔는지 확인해 주세요.
            <br><br>
            오류 내용: ${String(err.message || err)}
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const fortuneHtml = executePremiumEngine();
        document.getElementById('result-loading').style.display = 'none';
        document.getElementById('dynamic-fortune-content').innerHTML = fortuneHtml;
        document.getElementById('dynamic-fortune-content').style.display = 'block';
        document.getElementById('go-home-btn').style.display = 'block';
      }, 1200);
    });
  </script>
