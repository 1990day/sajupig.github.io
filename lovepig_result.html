<script>
    function openLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

    // ==========================================================
    // 🚨 [필수] 결제 우회 방지 및 전역 변수 안전 선언
    // ==========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get('paymentKey');
    const amount = urlParams.get('amount') || 770;
    const meYear = sessionStorage.getItem('me_year');
    const youYear = sessionStorage.getItem('you_year');
    const orderId = urlParams.get('orderId') || '현장결제';
    window.globalOrderId = orderId;
    window.globalPaymentKey = paymentKey;

    if (!paymentKey || paymentKey === '') {
        alert("정상적인 결제 내역이 확인되지 않았습니다! 결제 페이지로 이동합니다.");
        document.body.style.display = "none";
        window.location.replace("lovepig.html");
        throw new Error("결제 미확인 차단");
    } else if (!meYear || !youYear) {
        alert("사주 정보가 만료되었습니다. 결제 페이지에서 다시 입력해주세요!");
        document.body.style.display = "none";
        window.location.replace("lovepig.html");
        throw new Error("정보 만료 차단");
    }

    // ==========================================================
    // 1. 내부 사주 계산 데이터 (정밀 계산은 유지, 화면 출력은 100% 쉬운 말!)
    // ==========================================================
    const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const charData = {
        '甲': { hg:'갑', el:'木', yy:1, cls:'c-wood' }, '乙': { hg:'을', el:'木', yy:0, cls:'c-wood' },
        '丙': { hg:'병', el:'火', yy:1, cls:'c-fire' }, '丁': { hg:'정', el:'火', yy:0, cls:'c-fire' },
        '戊': { hg:'무', el:'土', yy:1, cls:'c-earth'}, '己': { hg:'기', el:'土', yy:0, cls:'c-earth'},
        '庚': { hg:'경', el:'金', yy:1, cls:'c-metal'}, '辛': { hg:'신', el:'金', yy:0, cls:'c-metal'},
        '壬': { hg:'임', el:'水', yy:1, cls:'c-water'}, '癸': { hg:'계', el:'水', yy:0, cls:'c-water'},
        '子': { hg:'자', el:'水', yy:0, cls:'c-water'}, '丑': { hg:'축', el:'土', yy:0, cls:'c-earth'},
        '寅': { hg:'인', el:'木', yy:1, cls:'c-wood' }, '卯': { hg:'묘', el:'木', yy:0, cls:'c-wood' },
        '辰': { hg:'진', el:'土', yy:1, cls:'c-earth'}, '巳': { hg:'사', el:'火', yy:1, cls:'c-fire' },
        '午': { hg:'오', el:'火', yy:0, cls:'c-fire' }, '未': { hg:'미', el:'土', yy:0, cls:'c-earth'},
        '申': { hg:'신', el:'金', yy:1, cls:'c-metal'}, '酉': { hg:'유', el:'金', yy:0, cls:'c-metal'},
        '戌': { hg:'술', el:'土', yy:1, cls:'c-earth'}, '亥': { hg:'해', el:'水', yy:1, cls:'c-water'}
    };
    const EL_EASY = { '木':'나무 기운', '火':'불 기운', '土':'흙 기운', '金':'쇠 기운', '水':'물 기운' };
    const EL_ICON = { '木':'🌳 나무', '火':'🔥 불', '土':'⛰️ 흙', '金':'🪙 쇠', '水':'💧 물' };
    const EL_CLS = { '木':'c-wood', '火':'c-fire', '土':'c-earth', '金':'c-metal', '水':'c-water' };

    const generateMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
    const overcomeMap = { '木':'土', '土':'水', '水':'火', '火':'金', '金':'木' };
    const TEN_TO_GROUP = {
        '비견':'비겁','겁재':'비겁','식신':'식상','상관':'식상',
        '편재':'재성','정재':'재성','편관':'관성','정관':'관성','편인':'인성','정인':'인성'
    };

    const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
    const UNSEONG_START = { '甲':11,'乙':6,'丙':2,'丁':9,'戊':2,'己':9,'庚':5,'辛':0,'壬':8,'癸':3 };

    function get12Unseong(dGan, zhi) {
        if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return '';
        const s = UNSEONG_START[dGan], z = BRANCHES.indexOf(zhi);
        return UNSEONG_NAMES[charData[dGan].yy === 1 ? (z - s + 12) % 12 : (s - z + 12) % 12];
    }

    function getTenGod10(dGan, targetChar) {
        if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
        const dm = charData[dGan], tg = charData[targetChar], same = (dm.yy === tg.yy);
        if (dm.el === tg.el) return same ? '비견' : '겁재';
        if (generateMap[dm.el] === tg.el) return same ? '식신' : '상관';
        if (overcomeMap[dm.el] === tg.el) return same ? '편재' : '정재';
        if (overcomeMap[tg.el] === dm.el) return same ? '편관' : '정관';
        if (generateMap[tg.el] === dm.el) return same ? '편인' : '정인';
        return null;
    }

    function getCharHtml(char) {
        if (!char || char === '?' || char === 'unknown') return "?";
        const d = charData[char];
        return d ? `<span class="${d.cls}">${char}</span>` : char;
    }

    // ==========================================================
    // 2. 60가지 연애 성격 완전체 + 숨은 연애 본능 12종 + 핵심 연애 마음 5종 (전부 쉬운 말!)
    // ==========================================================
    const iljuPersonality = {
        '甲子': "연애를 시작하면 겉으로는 침착하고 여유로운 어른처럼 행동하지만, 속으로는 상대의 말투·카톡 답장 속도·작은 표정 변화까지 꼼꼼히 살피는 섬세한 전략가입니다. 자존심이 강해 먼저 약한 모습이나 매달리는 티를 잘 내지 않지만, 한 번 내 사람이라고 마음먹으면 끝까지 지켜내고 책임지려는 의리가 누구보다 깊습니다. 속마음을 조금만 더 솔직하게 표현해 주면 상대방이 훨씬 큰 안도감을 느낍니다.",
        '乙丑': "연애를 하면 상대에게 조용히, 하지만 아주 깊이 마음을 쏟으며 웬만한 위기에도 묵묵히 곁을 지키는 끈기 있는 사랑꾼입니다. 쉽게 흔들리지 않고 오래가는 사랑을 하지만, 속으로는 '내가 이렇게까지 챙겨주는데 상대도 알아줬으면' 하는 마음이 쌓이기 쉽습니다. 서운한 점을 혼자 꾹 참다가 나중에 한 번에 터뜨리지 말고, 작은 불편함을 그때그때 다정하게 말로 푸는 게 핵심입니다.",
        '丙寅': "좋아하는 순간부터 마음을 숨기지 못하고 화끈하게 직진하는 열정파입니다. 기분이 좋을 땐 세상에서 가장 다정하고 밝은 연인이 되어 상대를 웃게 만들지만, 서운하거나 자존심이 상하면 욱해서 필터링 없는 직설을 내뱉고 10분 뒤에 후회하는 면이 있습니다. 뒤끝이 전혀 없고 사랑의 온도가 뜨거운 타입이니, 화가 날 때 3초만 숨을 고르면 드라마처럼 진하고 행복한 연애를 이어갑니다.",
        '丁卯': "상대의 목소리 톤, 카톡 이모티콘 하나만 바뀌어도 기분을 단번에 알아채는 예민하고 다정한 감성파입니다. 사랑받고 있다는 확신이 들 때는 누구보다 포근하고 사랑스러운 매력으로 상대를 무장해제시킵니다. 다만 작은 무관심에도 혼자 밤새 고민하며 상처받기 쉬우니, 속으로 추측하기보다 상대에게 솔직하게 물어보고 확인받는 습관이 연애를 훨씬 편하게 만듭니다.",
        '戊辰': "가볍게 스쳐 지나가는 썸보다 한 사람과 진득하고 안정적으로 오래가는 연애를 선호하는 듬직한 스타일입니다. 평소엔 웬만한 실수도 너그럽게 넘겨주는 큰 그릇이지만, 믿음을 깨는 거짓말이나 무례한 태도에는 단호하게 선을 긋습니다. 표현이 다소 투박해 보일 수는 있어도, 신뢰를 지키는 상대에게는 평생 흔들리지 않는 가장 든든한 버팀목이 되어줍니다.",
        '己巳': "부드러운 매력과 센스 있는 눈치로 데이트 분위기를 자연스럽게 편안하게 만드는 연애 능력자입니다. 갈등이 생겨도 큰소리 내며 정면으로 부딪히기보다, 부드러운 말과 유연한 태도로 관계를 원하는 방향으로 영리하게 이끌어 갑니다. 겉으로는 다 맞춰주는 것 같아도 속으로는 기준이 분명하니, 가끔은 진짜 속마음을 솔직히 보여줄 때 관계가 더 깊어집니다.",
        '庚午': "연인 사이라도 지켜야 할 예의와 선이 분명하며, 낯간지러운 밀당이나 빈말보다 진정성 있는 행동을 중시하는 깔끔한 타입입니다. 처음에는 무뚝뚝하고 차가워 보일 수 있지만, 한 번 마음을 열면 절대 배신하지 않고 상대가 힘들 때 가장 먼저 달려가는 강철 의리를 보여줍니다. 딱딱한 말투 속에 숨은 깊은 진심을 가끔 따뜻한 말로도 전해 주면 완벽합니다.",
        '辛未': "연애 상대를 고르는 눈이 높고 디테일한 매너를 꼼꼼히 따지지만, 한 번 기준을 통과해 마음을 열면 누구보다 깊고 진하게 빠지는 순정파입니다. 상대의 사소한 말실수나 서운한 행동을 마음속에 차곡차곡 기억해 두는 편이라, 오해가 쌓이기 전에 부드럽게 이야기하고 풀어내면 평생 우아하고 깊은 사랑을 누릴 수 있습니다.",
        '壬申': "재치 있는 입담과 뛰어난 적응력으로 어떤 성향의 사람과도 즐겁고 유쾌하게 어울리는 매력쟁이입니다. 연애하면서도 각자의 취미와 개인 시간을 존중받을 때 가장 빛나며, 숨 막히게 구속하거나 집착하는 분위기는 답답해합니다. 적당한 자유와 신선한 데이트를 함께 즐길 수 있는 쿨한 상대와 만나면 평생 친구처럼 설레는 연애를 합니다.",
        '癸酉': "상대의 진심과 빈말을 0.1초 만에 간파하는 예리한 눈썰미의 소유자입니다. 깔끔하고 세련된 매너와 품격 있는 대화를 좋아하며, 어설픈 변명이나 감정적 억지는 금방 정이 떨어집니다. 차가워 보일 수 있는 냉철함에 따뜻한 공감 한 스푼만 얹어주면, 누구보다 섬세하고 믿음직한 최고의 파트너가 됩니다.",
        '甲戌': "달콤한 빈말보다 현실적인 행동과 함께 그리는 미래 계획으로 사랑을 증명하는 듬직한 연인입니다. 책임감과 의리가 강해 연애를 시작하면 상대의 고민과 일상까지 진심으로 챙기려 애씁니다. 다만 완벽한 기준을 상대에게도 무의식중에 기대할 수 있으니, 가끔은 여유롭게 웃어넘기는 부드러움을 더하면 흔들리지 않는 사랑을 완성합니다.",
        '乙亥': "서로를 지치게 만드는 집착보다 각자의 세계를 존중하며 편안하게 기대는 연애를 추구합니다. 부드럽고 다정한 분위기 덕분에 주변에 인기가 많지만, 지나치게 간섭받거나 감정적으로 몰아붙이면 조용히 마음을 닫고 물러나곤 합니다. 편안한 거리와 믿음이 보장될 때 누구보다 깊고 따뜻한 진심을 열어 보입니다.",
        '丙子': "밖에서는 밝고 쿨한 인기쟁이처럼 보이지만, 사랑이 깊어질수록 속으로는 강한 애정 욕구와 은근한 질투심이 움직이는 반전 매력의 소유자입니다. 자존심 때문에 서운해도 티를 잘 안 내지만, 실제로는 상대의 일상을 세심하게 챙기며 특별한 존재로 인정받고 싶어 합니다. 쿨한 척하기보다 솔직하게 애정을 표현할 때 사랑이 2배로 커집니다.",
        '丁丑': "좋아하는 사람에게 정성을 아낌없이 쏟고 식사·건강·일상까지 살뜰하게 챙겨주는 따뜻한 헌신파입니다. 갈등을 피하려 혼자 양보하고 맞춰주다 서운함이 한계에 다다르면 갑자기 차갑게 돌아설 수 있으니, 연애 초반부터 내 감정과 원하는 바를 편안하게 말하는 연습이 오래가는 비결입니다.",
        '戊寅': "데이트 코스부터 관계의 방향까지 주도적으로 챙기고 상대를 든든하게 보호하려는 대장부 같은 리더십이 돋보입니다. 내 연인이 밖에서 힘든 일을 겪으면 앞장서서 지켜주는 화끈한 매력이 있지만, 챙겨주려는 마음이 간섭이나 통제로 느껴지지 않게 상대의 의견을 자주 물어보면 세상 가장 든든한 연인이 됩니다.",
        '己卯': "갈등이 커지기 전에 분위기를 부드럽게 녹이는 탁월한 연애 감각과 센스를 지녔습니다. 겉으로는 순하고 다 맞춰주는 것처럼 보이지만 속으로는 상황 판단이 매우 빨라, 관계의 균형을 영리하게 조율하는 매력이 있습니다. 상대의 눈치를 보느라 내 감정을 숨기지 말고 가끔은 솔직한 투정도 부려보세요.",
        '庚辰': "마음이 움직이면 눈치 보거나 밀당하지 않고 솔직하게 직진하는 화끈한 추진력의 소유자입니다. 연인 사이의 신뢰와 의리를 목숨처럼 여기며, 한 번 믿음이 쌓인 상대에게는 물불 가리지 않고 든든한 보호자가 되어줍니다. 말투가 다소 직설적일 때만 부드럽게 다듬으면 누구보다 믿음직한 평생의 짝이 됩니다.",
        '辛巳': "데이트의 분위기와 서로를 대하는 매너, 대화의 품격을 중시하는 세련된 로맨티스트입니다. 겉으로는 다정하고 우아해 보여도 속으로는 기준이 꽤 까다롭지만, 자신을 진심으로 존중하고 예쁘게 대우해 주는 상대에게는 한없이 너그럽고 다정한 연인이 됩니다.",
        '壬午': "사람을 자연스럽게 끌어당기는 화사한 매력과 유쾌한 에너지로 연애 분위기를 주도합니다. 깊은 감정 교감과 따뜻한 스킨십을 모두 중요하게 여기며, 지루하게 반복되는 일상보다 신선한 설렘과 웃음이 살아 있을 때 가장 뜨겁고 행복하게 사랑합니다.",
        '癸未': "상대의 아픔과 피로를 내 일처럼 함께 느끼고 보듬어 주는 따뜻한 감성과 깊은 애정을 지녔습니다. 겉으로는 괜찮은 척하거나 퉁명스러워 보여도 속으로는 '나를 정말 사랑한다'는 확실한 표현을 원하므로, 다정한 말 한마디와 세심한 챙김에 크게 감동하는 순정파입니다.",
        '甲申': "마음에 드는 상대를 얻기 위해 적극적으로 행동하고 표현하는 당당한 승부사형입니다. 연애의 주도권을 쥐고 시원시원하게 이끌려는 에너지가 강하므로, 내 속도에 맞추기보다 상대의 감정 템포를 조금만 세심하게 살펴주면 최고의 시너지를 내는 파트너가 됩니다.",
        '乙酉': "한 번 사랑에 빠지면 깊은 몰입과 끈끈한 애정을 보여주는 집중형 연애 스타일입니다. 현실 감각이 예리해 상대와의 미래를 냉정하게 살피는 편이며, 상대를 걱정해서 나오는 날카로운 조언만 따뜻한 응원으로 바꾸면 누구보다 든든하게 사랑을 지켜냅니다.",
        '丙戌': "밝고 호탕하게 아낌없이 베풀며 연인을 기분 좋게 만들어 주는 따뜻한 의리파입니다. 사람 보는 촉이 좋아 진심과 가식을 금방 알아채며, 믿음을 주는 상대에게는 평생 변치 않는 뜨거운 애정과 든든한 보호 본능을 아낌없이 보여줍니다.",
        '丁亥': "상대의 지친 마음을 따뜻하게 어루만져 주는 뛰어난 공감 능력과 영리한 상황 판단력을 함께 갖추었습니다. 갈등이 생겨도 감정적으로 망가지지 않고 우아하게 풀어내며, 상대가 자연스럽게 내 곁에 머물고 싶게 만드는 은은하고 깊은 매력이 있습니다.",
        '戊子': "겉으로는 무뚝뚝하고 오글거리는 애정 표현이 서툴지만, 머릿속으로는 상대와의 현실적인 미래와 안정을 진지하게 설계하는 진국 타입입니다. 화려한 이벤트보다 결정적 순간의 실질적인 도움과 변함없는 책임감으로 깊은 사랑을 증명합니다.",
        '己丑': "쉽게 식거나 포기하지 않고 묵묵히 상대의 곁을 지키는 강한 인내심과 의리의 소유자입니다. 변덕스러운 밀당보다 익숙하고 편안한 루틴 속에서 깊은 안정감을 느끼며, 한 번 정을 주면 끝까지 배신하지 않는 가장 믿음직한 연인입니다.",
        '庚寅': "빙빙 돌려 말하지 않고 좋은 건 좋다, 싫은 건 싫다고 시원하게 표현하는 솔직한 스타일입니다. 순간적으로 욱할 때는 있어도 뒤끝이 전혀 없으며, 상대의 약한 모습 앞에서는 마음이 사르르 녹아 끝까지 챙겨주는 따뜻한 보호 본능을 지녔습니다.",
        '辛卯': "감각적인 데이트 분위기, 깔끔한 스타일, 디테일한 매너를 중시하는 세련된 감성파입니다. 처음엔 눈높이가 까다로워 보이지만 취향과 결이 맞는 상대를 만나면 누구보다 로맨틱하고 다정하게 사랑을 가꿔 나갑니다.",
        '壬辰': "현재의 설렘뿐 아니라 서로의 성장과 큰 미래 그림까지 함께 바라보는 스케일 큰 연애관을 지녔습니다. 주도적으로 관계를 이끌며, 내가 원하는 사랑을 지키기 위해 과감하게 행동하는 추진력과 카리스마가 돋보입니다.",
        '癸巳': "부드러운 말솜씨와 센스로 어색한 공기도 금세 녹이고, 상대의 속마음을 정확히 읽어내는 연애 고수입니다. 따뜻한 감성과 현실적인 균형 감각을 동시에 갖추고 있어, 오래 만날수록 편안하면서도 묘하게 끌리는 매력적인 관계를 만듭니다.",
        '甲午': "존재감이 뚜렷하고 말솜씨가 좋아 어디서나 시선을 끄는 활기차고 열정적인 연인입니다. 감정 표현이 투명해 오해가 오래가지 않으며, 기분이 올라갈 때 나오는 직설만 살짝 조절하면 매일이 설레고 에너지 넘치는 화려한 연애를 즐깁니다.",
        '乙未': "겉으로는 부드럽고 상대를 잘 맞춰주는 순한 스타일 같지만, 속에는 한 번 잡은 인연을 끝까지 지켜내는 끈질긴 집념을 품고 있습니다. 깊은 사랑이 과도한 걱정이나 집착으로 흐르지 않게 여유만 두면 누구보다 오래가는 진한 사랑을 합니다.",
