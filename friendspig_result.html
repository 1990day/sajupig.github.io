<script>
    function openLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

    // ==========================================================
    // 🚨 [필수] 결제 우회 방지 및 전역 변수 안전 선언
    // ==========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get('paymentKey');
    const amount = urlParams.get('amount') || 770;
    const meYear = sessionStorage.getItem('me_year');
    const youYear = sessionStorage.getItem('you_year');
    const orderId = urlParams.get('orderId') || '현장결제';
    window.globalOrderId = orderId;
    window.globalPaymentKey = paymentKey;

    if (!paymentKey || paymentKey === '') {
        alert("정상적인 결제 내역이 확인되지 않았습니다! 결제 페이지로 이동합니다.");
        document.body.style.display = "none";
        window.location.replace("friendspig.html");
        throw new Error("결제 미확인 차단");
    } else if (!meYear || !youYear) {
        alert("사주 정보가 만료되었습니다. 결제 페이지에서 다시 입력해주세요!");
        document.body.style.display = "none";
        window.location.replace("friendspig.html");
        throw new Error("정보 만료 차단");

    // ==========================================================
    // 1. 기초 명리 데이터 (천간/지지 음양·오행·12운성)
    // ==========================================================
    const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const charData = {
        '甲': { hg:'갑', el:'木', yy:1, cls:'c-wood' }, '乙': { hg:'을', el:'木', yy:0, cls:'c-wood' },
        '丙': { hg:'병', el:'火', yy:1, cls:'c-fire' }, '丁': { hg:'정', el:'火', yy:0, cls:'c-fire' },
        '戊': { hg:'무', el:'土', yy:1, cls:'c-earth'}, '己': { hg:'기', el:'土', yy:0, cls:'c-earth'},
        '庚': { hg:'경', el:'金', yy:1, cls:'c-metal'}, '辛': { hg:'신', el:'金', yy:0, cls:'c-metal'},
        '壬': { hg:'임', el:'水', yy:1, cls:'c-water'}, '癸': { hg:'계', el:'水', yy:0, cls:'c-water'},
        '子': { hg:'자', el:'水', yy:0, cls:'c-water'}, '丑': { hg:'축', el:'土', yy:0, cls:'c-earth'},
        '寅': { hg:'인', el:'木', yy:1, cls:'c-wood' }, '卯': { hg:'묘', el:'木', yy:0, cls:'c-wood' },
        '辰': { hg:'진', el:'土', yy:1, cls:'c-earth'}, '巳': { hg:'사', el:'火', yy:1, cls:'c-fire' },
        '午': { hg:'오', el:'火', yy:0, cls:'c-fire' }, '未': { hg:'미', el:'土', yy:0, cls:'c-earth'},
        '申': { hg:'신', el:'金', yy:1, cls:'c-metal'}, '酉': { hg:'유', el:'金', yy:0, cls:'c-metal'},
        '戌': { hg:'술', el:'土', yy:1, cls:'c-earth'}, '亥': { hg:'해', el:'水', yy:1, cls:'c-water'}
    };

    const generateMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
    const overcomeMap = { '木':'土', '土':'水', '水':'火', '火':'金', '金':'木' };
    const TEN_TO_GROUP = {
        '비견':'비겁','겁재':'비겁','식신':'식상','상관':'식상',
        '편재':'재성','정재':'재성','편관':'관성','정관':'관성','편인':'인성','정인':'인성'
    };

    const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
    const UNSEONG_START = { '甲':11,'乙':6,'丙':2,'丁':9,'戊':2,'己':9,'庚':5,'辛':0,'壬':8,'癸':3 };

    function get12Unseong(dGan, zhi) {
        if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return '';
        const s = UNSEONG_START[dGan], z = BRANCHES.indexOf(zhi);
        return UNSEONG_NAMES[charData[dGan].yy === 1 ? (z - s + 12) % 12 : (s - z + 12) % 12];
    }

    function getTenGod10(dGan, targetChar) {
        if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
        const dm = charData[dGan], tg = charData[targetChar], same = (dm.yy === tg.yy);
        if (dm.el === tg.el) return same ? '비견' : '겁재';
        if (generateMap[dm.el] === tg.el) return same ? '식신' : '상관';
        if (overcomeMap[dm.el] === tg.el) return same ? '편재' : '정재';
        if (overcomeMap[tg.el] === dm.el) return same ? '편관' : '정관';
        if (generateMap[tg.el] === dm.el) return same ? '편인' : '정인';
        return null;
    }

    function getCharHtml(char) {
        if (!char || char === '?' || char === 'unknown') return "?";
        const d = charData[char];
        return d ? `<span class="${d.cls}">${char}</span>` : char;
    }

    // ==========================================================
    // 2. 60갑자 친구 팩폭 성격 완전체 (갑인순 10개 추가 + 오타/민감 표현 정비!)
    // ==========================================================
    const iljuPersonality = {
        '甲子': "겉으로는 침착하고 여유로운 어른처럼 굴지만 속에서는 친구의 말투와 연락 패턴까지 분석하는 치밀한 전략가입니다. 자존심이 강해 무시당하는 기색이 보이면 속으로 바로 손절 버튼을 누르지만, 한 번 내 사람이라 정하면 끝까지 챙기는 의리가 있습니다.",
        '乙丑': "모임에서 궂은일을 도맡아 하고 고민 상담도 진지하게 들어주는 헌신파입니다. 다만 내가 해준 만큼 고마워하지 않으면 속으로 억울함이 쌓여 뒤끝이 길어질 수 있으니, 가끔은 편하게 서운함을 말하는 게 좋습니다.",
        '丙寅': "친해지는 속도가 LTE급인 핵인싸 분위기 메이커입니다. 내 사람에게는 시간과 돈을 아끼지 않지만, 욱하는 마음에 팩폭을 날려 갑분싸를 만들었다가 금방 화해하는 화끈하고 재밌는 친구입니다.",
        '丁卯': "단톡방의 미세한 기류와 친구의 표정 변화를 0.1초 만에 읽어내는 예민한 공감 능력자입니다. 주변의 고민 상담가 역할을 도맡지만, 남 기분 맞추느라 혼자 상처받지 않도록 적당한 선이 필요합니다.",
        '戊辰': "얕은 인맥보다 소수의 찐친과 평생 가는 묵직한 의리파입니다. 입이 무거워 비밀 보장은 확실하지만, 내 베프가 다른 친구랑 더 친해 보이면 은근히 질투하는 귀여운 소유욕도 숨어 있습니다.",
        '己巳': "어느 무리에서도 적을 만들지 않는 처세술의 달인입니다. 순둥이처럼 웃고 있지만 속으로는 손익 계산이 정확해 호구 잡히는 일은 절대 없으며, 갈등 상황을 부드럽게 빠져나가는 스마트한 베프입니다.",
        '庚午': "선 넘는 농담이나 무리한 부탁을 싫어하는 깔끔한 원칙주의자입니다. 단답형 카톡으로 무뚝뚝해 보여도 친구가 진짜 위기에 처하면 군말 없이 달려와 지갑을 여는 츤데레의 정석입니다.",
        '辛未': "친구를 사귈 때 매너와 센스를 깐깐하게 보는 심사역입니다. 쉽게 곁을 주지 않지만 검증을 통과한 절친에게는 누구보다 세심하게 챙겨주며, 서운함을 쌓아두지 않고 푸는 게 관건입니다.",
        '壬申': "어떤 무리에 던져놔도 물 흐르듯 적응하는 친화력 만렙입니다. 발이 넓고 유쾌하지만 개인 시간과 자유를 매우 중시해, 시도 때도 없이 집착하는 스타일은 피곤해하는 쿨한 친구입니다.",
        '癸酉': "가식이나 허세를 엑스레이처럼 꿰뚫어 보는 직관력의 소유자입니다. 취향과 대화가 통하는 소수와 깊게 교류하며, 싸울 때 논리와 팩트로 승부하는 냉철하고 고상한 스타일입니다.",
        '甲戌': "의리와 책임감으로 뭉친 모임의 든든한 가장 같은 존재입니다. 친구가 힘들 땐 현실적인 해결책을 찾아주고 쓴소리도 마다하지 않는 진국이지만, 신뢰를 깨는 배신에는 단호하게 선을 긋습니다.",
        '乙亥': "무리 안에서 갈등이 생기면 중립을 지키는 평화주의자입니다. 가끔 혼자만의 동굴로 들어가 잠수를 타기도 하지만, 프라이버시를 존중하며 오래 만나기 가장 편안한 고양이 같은 친구입니다.",
        '丙子': "밖에서는 텐션 높은 핵인싸지만 찐친 관계에서는 은근한 소유욕과 질투가 발동합니다. 모임 분위기를 띄우고 여론을 이끄는 재능이 뛰어나며 내 사람을 각별히 아끼는 분위기 메이커입니다.",
        '丁丑': "친구의 고민을 내 일처럼 끌어안는 보살급 멘탈의 헌신파입니다. 서운함을 꾹꾹 참다가 한계치에 달하면 조용히 멀어질 수 있으니, 먼저 이기적으로 내 마음을 표현하는 연습이 필요합니다.",
        '戊寅': "여행 숙소 예약부터 동선까지 본인이 주도해야 직성이 풀리는 든든한 골목대장입니다. 내 친구가 무시당하면 대신 나서줄 의리파지만, 가끔 자기 방식만 고집하는 꼰대 모드만 줄이면 완벽합니다.",
        '己卯': "카멜레온 같은 눈치와 처세술로 어느 쪽에도 욕먹지 않고 스무스하게 어울립니다. 겉으론 다 맞춰주지만 속으론 관계의 득실을 냉정하게 판단해 실속을 챙기는 영리한 베프입니다.",
        '庚辰': "빙빙 돌려 말하지 않고 사이다 팩폭을 날리는 화끈한 직진파입니다. 뒤끝이 전혀 없어 시원하게 싸우고 금방 털어내며, 앞뒤가 똑같고 투명해 제일 믿고 의지할 수 있는 의리파입니다.",
        '辛巳': "같이 다니는 친구의 매너와 센스를 은근히 중요하게 보는 우아한 완벽주의자입니다. 쩨쩨하게 굴지 않고 깔끔하게 베풀며, 수준 맞는 친구와 품격 있는 우정을 오래 이어갑니다.",
        '壬午': "입담과 유머로 어색한 분위기도 5분 만에 녹여버리는 핵인싸입니다. 발이 넓고 새로운 재미를 좇아다니는 피터팬 기질이 있어, 진지하게 무거운 관계보다 유쾌한 티키타카를 즐깁니다.",
        '癸未': "친구의 고민을 새벽까지 들어주며 같이 울어주는 따뜻한 감성파입니다. 내가 챙겨준 만큼 특별한 존재로 인정받고 싶어 해 작은 서운함에도 흔들릴 수 있지만, 진심 하나만큼은 1등입니다.",
        '甲申': "게임이든 내기든 지고는 못 사는 승부사형 베프입니다. 추진력이 좋아 친구들을 이끌고 다니길 좋아하며, 오글거리는 표현은 못 해도 위기 땐 가장 먼저 뛰쳐나오는 행동파입니다.",
        '乙酉': "친구의 스타일과 생활 습관까지 챙겨주려는 깐깐한 완벽주의자입니다. 감정적 위로보다 차가운 팩트 폭격으로 정신을 번쩍 들게 해주며, 현실적 조언이 필요할 때 이만한 친구가 없습니다.",
        '丙戌': "호탕하게 지갑을 여는 무리의 큰형·큰언니 리더입니다. 촉이 발달해 거짓말을 귀신같이 알아채며, 내 사람에겐 한없이 퍼주지만 배신에는 불같이 돌아서는 뜨거운 의리파입니다.",
        '丁亥': "친구의 상처를 어루만져 주는 따뜻한 상담가이자 중재자입니다. 겉으론 온화하지만 속으론 냉철한 판단력을 갖춰, 부드러운 말로 상황을 원하는 방향으로 이끄는 똑똑한 베프입니다.",
        '戊子': "연락은 드문드문하고 리액션도 무뚝뚝하지만, 위기 순간 말없이 밥을 사주거나 실질적인 도움을 던져주는 츤데레 소나무입니다. 한 번 바운더리에 들어온 친구는 끝까지 지켜냅니다.",
        '己丑': "웬만한 진상도 묵묵히 참아주는 엄청난 인내심의 소유자입니다. 늘 가던 맛집과 익숙한 패턴을 좋아해 다소 보수적이지만, 평생 배신 걱정 없이 무덤까지 갈 수 있는 안전 자산 같은 베프입니다.",
        '庚寅': "뒤끝이 1도 없고 투명한 화끈한 성격입니다. 불만이 생기면 그 자리에서 시원하게 털어놓고 10분 뒤에 밥 먹으러 가자고 하는 쿨함이 매력이며, 약한 친구 앞에서는 지갑이 열리는 의리파입니다.",
        '辛卯': "핫플레이스와 트렌드를 기가 막히게 찾아내는 감각파 베프입니다. 기준이 까다롭고 가끔 가시 돋친 말을 툭 던지기도 하지만, 취향만 맞으면 같이 놀 때 인생샷을 건져주는 센스쟁이입니다.",
        '壬辰': "모임을 이끌고 스케일 크게 노는 야망캐 골목대장입니다. 쪼잔하지 않고 배포가 커서 같이 있으면 든든하지만, 내가 무조건 중심이어야 하는 승부욕만 조금 내려놓으면 최고의 리더입니다.",
        '癸巳': "험악한 분위기도 웃음 한 번으로 녹여버리는 인간 소화기입니다. 다정하고 눈치가 빨라 인기가 많지만, 속으로는 손해 보지 않는 계산이 정확해 절대 호락호락하지 않은 실속파입니다.",
        '甲午': "입만 열면 빵빵 터뜨리는 엄청난 존재감과 텐션의 소유자입니다. 지루한 걸 못 참고 욱하는 순간만 조심하면, 같이 있을 때 단 1분도 심심할 틈이 없는 비글 같은 매력의 친구입니다.",
        '乙未': "겉으론 '네 맘대로 해~'라며 다 맞춰주는 순한 양 같지만, 속으론 끈질긴 집념과 강한 소유욕을 품은 외유내강형입니다. 한 번 정을 주면 오래 가지만 서운한 기억도 오래 남는 편입니다.",
        '丙申': "무거운 분위기보다 새롭고 유쾌한 자극을 좇는 자유로운 재간둥이입니다. 센스 넘치는 파티원으로 최고지만, 깊은 책임감이나 진지한 고민 상담을 기대하기보다 즐겁게 놀 때 빛나는 피터팬 콤플렉스형입니다.",
        '丁酉': "분위기 좋은 카페와 깔끔한 매너를 중시하는 까탈스러운 미식가 베프입니다. 눈치가 빨라 가식을 0.1초 만에 간파하지만, 기준에 맞는 찐친에게는 아낌없이 베푸는 우아한 스타일입니다.",
        '戊戌': "타협 없는 고집과 뚜렷한 주관을 지닌 카리스마형입니다. 사생활 침해를 극도로 싫어해 선을 지켜야 하지만, 한 번 내 식구로 인정한 친구는 무슨 일이 있어도 지켜내는 묵직한 의리파입니다.",
        '己亥': "겉으론 순둥순둥해 보이지만 속으론 상황 판단이 초고속으로 돌아가는 영리한 실리주의자입니다. 대놓고 싸우지 않고 분위기를 부드럽게 조율하며, 실속을 알뜰하게 챙기는 똑똑한 베프입니다.",
        '庚子': "모순과 헛소리를 단번에 잡아내는 냉철한 팩트 폭격기입니다. 따뜻한 위로보다 정확한 해결책을 던져주어 가끔 차갑게 느껴지지만, 객관적인 조언이 필요할 때 이만한 알파고가 없습니다.",
        '辛丑': "속이 문드러져도 표정 변화 없이 참아내는 극강의 포커페이스입니다. 고집과 인내심이 엄청나서 쉽게 연을 끊지 않지만, 한계치를 넘기면 단호하게 돌아서는 조용한 화산 같은 친구입니다.",
        '壬寅': "호기심과 오지랖이 태평양 같아 주변 고민을 다 들어주는 홍반장 기질입니다. 발이 넓고 자유로워 연락이 뜸할 때도 있지만, 만나면 언제 그랬냐는 듯 유쾌한 수다를 떠는 바람 같은 베프입니다.",
        '癸卯': "친구의 기분을 1초 만에 스캔해 맞춤형 배려를 해주는 다정한 센스쟁이입니다. 갈등을 피하려 먼저 양보하는 편이라, 가끔은 결정 장애를 내려놓고 내 의견을 당당히 말할 때 더 멋집니다.",
        '甲辰': "명령이나 간섭을 싫어하고 모임의 주도권을 쥐어야 직성이 풀리는 반항아 리더입니다. 싸울 땐 자존심 때문에 먼저 안 굽히지만, 친구가 곤경에 처하면 앞뒤 안 가리고 돕는 폼생폼사 의리파입니다.",
        '乙巳': "숨만 쉬어도 시선을 끄는 입담과 센스로 무리를 휘어잡는 인싸입니다. 감정 기복이 다소 커서 예민할 때만 조심하면, 가려운 곳을 기막히게 긁어주는 매력 넘치는 분위기 메이커입니다.",
        '丙午': "어딜 가나 스포트라이트를 독차지하는 화끈한 주인공형입니다. 마음에 안 들면 그 자리에서 시원하게 팩폭을 날리지만 다음 날이면 쿨하게 잊어버리는 뒤끝 제로의 골목대장입니다.",
        '丁未': "겉으론 천사표 배려남·배려녀지만 속에는 단단한 고집과 묵직한 기억력을 품고 있습니다. 서운함을 오래 담아두지 않고 그때그때 부드럽게 풀면 평생 든든한 외유내강형 베프입니다.",
        '戊申': "평소엔 무뚝뚝하고 감성이 메마른 현실주의자처럼 보이지만, 말뿐인 우정 대신 결정적 위기에 실질적 도움을 툭 던져주는 묵직한 상남자·상여자식 의리의 표본입니다.",
        '己酉': "조용히 웃으면서도 친구들의 성향과 장단점을 정확히 파악하는 예리한 관찰자입니다. 더치페이와 선이 깔끔해 호구 잡히지 않으며, 같은 편에 서면 가장 든든하고 똑똑한 참모가 됩니다.",
        '庚戌': "내 편과 남의 편이 확실한 화끈한 원칙주의자입니다. 배신에는 영구 제명으로 대응하지만, 믿음을 지키는 친구에게는 무슨 일이 있어도 편들어주는 진국 중의 진국입니다.",
        '辛亥': "세련된 취향과 깔끔한 매너를 중시하는 품격 있는 완벽주의자입니다. 구질구질한 상황을 싫어하고 상호 존중을 중요시하며, 센스 있게 보답할 줄 아는 친구와 오래가는 우정을 나눕니다.",
        '壬子': "사람 좋은 미소 뒤에 깊은 생각과 강한 자존심을 숨긴 매력적인 전략가입니다. 사생활을 존중해 주면 한없이 여유롭고 든든하지만, 선을 넘거나 비밀을 캐물으면 차갑게 돌아섭니다.",
        '癸丑': "겉으론 다 양보하고 맞춰주는 듯하지만 실제로는 관계의 흐름을 묵직하게 쥐고 가는 전략가입니다. 끈질긴 인내심으로 오래 곁을 지키며, 의심보다 신뢰를 쌓을 때 가장 깊은 우정이 됩니다.",
        // ▼▼▼ 누락되었던 갑인순(甲寅旬) 10개 일주 친구 성격 완벽 추가! ▼▼▼
        '甲寅': "독립심과 자존심이 최상위권인 마이웨이 대장부 친구입니다. 남이 시키는 대로 따라다니는 건 질색이라 약속과 모임을 본인이 주도하려 들며, 싸워도 절대 먼저 안 굽히지만 내 사람 의리 하나만큼은 1등입니다.",
        '乙卯': "겉으론 싹싹하고 부드러운 인싸지만 속에는 지독한 승부욕과 바위 같은 고집을 숨기고 있습니다. 친구 사이에서도 은근히 지기 싫어하고 내 베프를 독점하고 싶어 하는 귀여운 소유욕이 강합니다.",
        '丙辰': "호탕하고 배포가 커서 밥값이나 술값을 시원하게 쏘는 모임의 큰손입니다. 입담이 좋아 분위기 띄우는 데 천재적이지만, 가끔 허세 섞인 과장이나 오지랖으로 웃음을 유발하는 정 많은 친구입니다.",
