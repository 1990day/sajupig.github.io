<script>
    function openLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

    // ==========================================================
    // 🚨 [필수] 결제 우회 방지 및 전역 변수 안전 선언
    // ==========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get('paymentKey');
    const amount = urlParams.get('amount') || 770;
    const meYear = sessionStorage.getItem('me_year');
    const youYear = sessionStorage.getItem('you_year');
    const orderId = urlParams.get('orderId') || '현장결제';
    window.globalOrderId = orderId;
    window.globalPaymentKey = paymentKey;

    if (!paymentKey || paymentKey === '') {
        alert("정상적인 결제 내역이 확인되지 않았습니다! 결제 페이지로 이동합니다.");
        document.body.style.display = "none";
        window.location.replace("friendspig.html");
        throw new Error("결제 미확인 차단");
    } else if (!meYear || !youYear) {
        alert("사주 정보가 만료되었습니다. 결제 페이지에서 다시 입력해주세요!");
        document.body.style.display = "none";
        window.location.replace("friendspig.html");
        throw new Error("정보 만료 차단");
    }

    // ==========================================================
    // 1. 내부 사주 계산 데이터 (정밀 계산은 유지, 화면 출력은 100% 쉬운 말!)
    // ==========================================================
    const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const charData = {
        '甲': { hg:'갑', el:'木', yy:1, cls:'c-wood' }, '乙': { hg:'을', el:'木', yy:0, cls:'c-wood' },
        '丙': { hg:'병', el:'火', yy:1, cls:'c-fire' }, '丁': { hg:'정', el:'火', yy:0, cls:'c-fire' },
        '戊': { hg:'무', el:'土', yy:1, cls:'c-earth'}, '己': { hg:'기', el:'土', yy:0, cls:'c-earth'},
        '庚': { hg:'경', el:'金', yy:1, cls:'c-metal'}, '辛': { hg:'신', el:'金', yy:0, cls:'c-metal'},
        '壬': { hg:'임', el:'水', yy:1, cls:'c-water'}, '癸': { hg:'계', el:'水', yy:0, cls:'c-water'},
        '子': { hg:'자', el:'水', yy:0, cls:'c-water'}, '丑': { hg:'축', el:'土', yy:0, cls:'c-earth'},
        '寅': { hg:'인', el:'木', yy:1, cls:'c-wood' }, '卯': { hg:'묘', el:'木', yy:0, cls:'c-wood' },
        '辰': { hg:'진', el:'土', yy:1, cls:'c-earth'}, '巳': { hg:'사', el:'火', yy:1, cls:'c-fire' },
        '午': { hg:'오', el:'火', yy:0, cls:'c-fire' }, '未': { hg:'미', el:'土', yy:0, cls:'c-earth'},
        '申': { hg:'신', el:'金', yy:1, cls:'c-metal'}, '酉': { hg:'유', el:'金', yy:0, cls:'c-metal'},
        '戌': { hg:'술', el:'土', yy:1, cls:'c-earth'}, '亥': { hg:'해', el:'水', yy:1, cls:'c-water'}
    };
    const EL_EASY = { '木':'나무 기운', '火':'불 기운', '土':'흙 기운', '金':'쇠 기운', '水':'물 기운' };
    const EL_ICON = { '木':'🌳 나무', '火':'🔥 불', '土':'⛰️ 흙', '金':'🪙 쇠', '水':'💧 물' };
    const EL_CLS = { '木':'c-wood', '火':'c-fire', '土':'c-earth', '金':'c-metal', '水':'c-water' };

    const generateMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
    const overcomeMap = { '木':'土', '土':'水', '水':'火', '火':'金', '金':'木' };
    const TEN_TO_GROUP = {
        '비견':'비겁','겁재':'비겁','식신':'식상','상관':'식상',
        '편재':'재성','정재':'재성','편관':'관성','정관':'관성','편인':'인성','정인':'인성'
    };

    const UNSEONG_NAMES = ['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
    const UNSEONG_START = { '甲':11,'乙':6,'丙':2,'丁':9,'戊':2,'己':9,'庚':5,'辛':0,'壬':8,'癸':3 };

    function get12Unseong(dGan, zhi) {
        if (!zhi || zhi === '?' || !charData[dGan] || !BRANCHES.includes(zhi)) return '';
        const s = UNSEONG_START[dGan], z = BRANCHES.indexOf(zhi);
        return UNSEONG_NAMES[charData[dGan].yy === 1 ? (z - s + 12) % 12 : (s - z + 12) % 12];
    }

    function getTenGod10(dGan, targetChar) {
        if (!targetChar || targetChar === '?' || !charData[dGan] || !charData[targetChar]) return null;
        const dm = charData[dGan], tg = charData[targetChar], same = (dm.yy === tg.yy);
        if (dm.el === tg.el) return same ? '비견' : '겁재';
        if (generateMap[dm.el] === tg.el) return same ? '식신' : '상관';
        if (overcomeMap[dm.el] === tg.el) return same ? '편재' : '정재';
        if (overcomeMap[tg.el] === dm.el) return same ? '편관' : '정관';
        if (generateMap[tg.el] === dm.el) return same ? '편인' : '정인';
        return null;
    }

    function getCharHtml(char) {
        if (!char || char === '?' || char === 'unknown') return "?";
        const d = charData[char];
        return d ? `<span class="${d.cls}">${char}</span>` : char;
    }

    // ==========================================================
    // 2. 60가지 친구 성격 완전체 + 숨은 우정 본능 12종 + 핵심 우정 마음 5종 (전부 쉬운 말!)
    // ==========================================================
    const iljuPersonality = {
        '甲子': "겉으로는 침착하고 여유로운 어른처럼 굴지만, 속으로는 친구의 말투와 연락 패턴, 사소한 표정 변화까지 다 분석하는 치밀한 전략가입니다. 자존심이 강해 무시당하는 기색이 보이면 속으로 조용히 손절 버튼을 누르지만, 한 번 내 사람이라고 정하면 끝까지 챙기고 지켜주는 의리가 깊습니다. 가끔은 완벽한 척을 내려놓고 편하게 속마음을 털어놓을 때 우정이 훨씬 진해집니다.",
        '乙丑': "모임에서 남들이 귀찮아하는 궂은일을 도맡아 하고, 친구의 고민 상담도 진지하게 들어주는 든든한 헌신파입니다. 다만 내가 이렇게까지 챙겨주는데 상대가 당연하게 여기면 속으로 억울함이 쌓여 뒤끝이 길어질 수 있습니다. 착한 친구 노릇을 혼자 다 하려 애쓰지 말고, 서운할 땐 편하게 말로 푸는 습관이 오래가는 비결입니다.",
        '丙寅': "처음 본 사람과도 5분 만에 베프가 되는 친화력 만렙 분위기 메이커입니다. 내 사람에게는 시간과 돈을 아끼지 않고 화끈하게 쏘지만, 욱하는 마음에 필터링 없는 직설을 날려 분위기를 싸하게 만들었다가 10분 만에 금방 화해하는 화끈한 친구입니다. 뒤끝이 전혀 없어 같이 있으면 늘 활기차고 재미있습니다.",
        '丁卯': "단톡방의 미묘한 공기 변화와 친구의 기분을 0.1초 만에 읽어내는 예민한 공감 능력자입니다. 주변 친구들의 비밀 상담가 역할을 도맡으며 따뜻하게 위로해 주지만, 남 기분 맞추느라 정작 자기 에너지를 다 써버리기 쉽습니다. 모두를 다 챙기려다 지치지 않게 적당한 선을 지키는 것이 중요합니다.",
        '戊辰': "얕고 넓은 인맥보다 소수의 찐친과 평생 가는 묵직한 의리파입니다. 입이 무거워 친구의 흑역사와 비밀을 무덤까지 지켜주는 믿음직함이 최고지만, 내 베프가 다른 친구랑 더 친해 보이면 은근히 질투하는 귀여운 소유욕도 숨어 있습니다. 한 번 맺은 인연은 끝까지 책임지는 든든한 기둥 같은 친구입니다.",
        '己巳': "어느 무리에 들어가도 적을 만들지 않고 자연스럽게 어울리는 처세술의 달인입니다. 순둥이처럼 웃고 있지만 머릿속으로는 상황 파악과 손익 계산이 정확해 절대 호구 잡히는 일이 없습니다. 갈등 상황도 부드럽게 빠져나가는 스마트한 베프이며, 가끔 솔직한 속내를 보여주면 친구들이 더 깊이 신뢰합니다.",
        '庚午': "친한 사이라도 선 넘는 농담이나 무리한 부탁을 싫어하는 깔끔한 원칙주의자입니다. 단톡방에서는 무뚝뚝한 단답형이라 정 없어 보일 때도 있지만, 친구가 진짜 위기에 처하면 군말 없이 가장 먼저 달려와 지갑을 열고 해결해 주는 츤데레 의리의 정석입니다.",
        '辛未': "친구를 사귈 때 매너, 말투, 센스를 깐깐하게 살피는 예리한 심사역입니다. 아무에게나 쉽게 곁을 주지 않지만, 한 번 기준을 통과한 절친에게는 누구보다 세심하게 챙겨주는 따뜻한 반전 매력이 있습니다. 사소한 서운함을 속으로 오래 쌓아두지 않고 부드럽게 풀어내는 게 우정의 핵심입니다.",
        '壬申': "어떤 무리에 던져놔도 물 흐르듯 적응하고 분위기를 살리는 친화력 만렙 자유인입니다. 발이 넓고 유쾌하지만 개인 시간과 자유를 매우 소중히 여겨, 시도 때도 없이 연락을 재촉하거나 집착하는 스타일은 피곤해합니다. 쿨하게 각자의 삶을 존중해 줄 때 평생 즐거운 베프가 됩니다.",
        '癸酉': "가식이나 허세를 엑스레이처럼 꿰뚫어 보는 예리한 눈썰미의 소유자입니다. 시끄러운 단체 모임보다 취향과 대화가 통하는 소수와 깊게 어울리는 걸 좋아하며, 친구가 흔들릴 때 차가운 현실 조언으로 정신을 번쩍 들게 해주는 냉철하고 품격 있는 브레인입니다.",
        '甲戌': "의리와 책임감으로 뭉친 모임의 든든한 큰형·큰언니 같은 존재입니다. 친구가 힘들 땐 현실적인 해결책을 찾아주고 필요하면 쓴소리도 마다하지 않는 진국입니다. 다만 신뢰를 깨는 거짓말이나 배신에는 단호하게 선을 긋는 분명한 기준을 갖고 있습니다.",
        '乙亥': "무리 안에서 갈등이 생기면 어느 편에도 서지 않고 중립을 지키는 온화한 평화주의자입니다. 가끔 혼자만의 시간이 필요해 조용히 연락이 뜸해질 때도 있지만, 사생활을 존중해 주면 오래 만나기 가장 편안하고 다정한 고양이 같은 친구입니다.",
        '丙子': "밖에서는 텐션 높은 인기쟁이처럼 보이지만, 진짜 친한 친구 사이에서는 은근한 질투심과 소유욕이 발동하는 반전 매력의 소유자입니다. 모임 분위기를 띄우고 사람들을 모으는 재능이 뛰어나며, 내 사람을 각별히 아끼고 챙기는 분위기 메이커입니다.",
        '丁丑': "친구의 고민과 슬픔을 내 일처럼 끌어안고 함께 걱정해 주는 보살급 헌신파입니다. 거절을 잘 못해 손해를 보면서도 웃어넘기다 한계치에 달하면 조용히 멀어질 수 있으니, 친구 사이에서도 내 시간과 감정을 당당히 챙기는 연습이 필요합니다.",
        '戊寅': "여행 숙소 예약부터 맛집 동선까지 본인이 직접 주도해야 직성이 풀리는 든든한 골목대장입니다. 내 친구가 밖에서 무시당하면 대신 나서서 싸워줄 만큼 의리가 뜨겁지만, 가끔 자기 방식만 고집하는 잔소리 모드만 줄이면 완벽한 모임 리더입니다.",
        '己卯': "뛰어난 눈치와 부드러운 처세술로 어느 쪽에도 욕먹지 않고 스무스하게 어울립니다. 겉으로는 다 맞춰주는 순한 친구처럼 보이지만 속으로는 관계의 균형을 영리하게 계산해 실속을 챙기는 똑똑한 베프입니다. 갈등을 중재하는 능력이 특히 뛰어납니다.",
        '庚辰': "빙빙 돌려 말하거나 눈치 게임하는 걸 질색해 사이다 직언을 날리는 화끈한 직진파입니다. 뒤끝이 전혀 없어 시원하게 싸우고 10분 만에 웃으며 털어내며, 앞뒤가 똑같고 투명해서 위기 때 가장 믿고 의지할 수 있는 강철 의리파입니다.",
        '辛巳': "같이 다니는 친구의 매너와 센스를 은근히 중요하게 보는 세련된 완벽주의자입니다. 쩨쩨하게 굴지 않고 깔끔하게 베풀며, 대화 수준과 취향이 통하는 찐친과 품격 있고 우아한 우정을 오래 이어갑니다.",
        '壬午': "유쾌한 입담과 센스로 어색한 술자리도 5분 만에 웃음바다로 만들어 버리는 매력쟁이입니다. 발이 넓고 새로운 재미를 좇아다니는 자유로운 기질이 있어, 진지하고 무거운 관계보다 유쾌한 티키타카와 즐거운 놀이를 함께할 때 최고의 호흡을 냅니다.",
        '癸未': "친구의 고민을 새벽까지 들어주며 같이 울어주는 따뜻한 감성파입니다. 내가 마음을 쏟은 만큼 친구에게도 특별한 존재로 인정받고 싶어 해 작은 서운함에도 흔들릴 수 있지만, 친구를 아끼는 진심 하나만큼은 누구에게도 지지 않는 1등입니다.",
        '甲申': "게임이든 내기든 지고는 못 사는 화끈한 승부사형 베프입니다. 추진력이 좋아 친구들을 이끌고 여행이나 모임을 기획하길 좋아하며, 오글거리는 말은 못 해도 친구가 곤경에 처하면 가장 먼저 뛰쳐나오는 행동파입니다.",
        '乙酉': "친구의 스타일, 연애, 생활 습관까지 완벽하게 챙겨주려는 깐깐한 조언가입니다. 따뜻한 위로보다 차가운 현실 조언으로 정신을 번쩍 들게 해주어 가끔 서운할 때도 있지만, 진짜 현실적인 해결책이 필요할 때 이만한 친구가 없습니다.",
        '丙戌': "호탕하게 지갑을 열고 모임을 챙기는 든든한 큰형·큰언니 리더입니다. 사람 보는 촉이 발달해 거짓말을 귀신같이 알아채며, 내 사람에게는 아낌없이 퍼주지만 신뢰를 깨는 배신에는 불같이 돌아서는 뜨거운 의리파입니다.",
        '丁亥': "친구의 상처를 따뜻하게 어루만져 주는 다정한 상담가이자 갈등 중재자입니다. 겉으로는 온화하고 순해 보이지만 속으로는 냉철한 상황 판단력을 갖추고 있어, 부드러운 말 한마디로 모임의 흐름을 영리하게 이끕니다.",
        '戊子': "연락은 드문드문하고 리액션도 무뚝뚝하지만, 친구가 진짜 힘든 순간에 말없이 밥을 사주거나 실질적인 도움을 툭 던져주는 츤데레 소나무입니다. 한 번 내 바운더리에 들어온 친구는 평생 끝까지 지켜내는 진국입니다.",
        '己丑': "웬만한 투정이나 실수도 묵묵히 참아주는 엄청난 인내심의 소유자입니다. 늘 가던 단골집과 익숙한 패턴을 좋아해 다소 보수적으로 보일 때도 있지만, 평생 배신 걱정 없이 무덤까지 함께 갈 수 있는 안전 자산 같은 베프입니다.",
        '庚寅': "뒤끝이 1도 없고 투명한 화끈한 성격입니다. 불만이 생기면 그 자리에서 시원하게 털어놓고 10분 뒤에 '배고픈데 밥 먹으러 가자'고 하는 쿨함이 매력이며, 약한 친구나 힘든 친구 앞에서는 지갑이 활짝 열리는 의리파입니다.",
        '辛卯': "핫플레이스와 트렌드를 기가 막히게 찾아내는 감각파 베프입니다. 기준이 까다롭고 가끔 가시 돋친 말을 툭 던지기도 하지만, 취향만 맞으면 같이 놀 때 인생샷과 최고의 맛집을 건져주는 센스 만점 친구입니다.",
        '壬辰': "모임을 이끌고 스케일 크게 노는 카리스마 골목대장입니다. 쪼잔하지 않고 배포가 커서 같이 있으면 늘 든든하지만, 내가 무조건 중심이어야 하는 승부욕만 조금 내려놓으면 모두가 따르는 최고의 리더 친구입니다.",
        '癸巳': "살얼음판 같은 분위기도 유쾌한 농담과 웃음 한 번으로 녹여버리는 분위기 해결사입니다. 다정하고 눈치가 빨라 주변에 인기가 많지만, 속으로는 손해 보지 않는 계산이 정확해 절대 호락호락하지 않은 영리한 실속파입니다.",
        '甲午': "입만 열면 빵빵 터뜨리는 엄청난 존재감과 텐션의 소유자입니다. 지루한 걸 못 참고 욱하는 순간만 조심하면, 같이 있을 때 단 1분도 심심할 틈이 없는 에너지 넘치고 솔직한 매력의 친구입니다.",
        '乙未': "겉으로는 '네 맘대로 해~'라며 다 맞춰주는 순한 양 같지만, 속으로는 끈질긴 집념과 강한 소유욕을 품은 외유내강형입니다. 한 번 정을 주면 아주 오래 가지만, 서운한 기억도 오래 남는 편이니 그때그때 풀어주는 게 좋습니다.",
        '丙申': "무거운 분위기보다 새롭고 유쾌한 자극을 좇는 자유로운 재간둥이입니다. 센스 넘치는 파티원으로 최고지만, 무거운 책임감이나 진지한 고민 상담을 강요하기보다 즐겁고 가볍게 놀 때 가장 빛나는 유쾌한 친구입니다.",
        '丁酉': "분위기 좋은 카페와 깔끔한 매너를 중시하는 까탈스러운 미식가 베프입니다. 눈치가 빨라 가식을 0.1초 만에 알아채지만, 기준에 맞는 찐친에게는 아낌없이 베풀고 세심하게 챙겨주는 우아한 스타일입니다.",
        '戊戌': "타협 없는 신념과 뚜렷한 주관을 지닌 묵직한 카리스마형입니다. 사생활 침해를 극도로 싫어해 지켜야 할 선이 분명하지만, 한 번 내 식구로 인정한 친구는 무슨 일이 있어도 지켜내는 바위 같은 의리파입니다.",
        '己亥': "겉으로는 순둥순둥해 보이지만 속으로는 상황 판단이 초고속으로 돌아가는 영리한 실리주의자입니다. 대놓고 싸우지 않고 분위기를 부드럽게 조율하며, 모임에서도 알짜배기 실속을 챙기는 똑똑한 베프입니다.",
        '庚子': "모순과 헛소리를 단번에 잡아내는 냉철한 현실 조언가입니다. 감정적인 위로보다 정확한 해결책을 던져주어 가끔 차갑게 느껴지지만, 인생의 중요한 고민에 객관적인 조언이 필요할 때 이만한 해결사가 없습니다.",
        '辛丑': "속이 문드러져도 표정 변화 없이 참아내는 극강의 포커페이스입니다. 고집과 인내심이 엄청나서 쉽게 연을 끊지 않지만, 한계치를 넘기면 단호하게 돌아서므로 평소 속마음을 세심하게 살펴줘야 하는 조용한 화산 같은 친구입니다.",

                            gender: sessionStorage.getItem('me_gender'),
                            calendar: sessionStorage.getItem('me_calendar'),
                            youYear: sessionStorage.getItem('you_year'),
                            youMonth: sessionStorage.getItem('you_month'),
                            youDay: sessionStorage.getItem('you_day'),
                            youTime: sessionStorage.getItem('you_time'),
                            youGender: sessionStorage.getItem('you_gender'),
                            youCalendar: sessionStorage.getItem('you_calendar')
                        }
                    }, { merge: true });
                } catch (e) { console.error("영수증 저장 실패:", e); }
            }
        } else {
            if(headerBtn) { headerBtn.innerText = "로그인 / 가입"; headerBtn.onclick = openLogin; }
        }
    });

    window.realGoogleLogin = function() { signInWithPopup(auth, googleProvider).then(() => { closeLogin(); }).catch(console.error); }
    window.realKakaoLogin = function() { const kakaoProvider = new OAuthProvider('oidc.kakao'); signInWithPopup(auth, kakaoProvider).then(() => { closeLogin(); }).catch(console.error); }
</script>
<script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
    });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
</script>
</body>
</html>
