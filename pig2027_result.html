        function pairEvents11(ps,gz){
            const tables={
                합:['子丑','寅亥','卯戌','辰酉','巳申','午未'],
                반합:['亥卯','卯未','亥未','寅午','午戌','寅戌','巳酉','酉丑','巳丑','申子','子辰','申辰'],
                충:['子午','丑未','寅申','卯酉','辰戌','巳亥'],
                형:['寅巳','巳申','寅申','丑戌','戌未','丑未','子卯'],
                해:['子未','丑午','寅巳','卯辰','申亥','酉戌'],
                원진:['子未','丑午','寅酉','卯申','辰亥','巳戌'],
                파:['子酉','丑辰','寅亥','卯午','巳申','未戌']
            };
            const selfPunish = ['辰','午','酉','亥'];
            const out=[];
            for(const q of ps){
                for(const [type,pairs] of Object.entries(tables)){
                    if(pairs.some(pair=>pair.includes(q.gz[1])&&pair.includes(gz[1])&&q.gz[1]!==gz[1])){
                        out.push({type,pos:q.label,natal:q.gz,incoming:gz,part:'branch'});
                    }
                }
                if(q.gz[1]===gz[1]){
                    if(selfPunish.includes(gz[1])) out.push({type:'자형',pos:q.label,natal:q.gz,incoming:gz,part:'branch'});
                    out.push({type:q.gz===gz?'복음':'반복',pos:q.label,natal:q.gz,incoming:gz,part:'branch'});
                }
                if(['甲己','乙庚','丙辛','丁壬','戊癸'].some(pair=>pair.includes(q.gz[0])&&pair.includes(gz[0])&&q.gz[0]!==gz[0])){
                    out.push({type:'천간합',pos:q.label,natal:q.gz,incoming:gz,part:'stem'});
                }
                if(['甲庚','乙辛','丙壬','丁癸'].some(pair=>pair.includes(q.gz[0])&&pair.includes(gz[0])&&q.gz[0]!==gz[0])){
                    out.push({type:'천간충',pos:q.label,natal:q.gz,incoming:gz,part:'stem'});
                }
            }
            return out;
        }

        function natal11(bazi,known){
            const ps=[{label:'년주',gz:bazi.getYear()},{label:'월주',gz:bazi.getMonth()},{label:'일주',gz:bazi.getDay()}];
            if(known)ps.push({label:'시주',gz:bazi.getTime()});
            const d=ps[2].gz[0], dayBranch=ps[2].gz[1], monthBranch=ps[1].gz[1];
            const gods={},exposed={},roots=[];
            const elemCount={목:0,화:0,토:0,금:0,수:0};
            const groupWeights={비겁:0,식상:0,재성:0,관성:0,인성:0};

            for(const q of ps){
                const sElem = ELEM_STEM27[q.gz[0]];
                const bElem = ELEM_BRANCH27[q.gz[1]];
                elemCount[sElem] += 1;
                elemCount[bElem] += (q.label==='월주' ? 1.5 : 1);

                if(q.label!=='일주'){
                    const g=god27(d,q.gz[0]);
                    (gods[g]||=[]).push({pos:q.label,stem:q.gz[0],kind:'visible'});
                    (exposed[g]||=[]).push(q.label);
                    groupWeights[GOD_GROUP27[g]] += 12;
                } else {
                    groupWeights.비겁 += 10;
                }
                const hList = HIDDEN27[q.gz[1]];
                hList.forEach((s,i)=>{
                    const g=god27(d,s);
                    (gods[g]||=[]).push({pos:q.label,stem:s,kind:i?'hidden':'main'});
                    const w = (q.label==='월주' ? 28 : (q.label==='일주' ? 18 : 12)) * (i===0 ? 0.65 : (i===1 ? 0.25 : 0.10));
                    groupWeights[GOD_GROUP27[g]] += w;
                    if(Math.floor(STEMS27.indexOf(s)/2)===Math.floor(STEMS27.indexOf(d)/2)){
                        roots.push({pos:q.label,stem:s,main:i===0});
                    }
                });
            }

            const totalWeight = Object.values(groupWeights).reduce((a,b)=>a+b,0) || 100;
            const supportRatio = Math.round(((groupWeights.비겁 + groupWeights.인성) / totalWeight) * 100);
            let strength = '균형 잡힌 중심형';
            if(supportRatio >= 56) strength = '주관이 뚜렷한 주도형';
            else if(supportRatio <= 42) strength = '유연하고 섬세한 조율형';

            const hotDryBranches = ['巳','午','未','戌'];
            const coldWetBranches = ['亥','子','丑','辰'];
            let hotScore = 0, coldScore = 0;
            for(const q of ps){
                if(hotDryBranches.includes(q.gz[1])) hotScore += (q.label==='월주'?2:1);
                if(coldWetBranches.includes(q.gz[1])) coldScore += (q.label==='월주'?2:1);
                if(['丙','丁'].includes(q.gz[0])) hotScore += 0.8;
                if(['壬','癸'].includes(q.gz[0])) coldScore += 0.8;
            }
            let climate = '온도감이 고른 안정형';
            if(hotScore >= coldScore + 2) climate = '열정과 속도가 빠른 열기형';
            else if(coldScore >= hotScore + 2) climate = '차분하고 신중한 냉기형';

            const dayElemIdx = Math.floor(STEMS27.indexOf(d)/2);
            const elemOrder = ['목','화','토','금','수'];
            const myElem = elemOrder[dayElemIdx];
            const resourceElem = elemOrder[(dayElemIdx+4)%5];
            const outputElem = elemOrder[(dayElemIdx+1)%5];
            const wealthElem = elemOrder[(dayElemIdx+2)%5];
            const officialElem = elemOrder[(dayElemIdx+3)%5];

            let usefulElements = [];
            if(strength === '주관이 뚜렷한 주도형'){
                usefulElements = [outputElem, wealthElem, officialElem];
            } else if(strength === '유연하고 섬세한 조율형'){
                usefulElements = [resourceElem, myElem];
            } else {
                if(climate.includes('열기형')) usefulElements = ['수','금'];
                else if(climate.includes('냉기형')) usefulElements = ['화','목'];
                else usefulElements = [outputElem, wealthElem];
            }

            return {
                ps, d, dayBranch, monthBranch,
                gods, exposed, roots, month:ps[1].gz, known,
                elemCount, groupWeights, supportRatio, strength, climate, usefulElements
            };
        }

        function phase11(bazi,gender,known){
            const sex=['male','m','남','남자','남성','1'].includes(String(gender).toLowerCase())?1:['female','f','여','여자','여성','0'].includes(String(gender).toLowerCase())?0:null;
            if(sex===null||typeof bazi.getYun!=='function')return [];
            const yun=bazi.getYun(sex,2),first=yun.getStartSolar().nextHour(1),periods=[];
            for(const dy of yun.getDaYun(16)){
                if(dy.getIndex()<1)continue;
                const start=first.nextYear((dy.getIndex()-1)*10),end=first.nextYear(dy.getIndex()*10);
                if(start.toYmd()<'2028-02-05'&&end.toYmd()>'2027-01-01')periods.push({gz:dy.getGanZhi(),start,end});
            }
            return periods;
        }

        function model11(n,periods,gz,at,annual='丁未'){
            const period=periods.find(x=>x.start.getJulianDay()<=at.getJulianDay()&&x.end.getJulianDay()>at.getJulianDay())||null;
            const gods=[gz[0],...HIDDEN27[gz[1]]].map(s=>({stem:s,god:god27(n.d,s),exposed:n.exposed[god27(n.d,s)]||[],natal:n.gods[god27(n.d,s)]||[]}));
            const events=pairEvents11(n.ps,gz),yearEvents=pairEvents11(n.ps,annual),decadeEvents=period?pairEvents11(n.ps,period.gz):[];
            const decadePair=period?pairEvents11([{label:'대운',gz:period.gz}],gz):[];
            const yearPair=pairEvents11([{label:'세운',gz:annual}],gz);
            const branchSet=new Set(n.ps.map(q=>q.gz[1]).concat(period?[period.gz[1]]:[],annual[1],gz[1]));
            const fullFormations=['亥卯未','寅午戌','巳酉丑','申子辰','寅卯辰','巳午未','申酉戌','亥子丑'].filter(s=>s.includes(gz[1])&&[...s].every(z=>branchSet.has(z)));
            const halfFormations=['卯未','亥未','午未','巳未'].filter(s=>s.includes(gz[1])&&[...s].every(z=>branchSet.has(z)));
            const formations = fullFormations.length ? fullFormations : halfFormations;
            return {n,gz,at,annual,gods,events,yearEvents,period,decadeEvents,decadePair,yearPair,formations};
        }

        function record11(m,id,text,evidence){return {id,text,evidence:evidence||{incoming:m.gz,natal:m.n.ps.map(q=>q.gz),period:m.period?m.period.gz:null}};}
        function naturalJoin11(rows){return [...new Set(rows.filter(Boolean).map(x=>x.text||x))].join(' ');}

        function primary11(m,pos){
            const priority=['충','형','자형','해','원진','파','복음','합','반합','천간합','천간충','반복'];
            return m.events.filter(e=>e.pos===pos).sort((a,b)=>priority.indexOf(a.type)-priority.indexOf(b.type))[0];
        }

                    정관:'남과의 약속을 지키느라 내 건강을 돌보는 일을 계속 뒤로 미루고 있다면 병원 검진과 휴식을 일정표 맨 앞에 넣으세요.',
                    편인:'혼자 쉬는 시간에도 스마트폰으로 온갖 정보를 찾아보며 머리를 혹사하고 있지 않은지 점검해 보세요.',

                }

        function buildField11(m,field){
            const rows=[];
            const dayGz = m.n.ps[2].gz;
            const flowInfo = YEAR_2027_FLOW_DB[dayGz];

            if(field==='total'){
                // 1. 2027년에 어떤 운이 들어오고 어떻게 진행되며 어떤 일이 일어나는지 직관적 풀이
                if(flowInfo){
                    rows.push(record11(m,'flow2027.total.'+dayGz, flowInfo.total, {dayGz:dayGz}));
                    rows.push(record11(m,'flow2027.events.'+dayGz, flowInfo.events, {dayGz:dayGz}));
                }
                // 2. 세운 기운의 흐름
                const key=group11(m.gods[0].god)+group11(m.gods[1].god);
                rows.push(record11(m,'annual.pair.'+key,PAIR11[key],{stem:m.gods[0],branch:m.gods[1]}));
                rows.push(record11(m,'annual.stem.'+m.gods[0].god,STORY11[m.gods[0].god].total,m.gods[0]));
                // 3. 연주·월주·시주·일주 중 올해 가장 강하게 반응하는 생활 영역 풀이
                const daily=relation11(m,'일주','total');if(daily)rows.push(daily);
                const outer=['월주','년주','시주'].map(pos=>relation11(m,pos,'total')).filter(Boolean);
                const rank=['충','형','자형','해','원진','파','복음','합','반합','천간합','천간충','반복'];
                const chosen=outer.sort((a,b)=>rank.indexOf(a.evidence.type)-rank.indexOf(b.evidence.type))[0];
                if(chosen)rows.push(chosen);
            }else{
                // 세부 분야별: 2027년 핵심 흐름 + 사주 전체 상호작용 결합
                rows.push(record11(m,'annual.'+field+'.'+m.gods[0].god,STORY11[m.gods[0].god][field],m.gods[0]));
                if(flowInfo && flowInfo[field]){
                    rows.push(record11(m,'flow2027.'+field+'.'+dayGz, flowInfo[field], {dayGz:dayGz}));
                }
                const positions={love:['일주','년주','시주'],money:['시주','월주','일주'],career:['월주','시주'],move:['월주','년주'],health:['일주','월주','시주']}[field];
                for(const pos of positions){
                    const r=relation11(m,pos,field);
                    if(r)rows.push(r);
                    if(rows.length>=4)break;
                }
                if(m.gods[1].god!==m.gods[0].god){
                    rows.push(record11(m,'branch.'+field+'.'+m.gods[1].god,STORY11[m.gods[1].god][field],m.gods[1]));
                }
            }

            // 타고난 사주 전체의 에너지 강약·온도감에 따른 맞춤 조언
            const bal = balanceStory11(m, field);
            if(bal) rows.push(bal);

            rows.push(focus11(m,field));
            const formation=formation11(m,field);if(formation)rows.push(formation);
            const combos=combination11(m,field);if(combos.length)rows.push(combos[0]);else rows.push(presence11(m,field));
            const decade=decadeStory11(m,field);if(decade)rows.push(decade);
            if(field==='health')rows.push(record11(m,'health.limit','질병의 진단이나 회복 여부는 사주로 단정할 수 없으므로 실제 몸 상태와 병원 검진을 기준으로 살펴야 합니다.'));
            return rows;
        }

        function monthlyModel11(n,periods,i,jq){
            const row=MONTHS27[i];
            const start=jq[row[0]].nextHour(1),end=jq[i===11?'XIAO_HAN':MONTHS27[i+1][0]].nextHour(1);
            const at=start.nextHour(12);
            const m=model11(n,periods,row[2],at,i===0?'丙午':'丁未');
            m.start=start;m.end=end;m.index=i;m.jieqiKor=row[1];
            return m;
        }

        function monthRows11(m){
            const rows=[];
            rows.push(record11(m,'month.pair.'+m.gods[0].god+'.'+m.gods[1].god,opening11(m),{stem:m.gods[0],branch:m.gods[1]}));
            const detail=STORY11[m.gods[0].god].total.split(/(?<=。)|(?<=\.) /).slice(-1)[0];
            rows.push(record11(m,'month.stem.'+m.gods[0].god,detail,m.gods[0]));

            const positions=['일주','월주','년주','시주'];
            const priority=['충','형','자형','해','원진','파','복음','합','반합','천간합','천간충','반복'];
            const ranked=m.events.slice().sort((a,b)=>priority.indexOf(a.type)-priority.indexOf(b.type)||positions.indexOf(a.pos)-positions.indexOf(b.pos));
            const selected=[...new Set(ranked.map(e=>e.pos))].slice(0,2);
            for(const pos of selected){const r=relation11(m,pos,'total');if(r)rows.push(r);}

            const mStemElem = ELEM_STEM27[m.gz[0]], mBranchElem = ELEM_BRANCH27[m.gz[1]];
            const isUsefulMonth = m.n.usefulElements.includes(mBranchElem) || m.n.usefulElements.includes(mStemElem);
            if(isUsefulMonth){
                rows.push(record11(m,'month.useful.good','특히 이번 달은 내 사주에 부족했던 균형을 채워주는 고마운 기운이 들어오므로, 미뤄 두었던 중요한 대화나 계약, 업무 추진에 자신 있게 속도를 내어 볼 만합니다.'));
            } else {
                rows.push(record11(m,'month.useful.care','이번 달은 에너지가 한쪽으로 몰려 마음이 급해질 수 있으니, 무리하게 새 일을 벌이기보다 지출과 일정을 차분히 점검하며 내실을 다지는 편이 훨씬 유리합니다.'));
            }

            const combo=combination11(m,'total');if(combo.length&&rows.length<5)rows.push(combo[0]);
            if(!selected.length&&!combo.length)rows.push(presence11(m,'total'));
            const y=m.yearPair.find(e=>['충','합','반합','천간합'].includes(e.type));
            if(y&&m.index!==0){
                const line=y.type==='충'?'올해 세워둔 계획도 이번 달의 상황 변화에 맞춰 유연하게 조정할 필요가 있습니다. 아직 확정되지 않은 일에 큰돈부터 쓰지는 마세요.':'올해 마음속으로 구상하던 일이나 만남을 실제 약속과 행동으로 옮겨 좋은 결과를 만들 수 있는 달입니다.';
                rows.push(record11(m,'month.year.'+y.type,line,{year:m.annual,month:m.gz,event:y}));
            }
            const d=m.decadePair.find(e=>e.type==='충');if(d)rows.push(record11(m,'month.decade.change','이번 달의 선택이 평소 내가 준비해 오던 장기적인 방향과 다르다면, 당장의 기분뿐 아니라 몇 달 뒤의 생활에 미칠 영향까지 한 번 더 따져보세요.',d));
            if(m.index===0)rows.push(record11(m,'month.previous-year','1월은 작년에 시작했던 일과 인간관계를 깔끔하게 정리하면서 2027년의 새 흐름을 맞이하는 징검다리 시기입니다.',{year:'丙午',month:m.gz}));
            return rows;
        }

        function timing11(models,field){
            const positions={total:['년주','월주','일주','시주'],love:['일주','년주','시주'],money:['시주','월주','일주'],career:['월주','시주'],move:['월주','년주'],health:['일주','월주','시주']}[field];
            const relevant=models.filter(m=>m.index>0).map(m=>({m,e:m.events.filter(e=>positions.includes(e.pos))}));
            const changes=relevant.filter(x=>x.e.some(e=>['충','형','해','원진'].includes(e.type)));
            const links=relevant.filter(x=>!x.e.some(e=>['충','형'].includes(e.type))&&x.e.some(e=>['합','반합','천간합'].includes(e.type)));
            const area={total:'인간관계나 중요한 생활 계획',love:'연락과 만남, 진지한 관계 약속',money:'돈 관리와 계약·정산 조건',career:'담당 업무와 프로젝트 일정',move:'이직 지원과 조건 협상',health:'생활 리듬과 컨디션 관리'}[field];
            const out=[];
            if(links.length)out.push('🗓️ <b>일이 순조롭게 풀리고 합의가 잘 되는 달:</b> ' + links.slice(0,3).map(x=>(x.m.index+1)+'월').join('·')+'에는 '+area+'에서 좋은 소식을 기대하거나 주변과 구체적인 약속을 잡기에 아주 좋습니다.');
            if(changes.length)out.push('⚡ <b>변화가 생겨 꼼꼼히 점검해야 하는 달:</b> ' + changes.slice(0,3).map(x=>(x.m.index+1)+'월').join('·')+'에는 '+area+'에 예상치 못한 변동이나 조율할 일이 생기기 쉬우니 미리 여유를 두고 대처하세요.');
            if(!out.length){
                const usefulMonths = models.filter(m=>m.index>0 && m.n.usefulElements.includes(ELEM_BRANCH27[m.gz[1]])).slice(0,3);
                if(usefulMonths.length){
                    out.push('🗓️ <b>흐름이 안정되고 내실이 쌓이는 달:</b> ' + usefulMonths.map(m=>(m.index+1)+'월').join('·')+'에 나에게 유리한 기운이 들어오므로 '+area+'을 추진하기에 수월합니다.');
                }
            }
            return out.join('<br>');
        }

        function generateFortune2027(bazi,gender,timeKnown=true){
            const n=natal11(bazi,timeKnown),periods=phase11(bazi,gender,timeKnown),jq=Solar.fromYmd(2027,6,15).getLunar().getJieQiTable();
            const annualStart=jq['立春'].nextHour(1);
            const annual=model11(n,periods,'丁未',annualStart.nextHour(12));
            const months=MONTHS27.map((_,i)=>monthlyModel11(n,periods,i,jq));
            const audit={engine:'12-easy-korean',natal:n,year:'丁未',periods:periods.map(x=>({gz:x.gz,start:x.start.toYmd(),end:x.end.toYmd()})),sections:{},months:[]};
            const section=(title,ps)=>"<div class='fortune-section-card'><div class='fortune-section-title'>"+title+"</div><div class='fortune-content-text'>"+ps.filter(Boolean).map((s,idx)=>"<p class='"+(idx===ps.filter(Boolean).length-1 && idx>0 ? "point-box" : "")+"'>"+s+"</p>").join('')+'</div></div>';

            const stemTheme = GOD_EASY_THEME27[annual.gods[0].god] || '새로운 변화';
            const branchTheme = GOD_EASY_THEME27[annual.gods[1].god] || '현실적 결실';

            let html="<div class='fortune-result-title'>🐷 2027년 신년 프리미엄 사주"+(TEST_MODE?'(테스트11)':'')+"</div><div class='result-highlight'>";
            html+="<div style='font-size: 0.8rem; color: #999; margin-bottom: 10px;'>"+(TEST_MODE?'테스트11 · 양력 1990.10.07 · 진시 · 여자 · 결제 없음':'결제 번호: '+escape27(orderId))+"</div>";
            html+="<div class='bazi-display'>나의 타고난 사주 구성</div>";
            html+="<div class='bazi-sub-badge'>2027년 핵심 흐름: "+stemTheme+" + "+branchTheme+"</div>";
            html+="<div class='bazi-detail'>"+n.ps.map(q=>'<b>'+q.label+'</b>: '+name27(q.gz)+' ('+transFull(q.gz[0])+' · '+transFull(q.gz[1])+')').join('<br>')+(timeKnown?'':'<br><b>시주</b>: 태어난 시간 미입력 (연·월·일 중심으로 분석)');
            html+="<div class='bazi-meta-grid'>";
            html+="<div class='bazi-meta-item'><span class='bazi-meta-label'>타고난 에너지 성향</span>"+n.strength+" · "+n.climate+"</div>";
            html+="<div class='bazi-meta-item'><span class='bazi-meta-label'>나를 도와주는 기운</span>"+n.usefulElements.map(e=>ELEM_EASY27[e]).join(', ')+"</div>";
            html+="</div></div></div>";

            for(const [field,title] of [['total','🐽 2027년 신년 총운'],['love','💖 핑크빛 연애운 (Love)'],['money','🪙 황금 재물운 (Wealth)'],['career','🏢 직장/사업운 (Career)'],['move','🎓 취업/이직운 (Employment)'],['health','💪 튼튼 건강운 (Health)']]){
                const rows=buildField11(annual,field);
                const transition=periods.find(p=>p.start.getJulianDay()>annualStart.getJulianDay()&&p.start.toYmd()<'2028-02-04');
                if(transition){const p=transition;const d=model11(n,[p],annual.gz,p.start.nextHour(1));const r=decadeStory11(d,field);if(r)rows.push(record11(d,'decade.transition.'+field,p.start.getMonth()+'월 무렵부터 10년 단위의 큰 운의 흐름이 새로운 구간으로 접어듭니다. '+r.text,{next:p.gz,start:p.start.toYmd()}));}
                audit.sections[field]=rows;
                const third = Math.ceil(rows.length / 3);
                const p1 = naturalJoin11(rows.slice(0, third));
                const p2 = naturalJoin11(rows.slice(third, third * 2));
                const p3 = naturalJoin11(rows.slice(third * 2));
                html+=section(title,[p1, p2, p3, timing11(months,field)]);
            }
            html+="<div class='fortune-section-card'><div class='fortune-section-title'>🗓️ 2027년 12개월 월별 흐름 🐽</div><div style='margin-top: 10px;'>";
            months.forEach(m=>{
                const rows=monthRows11(m);
                audit.months.push({gz:m.gz,index:m.index,rows});
                const mBadge = (GOD_EASY_THEME27[m.gods[0].god] || m.gods[0].god);
                html+="<div class='month-box'><div class='month-title'><span>🐽 "+(m.index+1)+"월 운세</span><span class='month-badge'>"+mBadge+" 흐름</span></div><div class='month-desc'>"+naturalJoin11(rows)+"</div></div>";
            });
            window.__fortuneAudit11=audit;
            return html+'</div></div>';
        }

            setTimeout(() => {

                const dayStr = readSajuInput('saju_day') || '7';

                const year = parseInt(yearStr, 10);
                const month = parseInt(monthStr, 10);
                const day = parseInt(dayStr, 10);
                
                const timeMap = {
                    'unknown': 12, '모름': 12,
                    '자시': 0, '축시': 2, '인시': 4, '묘시': 6, '진시': 8,
                    '사시': 10, '오시': 12, '미시': 14, '신시': 16, '유시': 18, '술시': 20, '해시': 22
                };
                const isTimeKnown = timeStr !== 'unknown' && timeStr !== '모름' && Object.prototype.hasOwnProperty.call(timeMap, timeStr);
                const hour = isTimeKnown ? timeMap[timeStr] : 12;

                let lunarObj;
                if (calendarType === 'solar') {
                    lunarObj = Solar.fromYmdHms(year, month, day, hour, 0, 0).getLunar();
                } else if (calendarType === 'lunar') {
                    lunarObj = Lunar.fromYmdHms(year, month, day, hour, 0, 0);
                } else if (calendarType === 'lunar-leap') {
                    lunarObj = Lunar.fromYmdHms(year, -Math.abs(month), day, hour, 0, 0); 
                } else {
                    lunarObj = Solar.fromYmdHms(year, month, day, hour, 0, 0).getLunar();
                }

                // 년주·월주의 절입은 UTC+8 기준 라이브러리에 KST(UTC+9)를 환산해 비교한다.
                const localBazi = lunarObj.getEightChar();
                localBazi.setSect(2); // 일주는 자정에 교체. 시주는 입력한 시진 기준.
                const birthSolar = lunarObj.getSolar();
                const shifted = new Date(Date.UTC(birthSolar.getYear(), birthSolar.getMonth()-1, birthSolar.getDay(), hour-1, 0, 0));
                const termBazi = Solar.fromYmdHms(shifted.getUTCFullYear(), shifted.getUTCMonth()+1, shifted.getUTCDate(), shifted.getUTCHours(), 0, 0).getLunar().getEightChar();
                const bazi = {
                    getYear: () => termBazi.getYear(), getMonth: () => termBazi.getMonth(),
                    getDay: () => localBazi.getDay(), getTime: () => localBazi.getTime(),
                    getYun: (sex, sect) => termBazi.getYun(sex, sect)
                };
                
                const fortuneHtml = generateFortune2027(bazi, gender, isTimeKnown);

                document.getElementById('result-loading').style.display = 'none';
                document.getElementById('dynamic-fortune-content').innerHTML = fortuneHtml; 
                document.getElementById('dynamic-fortune-content').style.display = 'block';
                document.getElementById('go-home-btn').style.display = 'block';

            }, TEST_MODE ? 0 : 1200); 
        };

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        if (!TEST_MODE) {
            const firebaseConfig = {
                apiKey: "AIzaSyAZxy9VsEgOZ-e0FApXqHUT5cTxG3_g8o0",
                authDomain: "sajupig.firebaseapp.com",
                projectId: "sajupig",
                storageBucket: "sajupig.firebasestorage.app",
                messagingSenderId: "589751416400",
                appId: "1:589751416400:web:c7ed36efc6d5f23e020355",
                measurementId: "G-HGW4HHQ3WR"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const googleProvider = new GoogleAuthProvider();

            onAuthStateChanged(auth, async (user) => {
                const headerBtn = document.getElementById('header-user-btn');
                if (user) {
                    if(headerBtn) { headerBtn.innerText = "내정보"; headerBtn.onclick = function() { location.href = 'index.html?tab=myinfo'; }; }
                    
                    if (!TEST_MODE && orderId && paymentKey && paymentKey !== 'revisit') {
                        try {
                            const purchaseRef = doc(db, "users", user.uid, "purchases", orderId);
                            await setDoc(purchaseRef, {
                                orderId: orderId,
                                itemName: "2027 정미년 프리미엄 사주",
                                itemType: "pig2026",
                                purchaseDate: new Date().toISOString(),
                                sajuInfo: {
                                    year: readSajuInput('saju_year'),
                                    month: readSajuInput('saju_month'),
                                    day: readSajuInput('saju_day'),
                                    time: readSajuInput('saju_time'),
                                    gender: readSajuInput('saju_gender'),
                                    calendar: readSajuInput('saju_calendar')
                                }
                            }, { merge: true });
                            console.log("결제 내역 저장 완료");
                        } catch (e) { console.error("영수증 저장 실패:", e); }
                    }
                } else {
                    if(headerBtn) { headerBtn.innerText = "로그인 / 가입"; headerBtn.onclick = openLogin; }
                }
            });
 
            window.realGoogleLogin = function() { signInWithPopup(auth, googleProvider).then(() => { closeLogin(); }).catch(console.error); }
            window.realKakaoLogin = function() { const kakaoProvider = new OAuthProvider('oidc.kakao'); signInWithPopup(auth, kakaoProvider).then(() => { closeLogin(); }).catch(console.error); }
        }
    </script>
    <script>
    // 1. 마우스 우클릭 금지
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 2. F12 및 개발자 도구 단축키 금지
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.keyCode === 85) {
            e.preventDefault();
            return false;
        }
    });

    // 3. 마우스 드래그 금지 (텍스트 복사 방지)
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
    });
    </script>
</body>
</html>
